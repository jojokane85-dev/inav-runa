name: Find LSM6DXX SPL06 Targets

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-22.04

    steps:
      - name: Clone INAV 7.1.2
        run: |
          git clone --branch 7.1.2 --depth 1 https://github.com/iNavFlight/inav.git inav

      - name: Find similar targets
        run: |
          cd inav

          echo "===== TARGETS WITH LSM6DXX + SPL06 ====="
          for d in src/main/target/*; do
            if [ -f "$d/target.h" ]; then
              if grep -q "USE_IMU_LSM6DXX" "$d/target.h" && grep -q "USE_BARO_SPL06" "$d/target.h"; then
                echo "---- $d ----"
                grep -n -E "TARGET_BOARD_IDENTIFIER|BOARD_NAME|USE_IMU_LSM6DXX|LSM6DXX_SPI_BUS|LSM6DXX_CS_PIN|USE_BARO_SPL06|BARO_I2C_BUS|USE_MAG_HMC5883|MAG_I2C_BUS" "$d/target.h" || true
              fi
            fi
          done
