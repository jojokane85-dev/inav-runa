name: Build RUNA CADDXF405 WING FC45 INAV 7.1.2 FIXED

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      BASE_TARGET: SPEEDYBEEF405WING
      TARGET: CADDXF405_WING

    steps:
      - name: Install deps
        run: |
          sudo apt-get update -y -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            git \
            build-essential \
            g++ \
            ruby \
            cmake \
            make \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-dev \
            ninja-build \
            python3 \
            python3-pip

      - name: Clone INAV 7.1.2
        run: |
          git clone --branch 7.1.2 --depth 1 https://github.com/iNavFlight/inav.git
          cd inav
          echo "Current commit:"
          git rev-parse HEAD

      - name: Create CADDXF405_WING target from SPEEDYBEEF405WING
        run: |
          cd inav

          rm -rf src/main/target/${TARGET}
          cp -R src/main/target/${BASE_TARGET} src/main/target/${TARGET}

          echo "Fix CMakeLists target name..."
          sed -i "s/${BASE_TARGET}/${TARGET}/g" src/main/target/${TARGET}/CMakeLists.txt

          echo "Created target:"
          ls -la src/main/target/${TARGET}

          echo "CMakeLists:"
          cat src/main/target/${TARGET}/CMakeLists.txt

      - name: Patch CADDXF405_WING target to LSM6DXX
        run: |
          cd inav
          python3 <<'PY'
          from pathlib import Path
          import re
          import os

          target = os.environ["TARGET"]
          path = Path(f"src/main/target/{target}/target.h")
          text = path.read_text(encoding="utf-8")

          remove_patterns = [
              r'//\s*ICM42605/ICM42688P\s*',
              r'#define\s+USE_IMU_ICM42605\s*',
              r'#define\s+IMU_ICM42605_ALIGN\s+\S+\s*',
              r'#define\s+ICM42605_CS_PIN\s+\S+\s*',
              r'#define\s+ICM42605_SPI_BUS\s+\S+\s*',

              r'#define\s+USE_IMU_ICM42688P\s*',
              r'#define\s+IMU_ICM42688P_ALIGN\s+\S+\s*',
              r'#define\s+ICM42688P_CS_PIN\s+\S+\s*',
              r'#define\s+ICM42688P_SPI_BUS\s+\S+\s*',

              r'#define\s+USE_IMU_LSM6DXX\s*',
              r'#define\s+LSM6DXX_SPI_BUS\s+\S+\s*',
              r'#define\s+LSM6DXX_CS_PIN\s+\S+\s*',
              r'#define\s+IMU_LSM6DXX_ALIGN\s+\S+\s*',
          ]

          for pattern in remove_patterns:
              text = re.sub(pattern, "", text, flags=re.M)

          text += """

          /*
           * RUNA CADDXF405_WING FC 4.5
           *
           * Original working status:
           * INAV/CADDXF405_WING 7.1.2
           * GYRO=LSM6DXX
           * ACC=LSM6DXX
           * BARO=SPL06
           * MAG=HMC5883
           *
           * Pins:
           * PA4 = MPU CS
           * PA5 = SPI1 SCK
           * PA6 = SPI1 MISO
           * PA7 = SPI1 MOSI
           */
          #define USE_IMU_LSM6DXX
          #define LSM6DXX_SPI_BUS BUS_SPI1
          #define LSM6DXX_CS_PIN PA4
          #define IMU_LSM6DXX_ALIGN CW0_DEG
          """

          path.write_text(text, encoding="utf-8")

          check = path.read_text(encoding="utf-8")

          forbidden = [
              "USE_IMU_ICM42605",
              "ICM42605_CS_PIN",
              "ICM42605_SPI_BUS",
              "USE_IMU_ICM42688P",
              "ICM42688P_CS_PIN",
              "ICM42688P_SPI_BUS",
          ]

          for item in forbidden:
              if item in check:
                  print("ERROR: forbidden line still exists:", item)
                  raise SystemExit(1)

          required = [
              "USE_IMU_LSM6DXX",
              "LSM6DXX_SPI_BUS BUS_SPI1",
              "LSM6DXX_CS_PIN PA4",
              "IMU_LSM6DXX_ALIGN CW0_DEG",
          ]

          for item in required:
              if item not in check:
                  print("ERROR: required line missing:", item)
                  raise SystemExit(1)

          print("RUNA CADDXF405_WING target patched OK")
          print("IMU = LSM6DXX")
          print("BUS = SPI1")
          print("CS  = PA4")
          print("ALIGN = CW0_DEG")
          PY

          echo "==== CHECK CADDXF405_WING target.h IMU lines ===="
          grep -n -E "IMU|LSM6|ICM426|PA4|SPI1|CW0" src/main/target/${TARGET}/target.h || true

      - name: Patch LSM6DXX driver WHO_AM_I ROBUST
        run: |
          cd inav
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/main/drivers/accgyro/accgyro_lsm6dxx.c")
          text = path.read_text(encoding="utf-8")

          func_name = "static bool lsm6dxxDetect"
          func_start = text.find(func_name)

          if func_start == -1:
              print("ERROR: lsm6dxxDetect function not found")
              raise SystemExit(1)

          switch_start = text.find("switch", func_start)

          if switch_start == -1:
              print("ERROR: switch not found inside lsm6dxxDetect")
              print(text[func_start:func_start + 1500])
              raise SystemExit(1)

          brace_start = text.find("{", switch_start)

          if brace_start == -1:
              print("ERROR: switch opening brace not found")
              raise SystemExit(1)

          depth = 0
          switch_end = -1

          for i in range(brace_start, len(text)):
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
                  if depth == 0:
                      switch_end = i + 1
                      break

          if switch_end == -1:
              print("ERROR: switch closing brace not found")
              raise SystemExit(1)

          new_switch = """switch (tmp) {
          case 0x69:
          case 0x6A:
          case 0x6B:
          case 0x6C:
          case 0x6D:
              lsm6dID = tmp;
              // RUNA CADDXF405_WING compatible LSM6DXX chip detected
              return true;
          default:
              // Retry detection
              break;
          }"""

          text = text[:switch_start] + new_switch + text[switch_end:]
          path.write_text(text, encoding="utf-8")

          print("Patched LSM6DXX driver detection OK")
          print("Accepted WHO_AM_I: 0x69, 0x6A, 0x6B, 0x6C, 0x6D")
          PY

          echo "==== CHECK LSM6DXX DETECT ===="
          grep -n -A30 -B8 "static bool lsm6dxxDetect" src/main/drivers/accgyro/accgyro_lsm6dxx.c || true

      - name: Patch default acc hardware and ADC defaults
        run: |
          cd inav
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/fc/settings.yaml")
          text = path.read_text(encoding="utf-8")

          def patch_setting(text, name, value):
              pattern = rf"(-\s+name:\s*{re.escape(name)}\b(?:(?!\n\s*-\s+name:).)*?default_value:\s*)([^\n\r]+)"

              def repl(m):
                  print(f"{name}: {m.group(2).strip()} -> {value}")
                  return m.group(1) + str(value)

              new_text, count = re.subn(pattern, repl, text, count=1, flags=re.S)

              if count != 1:
                  print(f"WARNING: {name} default not found")

              return new_text

          text = patch_setting(text, "acc_hardware", "LSM6DXX")

          # Как в рабочем CADDXF405_WING:
          # RSSI ADC3, CURRENT ADC2, AIRSPEED ADC4
          text = patch_setting(text, "rssi_adc_channel", "3")
          text = patch_setting(text, "current_adc_channel", "2")
          text = patch_setting(text, "airspeed_adc_channel", "4")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Patch RUNA name in Configurator
        run: |
          cd inav
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/fc/fc_msp.c")
          text = path.read_text(encoding="utf-8")

          pattern = r'sbufWriteU8\(dst,\s*strlen\(targetName\)\);\s*sbufWriteData\(dst,\s*targetName,\s*strlen\(targetName\)\);'

          replacement = '''const char *runaTargetName = "CADDXF405_WING+RUNA";
                  sbufWriteU8(dst, strlen(runaTargetName));
                  sbufWriteData(dst, runaTargetName, strlen(runaTargetName));'''

          new_text, count = re.subn(pattern, replacement, text, count=1)

          if count == 1:
              path.write_text(new_text, encoding="utf-8")
              print("Patched Configurator target name: CADDXF405_WING+RUNA")
          else:
              print("WARNING: targetName MSP patch not found")
          PY

      - name: Patch startup text
        run: |
          cd inav
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/main/io/osd.c")
          text = path.read_text(encoding="utf-8")

          old = 'tfp_sprintf(string_buffer, "INAV VERSION: %s", FC_VERSION_STRING);'
          new = 'tfp_sprintf(string_buffer, "version RUNA 1.0");'

          if old in text:
              text = text.replace(old, new, 1)
              text = text.replace(
                  'uint8_t xPos = (osdDisplayPort->cols - 19) / 2;',
                  'uint8_t xPos = OSD_CENTER_S(string_buffer);',
                  1
              )
              path.write_text(text, encoding="utf-8")
              print("Startup text patched: version RUNA 1.0")
          else:
              print("WARNING: startup text line not found")
          PY

      - name: Patch RUNA OSD shutter
        run: |
          cd inav
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/io/osd.c")
          text = path.read_text(encoding="utf-8")

          pattern = r'osdDrawNextElement\(\);\s*displayHeartbeat\(osdDisplayPort\);\s*displayCommitTransaction\(osdDisplayPort\);'

          replacement = r'''
                  static bool runaShutterWasActive = false;
                  static uint8_t runaShutterNextRow = 0;

                  if (currentLayout == 2) {
                      textAttributes_t runaAttr = TEXT_ATTRIBUTES_NONE;
                      TEXT_ATTRIBUTES_ADD_SOLID_BG(runaAttr);

                      char runaMask[64];

                      uint8_t cols = osdDisplayPort->cols;
                      uint8_t rows = osdDisplayPort->rows;

                      if (cols > 63) {
                          cols = 63;
                      }

                      const uint8_t windowWidth = cols >= 30 ? 10 : cols / 3;
                      const uint8_t windowHeight = rows >= 16 ? 4 : rows / 3;

                      const uint8_t windowX = (cols - windowWidth) / 2;
                      const uint8_t windowY = (rows - windowHeight) / 2;

                      if (!runaShutterWasActive) {
                          displayClearScreen(osdDisplayPort);
                          runaShutterWasActive = true;
                          runaShutterNextRow = 0;
                      }

                      for (uint8_t pass = 0; pass < 2; pass++) {
                          uint8_t y = runaShutterNextRow;

                          const bool inWindowY = (y >= windowY) && (y < windowY + windowHeight);

                          if (!inWindowY) {
                              memset(runaMask, ' ', cols);
                              runaMask[cols] = '\0';
                              displayWriteWithAttr(osdDisplayPort, 0, y, runaMask, runaAttr);
                          } else {
                              if (windowX > 0) {
                                  memset(runaMask, ' ', windowX);
                                  runaMask[windowX] = '\0';
                                  displayWriteWithAttr(osdDisplayPort, 0, y, runaMask, runaAttr);
                              }

                              const uint8_t rightX = windowX + windowWidth;
                              if (rightX < cols) {
                                  const uint8_t rightWidth = cols - rightX;
                                  memset(runaMask, ' ', rightWidth);
                                  runaMask[rightWidth] = '\0';
                                  displayWriteWithAttr(osdDisplayPort, rightX, y, runaMask, runaAttr);
                              }
                          }

                          runaShutterNextRow++;

                          if (runaShutterNextRow >= rows) {
                              runaShutterNextRow = 0;
                          }
                      }
                  } else {
                      if (runaShutterWasActive) {
                          displayClearScreen(osdDisplayPort);
                          runaShutterWasActive = false;
                          runaShutterNextRow = 0;
                      }

                      osdDrawNextElement();
                  }

                  displayHeartbeat(osdDisplayPort);
                  displayCommitTransaction(osdDisplayPort);'''

          new_text, count = re.subn(pattern, replacement, text, count=1)

          if count != 1:
              print("ERROR: OSD draw block not found")
              raise SystemExit(1)

          path.write_text(new_text, encoding="utf-8")
          print("RUNA OSD shutter patched")
          PY

      - name: Configure CMake
        run: |
          cd inav
          mkdir -p build
          cd build
          cmake ..

      - name: Check target exists
        run: |
          cd inav/build
          echo "Checking target: ${TARGET}"
          make help | grep "${TARGET}" || {
            echo "TARGET NOT FOUND: ${TARGET}"
            echo "Trying to list CADDX / SPEEDY targets:"
            make help | grep -Ei "CADDX|CADDY|SPEEDY|F405WING" || true
            exit 1
          }

      - name: Build CADDXF405_WING
        run: |
          cd inav/build
          make clean_${TARGET} || true
          make ${TARGET} -j2 VERBOSE=1

      - name: Find firmware
        if: always()
        run: |
          echo "===== BUILT FILES ====="
          find inav/build -type f \( -name "*.hex" -o -name "*.bin" -o -name "*.elf" \) -print || true

      - name: Collect firmware
        if: success()
        run: |
          mkdir -p out/${TARGET}

          python3 <<'PY'
          from pathlib import Path
          import shutil
          import os

          target = os.environ["TARGET"]
          build_dir = Path("inav/build")
          out_dir = Path("out") / target
          out_dir.mkdir(parents=True, exist_ok=True)

          copied = 0

          for file in build_dir.rglob("*"):
              if not file.is_file():
                  continue

              if file.suffix.lower() not in {".hex", ".bin", ".elf"}:
                  continue

              if target not in file.name:
                  continue

              dst = out_dir / f"RUNA_FC45_CADDXF405_WING_LSM6DXX_FIXED_{file.name}"
              shutil.copy2(file, dst)
              print("Copied:", dst)
              copied += 1

          if copied == 0:
              print("ERROR: no firmware files found")
              raise SystemExit(1)

          print("Total copied:", copied)
          PY

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RUNA-FC45-CADDXF405-WING-LSM6DXX-FIXED
          path: out/${{ env.TARGET }}/*
