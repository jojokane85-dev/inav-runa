name: Build STM32F405 LED TEST

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - led_name: LED_PC13_LOW
            led_port: C
            led_pin: 13
            active_low: 1
          - led_name: LED_PC13_HIGH
            led_port: C
            led_pin: 13
            active_low: 0

          - led_name: LED_PB2_LOW
            led_port: B
            led_pin: 2
            active_low: 1
          - led_name: LED_PB2_HIGH
            led_port: B
            led_pin: 2
            active_low: 0

          - led_name: LED_PB9_LOW
            led_port: B
            led_pin: 9
            active_low: 1
          - led_name: LED_PB9_HIGH
            led_port: B
            led_pin: 9
            active_low: 0

          - led_name: LED_PA8_LOW
            led_port: A
            led_pin: 8
            active_low: 1
          - led_name: LED_PA8_HIGH
            led_port: A
            led_pin: 8
            active_low: 0

          - led_name: LED_PC14_LOW
            led_port: C
            led_pin: 14
            active_low: 1
          - led_name: LED_PC14_HIGH
            led_port: C
            led_pin: 14
            active_low: 0

          - led_name: LED_PC15_LOW
            led_port: C
            led_pin: 15
            active_low: 1
          - led_name: LED_PC15_HIGH
            led_port: C
            led_pin: 15
            active_low: 0

    env:
      PROJECT: stm32f405_led_test

    steps:
      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            make \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            python3

      - name: Create LED test source
        run: |
          mkdir -p ${PROJECT}

          cat > ${PROJECT}/main.c <<'EOF'
          /*
           * STM32F405 baremetal LED TEST
           *
           * Diagnostic only.
           * It only blinks one GPIO pin.
           */

          #include <stdint.h>

          #define LED_PORT_LETTER '${{ matrix.led_port }}'
          #define LED_PIN_NUM     ${{ matrix.led_pin }}
          #define LED_ACTIVE_LOW  ${{ matrix.active_low }}

          #define RCC_BASE        0x40023800UL
          #define GPIOA_BASE      0x40020000UL
          #define GPIOB_BASE      0x40020400UL
          #define GPIOC_BASE      0x40020800UL

          #define REG32(addr)     (*(volatile uint32_t *)(addr))

          #define RCC_AHB1ENR     REG32(RCC_BASE + 0x30)

          #define GPIO_MODER(p)   REG32((p) + 0x00)
          #define GPIO_OTYPER(p)  REG32((p) + 0x04)
          #define GPIO_OSPEEDR(p) REG32((p) + 0x08)
          #define GPIO_PUPDR(p)   REG32((p) + 0x0C)
          #define GPIO_BSRR(p)    REG32((p) + 0x18)

          static void delay_cycles(volatile uint32_t n)
          {
              while (n--) {
                  __asm volatile ("nop");
              }
          }

          static void delay_ms(uint32_t ms)
          {
              while (ms--) {
                  delay_cycles(4000);
              }
          }

          static uint32_t port_by_letter(char c)
          {
              if (c == 'A') return GPIOA_BASE;
              if (c == 'B') return GPIOB_BASE;
              return GPIOC_BASE;
          }

          static void gpio_output(uint32_t port, uint8_t pin)
          {
              GPIO_MODER(port) &= ~(3U << (pin * 2));
              GPIO_MODER(port) |=  (1U << (pin * 2));

              GPIO_OTYPER(port) &= ~(1U << pin);

              GPIO_OSPEEDR(port) &= ~(3U << (pin * 2));
              GPIO_OSPEEDR(port) |=  (2U << (pin * 2));

              GPIO_PUPDR(port) &= ~(3U << (pin * 2));
          }

          static void gpio_set_pin(uint32_t port, uint8_t pin)
          {
              GPIO_BSRR(port) = (1U << pin);
          }

          static void gpio_clear_pin(uint32_t port, uint8_t pin)
          {
              GPIO_BSRR(port) = (1U << (pin + 16));
          }

          static uint32_t led_port(void)
          {
              return port_by_letter(LED_PORT_LETTER);
          }

          static void led_on(void)
          {
              if (LED_ACTIVE_LOW) {
                  gpio_clear_pin(led_port(), LED_PIN_NUM);
              } else {
                  gpio_set_pin(led_port(), LED_PIN_NUM);
              }
          }

          static void led_off(void)
          {
              if (LED_ACTIVE_LOW) {
                  gpio_set_pin(led_port(), LED_PIN_NUM);
              } else {
                  gpio_clear_pin(led_port(), LED_PIN_NUM);
              }
          }

          static void clocks_setup(void)
          {
              /*
               * Enable GPIOA / GPIOB / GPIOC clocks.
               */
              RCC_AHB1ENR |= (1U << 0) | (1U << 1) | (1U << 2);
              delay_ms(10);
          }

          int main(void)
          {
              clocks_setup();

              gpio_output(led_port(), LED_PIN_NUM);
              led_off();

              delay_ms(1000);

              while (1) {
                  led_on();
                  delay_ms(250);
                  led_off();
                  delay_ms(250);
              }
          }
          EOF

          cat > ${PROJECT}/startup.c <<'EOF'
          #include <stdint.h>

          extern int main(void);

          extern uint32_t _estack;
          extern uint32_t _sidata;
          extern uint32_t _sdata;
          extern uint32_t _edata;
          extern uint32_t _sbss;
          extern uint32_t _ebss;

          void reset_handler(void);
          void default_handler(void);

          __attribute__((section(".isr_vector")))
          void (* const vector_table[])(void) = {
              (void (*)(void))(&_estack),
              reset_handler,
              default_handler,
              default_handler,
              default_handler,
              default_handler,
              default_handler,
              0,
              0,
              0,
              0,
              default_handler,
              default_handler,
              0,
              default_handler,
              default_handler,
          };

          void reset_handler(void)
          {
              uint32_t *src = &_sidata;
              uint32_t *dst = &_sdata;

              while (dst < &_edata) {
                  *dst++ = *src++;
              }

              dst = &_sbss;

              while (dst < &_ebss) {
                  *dst++ = 0;
              }

              main();

              while (1) {}
          }

          void default_handler(void)
          {
              while (1) {}
          }
          EOF

          cat > ${PROJECT}/linker.ld <<'EOF'
          MEMORY
          {
              FLASH (rx)  : ORIGIN = 0x08000000, LENGTH = 1024K
              RAM (xrw)   : ORIGIN = 0x20000000, LENGTH = 128K
          }

          _estack = ORIGIN(RAM) + LENGTH(RAM);

          SECTIONS
          {
              .isr_vector :
              {
                  KEEP(*(.isr_vector))
              } > FLASH

              .text :
              {
                  *(.text*)
                  *(.rodata*)
                  . = ALIGN(4);
                  _etext = .;
              } > FLASH

              _sidata = LOADADDR(.data);

              .data : AT(_etext)
              {
                  . = ALIGN(4);
                  _sdata = .;
                  *(.data*)
                  . = ALIGN(4);
                  _edata = .;
              } > RAM

              .bss :
              {
                  . = ALIGN(4);
                  _sbss = .;
                  *(.bss*)
                  *(COMMON)
                  . = ALIGN(4);
                  _ebss = .;
              } > RAM
          }
          EOF

          cat > ${PROJECT}/Makefile <<'EOF'
          PROJECT = led_test
          BUILD_DIR = build

          PREFIX ?= arm-none-eabi
          CC = $(PREFIX)-gcc
          OBJCOPY = $(PREFIX)-objcopy
          SIZE = $(PREFIX)-size

          CFLAGS = -Os -g -Wall -Wextra \
              -mcpu=cortex-m4 -mthumb -mfloat-abi=hard -mfpu=fpv4-sp-d16 \
              -ffreestanding -nostdlib

          LDFLAGS = -Tlinker.ld \
              -mcpu=cortex-m4 -mthumb -mfloat-abi=hard -mfpu=fpv4-sp-d16 \
              -nostdlib -Wl,--gc-sections

          SRCS = startup.c main.c
          OBJS = $(SRCS:%.c=$(BUILD_DIR)/%.o)

          all: $(BUILD_DIR)/$(PROJECT).elf $(BUILD_DIR)/$(PROJECT).bin $(BUILD_DIR)/$(PROJECT).hex
          	$(SIZE) $(BUILD_DIR)/$(PROJECT).elf

          $(BUILD_DIR):
          	mkdir -p $(BUILD_DIR)

          $(BUILD_DIR)/%.o: %.c | $(BUILD_DIR)
          	$(CC) $(CFLAGS) -c $< -o $@

          $(BUILD_DIR)/$(PROJECT).elf: $(OBJS)
          	$(CC) $(LDFLAGS) $^ -o $@

          $(BUILD_DIR)/$(PROJECT).bin: $(BUILD_DIR)/$(PROJECT).elf
          	$(OBJCOPY) -O binary $< $@

          $(BUILD_DIR)/$(PROJECT).hex: $(BUILD_DIR)/$(PROJECT).elf
          	$(OBJCOPY) -O ihex $< $@

          clean:
          	rm -rf $(BUILD_DIR)
          EOF

      - name: Build LED test
        run: |
          cd ${PROJECT}
          make clean
          make -j2

      - name: Collect artifacts
        run: |
          mkdir -p out

          cp ${PROJECT}/build/led_test.bin out/STM32F405_LED_TEST_${{ matrix.led_name }}.bin
          cp ${PROJECT}/build/led_test.hex out/STM32F405_LED_TEST_${{ matrix.led_name }}.hex
          cp ${PROJECT}/build/led_test.elf out/STM32F405_LED_TEST_${{ matrix.led_name }}.elf

          cat > out/README_${{ matrix.led_name }}.txt <<'EOF'
          STM32F405 LED TEST

          Diagnostic only.

          LED variant:
          ${{ matrix.led_name }}

          Expected result:
          - LED should blink every 0.25 seconds.

          If LED is just ON:
          - Try opposite active mode:
            LOW <-> HIGH

          If no blink on all variants:
          - LED pin is different
          - or firmware is not starting correctly
          - or board has no LED on tested pins

          Tested pins:
          PC13, PB2, PB9, PA8, PC14, PC15
          EOF

          ls -lah out

      - name: Upload LED test
        uses: actions/upload-artifact@v4
        with:
          name: STM32F405-LED-TEST-${{ matrix.led_name }}
          path: out/*
