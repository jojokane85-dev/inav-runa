name: Build RUNA FC45 SPIN FIX V2

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ALIGN_CW0
            imu_align: CW0_DEG
          - name: ALIGN_CW90
            imu_align: CW90_DEG
          - name: ALIGN_CW180
            imu_align: CW180_DEG
          - name: ALIGN_CW270
            imu_align: CW270_DEG
          - name: ALIGN_CW0_FLIP
            imu_align: CW0_DEG_FLIP
          - name: ALIGN_CW180_FLIP
            imu_align: CW180_DEG_FLIP

    env:
      INAV_VERSION: 7.1.2
      BASE_TARGET: SPEEDYBEEF405WING
      TARGET: CADDXF405_WING
      RUNA_NAME: CADDX45+RUNA

    steps:
      - name: Install deps
        run: |
          sudo apt-get update -y -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            git \
            build-essential \
            g++ \
            ruby \
            cmake \
            make \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-dev \
            ninja-build \
            python3 \
            python3-pip

      - name: Clone INAV 7.1.2
        run: |
          set -e

          for i in 1 2 3 4 5; do
            echo "Clone attempt $i"

            git clone \
              --branch ${INAV_VERSION} \
              --depth 1 \
              --single-branch \
              --config http.version=HTTP/1.1 \
              --config http.postBuffer=524288000 \
              https://github.com/iNavFlight/inav.git inav && break

            echo "Clone failed, retrying..."
            rm -rf inav
            sleep 10
          done

          test -d inav || exit 1
          cd inav
          git rev-parse HEAD

      - name: Create CADDXF405_WING target from SPEEDYBEEF405WING
        run: |
          cd inav

          rm -rf src/main/target/${TARGET}
          cp -R src/main/target/${BASE_TARGET} src/main/target/${TARGET}

          if [ -f "src/main/target/${TARGET}/CMakeLists.txt" ]; then
            sed -i "s/${BASE_TARGET}/${TARGET}/g" src/main/target/${TARGET}/CMakeLists.txt
          fi

          echo "Created target ${TARGET} from ${BASE_TARGET}"

      - name: Patch target hardware for RUNA FC45 SPIN FIX V2
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          target = os.environ["TARGET"]
          imu_align = "${{ matrix.imu_align }}"

          path = Path(f"src/main/target/{target}/target.h")

          if not path.exists():
              raise SystemExit(f"target.h not found: {path}")

          text = path.read_text(encoding="utf-8")

          # Board ID/name.
          text = re.sub(
              r'#define\s+TARGET_BOARD_IDENTIFIER\s+"[^"]+"',
              '#define TARGET_BOARD_IDENTIFIER "CDF4"',
              text
          )

          # Remove old IMU/BARO/MAG definitions from SpeedyBee base.
          remove_patterns = [
              r'^\s*#define\s+USE_IMU_ICM42605\s*$',
              r'^\s*#define\s+IMU_ICM42605_ALIGN\s+\S+\s*$',
              r'^\s*#define\s+ICM42605_CS_PIN\s+\S+\s*$',
              r'^\s*#define\s+ICM42605_SPI_BUS\s+\S+\s*$',
              r'^\s*#define\s+ICM42605_EXTI_PIN\s+\S+\s*$',

              r'^\s*#define\s+USE_IMU_ICM42688P\s*$',
              r'^\s*#define\s+IMU_ICM42688P_ALIGN\s+\S+\s*$',
              r'^\s*#define\s+ICM42688P_CS_PIN\s+\S+\s*$',
              r'^\s*#define\s+ICM42688P_SPI_BUS\s+\S+\s*$',
              r'^\s*#define\s+ICM42688P_EXTI_PIN\s+\S+\s*$',

              r'^\s*#define\s+USE_IMU_BMI270\s*$',
              r'^\s*#define\s+BMI270_CS_PIN\s+\S+\s*$',
              r'^\s*#define\s+BMI270_SPI_BUS\s+\S+\s*$',
              r'^\s*#define\s+BMI270_EXTI_PIN\s+\S+\s*$',
              r'^\s*#define\s+IMU_BMI270_ALIGN\s+\S+\s*$',

              r'^\s*#define\s+USE_IMU_MPU6000\s*$',
              r'^\s*#define\s+MPU6000_CS_PIN\s+\S+\s*$',
              r'^\s*#define\s+MPU6000_SPI_BUS\s+\S+\s*$',
              r'^\s*#define\s+MPU6000_EXTI_PIN\s+\S+\s*$',
              r'^\s*#define\s+IMU_MPU6000_ALIGN\s+\S+\s*$',

              r'^\s*#define\s+USE_IMU_MPU6500\s*$',
              r'^\s*#define\s+MPU6500_CS_PIN\s+\S+\s*$',
              r'^\s*#define\s+MPU6500_SPI_BUS\s+\S+\s*$',
              r'^\s*#define\s+MPU6500_EXTI_PIN\s+\S+\s*$',
              r'^\s*#define\s+IMU_MPU6500_ALIGN\s+\S+\s*$',

              r'^\s*#define\s+USE_IMU_LSM6DXX\s*$',
              r'^\s*#define\s+LSM6DXX_CS_PIN\s+\S+\s*$',
              r'^\s*#define\s+LSM6DXX_SPI_BUS\s+\S+\s*$',
              r'^\s*#define\s+LSM6DXX_EXTI_PIN\s+\S+\s*$',
              r'^\s*#define\s+IMU_LSM6DXX_ALIGN\s+\S+\s*$',

              r'^\s*#define\s+USE_BARO_BMP280\s*$',
              r'^\s*#define\s+USE_BARO_DPS310\s*$',
              r'^\s*#define\s+USE_BARO_MS5611\s*$',
              r'^\s*#define\s+USE_BARO_BMP085\s*$',
              r'^\s*#define\s+USE_BARO_ALL\s*$',
              r'^\s*#define\s+USE_BARO_SPL06\s*$',
              r'^\s*#define\s+BARO_I2C_BUS\s+\S+\s*$',

              r'^\s*#define\s+USE_MAG_ALL\s*$',
              r'^\s*#define\s+USE_MAG_HMC5883\s*$',
              r'^\s*#define\s+USE_MAG_QMC5883\s*$',
              r'^\s*#define\s+USE_MAG_IST8310\s*$',
              r'^\s*#define\s+USE_MAG_MAG3110\s*$',
              r'^\s*#define\s+USE_MAG_LIS3MDL\s*$',
              r'^\s*#define\s+MAG_I2C_BUS\s+\S+\s*$',
          ]

          for pattern in remove_patterns:
              text = re.sub(pattern, "", text, flags=re.M)

          text += f"""

          /*
           * RUNA FC4.5 SPIN FIX V2
           *
           * Restored old spinning base:
           * Base target: SPEEDYBEEF405WING
           * New target : CADDXF405_WING
           *
           * IMU  : LSM6DXX
           * SPI  : BUS_SPI1
           * CS   : PA4
           * ALIGN: {imu_align}
           *
           * BARO : SPL06 on I2C1
           * MAG  : HMC5883 on I2C1
           */

          #define USE_IMU_LSM6DXX
          #define LSM6DXX_SPI_BUS BUS_SPI1
          #define LSM6DXX_CS_PIN PA4
          #define IMU_LSM6DXX_ALIGN {imu_align}

          #define USE_BARO_SPL06
          #define BARO_I2C_BUS BUS_I2C1

          #define USE_MAG_HMC5883
          #define MAG_I2C_BUS BUS_I2C1
          """

          path.write_text(text, encoding="utf-8")

          print("===== RUNA target.h important lines =====")
          for line in text.splitlines():
              if any(x in line for x in [
                  "TARGET_BOARD_IDENTIFIER",
                  "USE_IMU_LSM6DXX",
                  "LSM6DXX_SPI_BUS",
                  "LSM6DXX_CS_PIN",
                  "IMU_LSM6DXX_ALIGN",
                  "USE_BARO_SPL06",
                  "BARO_I2C_BUS",
                  "USE_MAG_HMC5883",
                  "MAG_I2C_BUS",
              ]):
                  print(line)
          PY

      - name: Patch LSM6DXX gyroAlign fix
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path

          path = Path("src/main/drivers/accgyro/accgyro_lsm6dxx.c")

          if not path.exists():
              raise SystemExit("ERROR: accgyro_lsm6dxx.c not found")

          text = path.read_text(encoding="utf-8")

          fix = "gyro->gyroAlign = gyro->busDev->param;"

          if fix in text:
              print("LSM6DXX gyroAlign fix already present")
          else:
              old = "gyro->intStatusFn = gyroCheckDataReady;"
              new = "gyro->intStatusFn = gyroCheckDataReady;\n    gyro->gyroAlign = gyro->busDev->param;"

              if old not in text:
                  raise SystemExit("ERROR: Pattern not found: gyro->intStatusFn = gyroCheckDataReady;")

              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
              print("LSM6DXX gyroAlign fix added")

          print("===== gyroAlign check =====")
          for line in text.splitlines():
              if "gyroAlign" in line or "gyroCheckDataReady" in line:
                  print(line)
          PY

      - name: Patch LSM6DXX restored robust detect
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path

          path = Path("src/main/drivers/accgyro/accgyro_lsm6dxx.c")

          if not path.exists():
              print("accgyro_lsm6dxx.c not found, skip")
              raise SystemExit(0)

          text = path.read_text(encoding="utf-8")

          sig = "static bool lsm6dxxDetect"

          start = text.find(sig)

          if start == -1:
              print("lsm6dxxDetect not found, skip")
              raise SystemExit(0)

          brace = text.find("{", start)
          depth = 0
          end = -1

          for i in range(brace, len(text)):
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break

          if end == -1:
              print("lsm6dxxDetect end not found, skip")
              raise SystemExit(0)

          repl = """static bool lsm6dxxDetect(busDevice_t * dev)
          {
              uint8_t tmp = 0;

              busSetSpeed(dev, BUS_SPEED_INITIALIZATION);
              delay(150);
              busRead(dev, LSM6DXX_REG_WHO_AM_I, &tmp);

              /*
               * RUNA FC4.5 restored robust LSM6DXX detect.
               *
               * This recreates the old variant where the board connected and
               * GYRO/ACC appeared, but now gyroAlign fix and IMU align matrix
               * are also applied.
               *
               * Accept common LSM6DXX IDs if read is valid.
               * If read is invalid, keep LSM6DS3 as fallback so INAV still starts.
               */
              if (tmp == 0x69 || tmp == 0x6A || tmp == 0x6B || tmp == 0x6C || tmp == 0x6D) {
                  lsm6dID = tmp;
              } else {
                  lsm6dID = LSM6DS3_CHIP_ID;
              }

              return true;
          }"""

          text = text[:start] + repl + text[end:]
          path.write_text(text, encoding="utf-8")

          print("RUNA restored robust LSM6DXX detect patched")
          PY

      - name: Patch RUNA name in MSP
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path
          import re
          import os

          runa_name = os.environ["RUNA_NAME"]

          path = Path("src/main/fc/fc_msp.c")

          if not path.exists():
              print("fc_msp.c not found, skip")
              raise SystemExit(0)

          text = path.read_text(encoding="utf-8")

          pattern = r'sbufWriteU8\(dst,\s*strlen\(targetName\)\);\s*sbufWriteData\(dst,\s*targetName,\s*strlen\(targetName\)\);'

          replacement = f'''const char *runaTargetName = "{runa_name}";
                  sbufWriteU8(dst, strlen(runaTargetName));
                  sbufWriteData(dst, runaTargetName, strlen(runaTargetName));'''

          text, count = re.subn(pattern, replacement, text, count=1)

          path.write_text(text, encoding="utf-8")
          print("MSP RUNA name patch count:", count)
          PY

      - name: Patch startup OSD text
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path

          path = Path("src/main/io/osd.c")

          if not path.exists():
              print("osd.c not found, skip")
              raise SystemExit(0)

          text = path.read_text(encoding="utf-8")

          old = 'tfp_sprintf(string_buffer, "INAV VERSION: %s", FC_VERSION_STRING);'
          new = 'tfp_sprintf(string_buffer, "RUNA45 FIX");'

          if old in text:
              text = text.replace(old, new, 1)
              text = text.replace(
                  'uint8_t xPos = (osdDisplayPort->cols - 19) / 2;',
                  'uint8_t xPos = OSD_CENTER_S(string_buffer);',
                  1
              )
              print("Startup OSD text patched")
          else:
              print("WARNING: startup text pattern not found")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Configure CMake
        run: |
          cd inav
          mkdir -p build
          cd build
          cmake ..

      - name: Check target exists
        run: |
          cd inav/build

          if make help | grep -w "${TARGET}"; then
            echo "Target found: ${TARGET}"
          else
            echo "TARGET NOT FOUND: ${TARGET}"
            make help | grep -i -E "CADDX|SPEEDY|F405|WING" || true
            exit 1
          fi

      - name: Build firmware
        run: |
          cd inav/build
          make clean_${TARGET} || true
          make ${TARGET} -j2 VERBOSE=1

      - name: Find built files
        if: always()
        run: |
          echo "Built firmware files:"
          find inav/build -type f \( -name "*.hex" -o -name "*.bin" -o -name "*.elf" \) -print || true

      - name: Collect firmware and CLI
        run: |
          mkdir -p out

          FOUND=0

          while IFS= read -r f; do
            base="$(basename "$f")"
            dst="out/RUNA_FC45_SPIN_FIX_V2_${{ matrix.name }}_${base}"
            cp "$f" "$dst"
            echo "Copied: $dst"
            FOUND=$((FOUND + 1))
          done < <(find inav/build -type f \( -name "*${TARGET}*.hex" -o -name "*${TARGET}*.bin" -o -name "*${TARGET}*.elf" \))

          if [ "$FOUND" -eq 0 ]; then
            echo "ERROR: no firmware files found"
            find inav/build -type f \( -name "*.hex" -o -name "*.bin" -o -name "*.elf" \) -print || true
            exit 1
          fi

          cat > out/RUNA_FC45_SPIN_FIX_V2_${{ matrix.name }}_BASE.cli <<'EOF'
          batch start

          # RUNA FC4.5 SPIN FIX V2
          # Variant: ${{ matrix.name }}
          # IMU align: ${{ matrix.imu_align }}
          #
          # Diagnostic first. Do not fly until 3D model is correct.

          feature -GPS
          feature OSD
          feature PWM_OUTPUT_ENABLE
          feature TELEMETRY
          feature CURRENT_METER
          feature BLACKBOX

          set acc_hardware = LSM6DXX
          set baro_hardware = SPL06
          set mag_hardware = HMC5883

          set align_mag = CW0FLIP

          set align_board_roll = 0
          set align_board_pitch = 0
          set align_board_yaw = 1800

          set gyro_zero_x = 0
          set gyro_zero_y = 0
          set gyro_zero_z = 0

          set acczero_x = 0
          set acczero_y = 0
          set acczero_z = 0

          set accgain_x = 4096
          set accgain_y = 4096
          set accgain_z = 4096

          # calm filters for table test
          set gyro_main_lpf_hz = 10
          set gyro_anti_aliasing_lpf_hz = 50
          set dynamic_gyro_notch_min_hz = 30
          set dynamic_gyro_notch_q = 250
          set dterm_lpf_hz = 5

          set receiver_type = SERIAL
          set serialrx_provider = CRSF

          set vbat_adc_channel = 1
          set rssi_adc_channel = 4
          set current_adc_channel = 2
          set airspeed_adc_channel = 3

          set nav_extra_arming_safety = OFF
          set gps_auto_config = OFF
          set gps_auto_baud = OFF
          set gps_min_sats = 0
          set failsafe_procedure = NONE
          set small_angle = 180

          # very low manual rates for safe bench test
          profile 1
          set roll_rate = 5
          set pitch_rate = 5
          set yaw_rate = 2
          set rc_expo = 50
          set rc_yaw_expo = 50

          save
          EOF

          cat > out/README_RUNA_FC45_SPIN_FIX_V2_${{ matrix.name }}.txt <<'EOF'
          RUNA FC45 SPIN FIX V2

          This rebuilds the old spinning FC4.5 custom firmware path:
          - INAV 7.1.2
          - Base target: SPEEDYBEEF405WING
          - New target: CADDXF405_WING
          - IMU: LSM6DXX
          - SPI: BUS_SPI1
          - CS: PA4
          - BARO: SPL06
          - MAG: HMC5883

          Added:
          - LSM6DXX gyroAlign fix
          - restored robust LSM6DXX detect
          - IMU align matrix variant
          - calm gyro filters in CLI

          Variant:
          ${{ matrix.name }}

          IMU align:
          ${{ matrix.imu_align }}

          Flash:
          1. DFU
          2. Full chip erase
          3. Flash this variant HEX

          After flash:
          1. CLI:
             defaults
             save

          2. Wait 15 seconds, do not move board.

          3. Apply:
             RUNA_FC45_SPIN_FIX_V2_${{ matrix.name }}_BASE.cli

          4. Calibration -> Calibrate Accelerometer

          5. Check:
             status
             get align_board

          Good:
          - GYRO=OK
          - ACC=OK
          - BARO=OK
          - MAG=OK
          - 3D model does not spin fast
          - axes are correct or close

          Bad:
          - GYRO/ACC unavailable
          - 3D spins fast
          - board does not connect

          Do not fly.
          Do not install propeller.
          EOF

          ls -lah out

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: RUNA-FC45-SPIN-FIX-V2-${{ matrix.name }}
          path: out/*
