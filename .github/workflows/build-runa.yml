name: Build RUNA FC 5.1 Custom Fixed Version

on:
  workflow_dispatch:
    inputs:
      target:
        description: "FC target"
        required: true
        default: "SPEEDYBEEF405WING"

      runa_name:
        description: "RUNA name, must be same length or shorter than target"
        required: true
        default: "RUNA_FC51_F405WG"

      inav_ref:
        description: "Fixed INAV version/tag. Do NOT use master."
        required: true
        default: "7.1.2"

jobs:
  build-runa:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            make \
            cmake \
            ninja-build \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            python3 \
            python3-pip \
            curl \
            unzip

      - name: Clone fixed INAV version
        run: |
          git clone --recursive https://github.com/iNavFlight/inav.git inav
          cd inav
          git fetch --tags
          git checkout "${{ github.event.inputs.inav_ref }}"
          git submodule update --init --recursive

      - name: Show INAV version info
        run: |
          cd inav
          echo "================================"
          echo "RUNA CUSTOM BUILD"
          echo "Target: ${{ github.event.inputs.target }}"
          echo "RUNA name: ${{ github.event.inputs.runa_name }}"
          echo "INAV ref: ${{ github.event.inputs.inav_ref }}"
          echo "================================"
          git log -1 --oneline
          git describe --tags --always || true

      - name: Create RUNA patch script
        run: |
          mkdir -p scripts

          cat > scripts/patch_runa_name.py <<'PY'
          #!/usr/bin/env python3
          import argparse
          from pathlib import Path

          def patch_file(path: Path, old: bytes, new: bytes) -> bool:
              data = path.read_bytes()

              if old not in data:
                  print(f"[SKIP] {path.name}: target string not found")
                  return False

              if len(new) > len(old):
                  raise ValueError(
                      f"RUNA name too long: {new.decode(errors='ignore')} "
                      f"({len(new)} bytes) > target name "
                      f"{old.decode(errors='ignore')} ({len(old)} bytes). "
                      f"Use shorter runa_name."
                  )

              new_padded = new + b"\x00" * (len(old) - len(new))
              patched = data.replace(old, new_padded)
              path.write_bytes(patched)

              print(f"[OK] {path.name}: {old!r} -> {new_padded!r}")
              return True

          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("--folder", required=True)
              parser.add_argument("--old", required=True)
              parser.add_argument("--new", required=True)
              args = parser.parse_args()

              folder = Path(args.folder)
              old = args.old.encode("ascii")
              new = args.new.encode("ascii")

              if not folder.exists():
                  raise FileNotFoundError(folder)

              files = []
              for pattern in ("*.hex", "*.bin", "*.elf"):
                  files.extend(folder.rglob(pattern))

              if not files:
                  raise RuntimeError("No firmware files found")

              count = 0

              for f in files:
                  try:
                      if patch_file(f, old, new):
                          count += 1
                  except Exception as e:
                      print(f"[ERROR] {f}: {e}")

              print(f"Patched files: {count}")

              if count == 0:
                  print("WARNING: no files patched. Firmware built, but name may remain original.")

          if __name__ == "__main__":
              main()
          PY

      - name: Create RUNA CLI files
        run: |
          mkdir -p cli

          cat > cli/RUNA_FC51_VTX_5G8.cli <<'CLI'
          # RUNA FC 5.1 - VTX 5.8
          # Частоты RUNA:
          # 5820 / 5695 / 5733

          set vtx_band = 5
          set vtx_channel = 3
          set vtx_freq = 5733
          set vtx_power = 5

          save
          CLI

          cat > cli/RUNA_FC51_VTX_3G3.cli <<'CLI'
          # RUNA FC 5.1 - VTX 3.3
          # ВНИМАНИЕ:
          # Использовать только если VTX реально поддерживает 3.3 GHz.
          # Обычный VTX 5.8 на 3.3 GHz работать не будет.

          set vtx_band = 1
          set vtx_channel = 1
          set vtx_freq = 3300
          set vtx_power = 5

          save
          CLI

          cat > cli/RUNA_FC51_SHUTTER_ARM_DISARM.cli <<'CLI'
          # RUNA FC 5.1
          # ШТОРА + VTX POWER ARM/DISARM

          # Нужно:
          # DISARM -> VTX low power / power 1
          # ARM    -> VTX power 5

          set vtx_power = 5
          set vtx_low_power_disarm = ON

          # ШТОРА:
          #
          # В INAV Configurator:
          #
          # 1. OSD -> Layout 0 = обычный экран
          # 2. OSD -> Layout 1 = шторка
          # 3. В Layout 1 убери высоту/лишние элементы
          # 4. Modes -> назначить CH8/AUX4:
          #
          # LOW/MID 900-1666  = обычный экран / Layout 0
          # HIGH    1667-2100 = шторка / Layout 1
          #
          # CLI-команды OSD Layout в разных версиях INAV могут отличаться,
          # поэтому саму штору безопаснее назначать через Configurator.

          save
          CLI

          cat > cli/RUNA_FC51_ALL_IN_ONE_SAFE.cli <<'CLI'
          # RUNA FC 5.1 - ALL IN ONE SAFE CLI
          #
          # Этот файл НЕ трогает:
          # - gyro axes
          # - board alignment
          # - UART
          # - motors
          # - servos
          # - mixer
          #
          # Поэтому меньше шанс снова получить проблему,
          # где работает только YAW.

          # -------------------------------
          # VTX 5.8 DEFAULT
          # -------------------------------

          set vtx_band = 5
          set vtx_channel = 3
          set vtx_freq = 5733
          set vtx_power = 5

          # -------------------------------
          # DISARM / ARM VTX POWER
          # -------------------------------

          # DISARM -> low power / power 1
          # ARM    -> vtx_power 5

          set vtx_low_power_disarm = ON

          # -------------------------------
          # ШТОРА
          # -------------------------------
          #
          # Настроить руками в INAV Configurator:
          #
          # OSD Layout 0 = обычный экран
          # OSD Layout 1 = шторка
          #
          # CH8/AUX4 LOW/MID = Layout 0
          # CH8/AUX4 HIGH    = Layout 1

          save
          CLI

      - name: Build INAV firmware
        run: |
          mkdir -p inav/build
          cd inav/build
          cmake ..
          make "${{ github.event.inputs.target }}" -j"$(nproc)"

      - name: Patch firmware name to RUNA
        run: |
          python3 scripts/patch_runa_name.py \
            --folder inav/build \
            --old "${{ github.event.inputs.target }}" \
            --new "${{ github.event.inputs.runa_name }}"

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          mkdir -p artifact/cli

          find inav/build -type f \( -name "*.hex" -o -name "*.bin" -o -name "*.elf" \) -exec cp {} artifact/ \;

          cp cli/*.cli artifact/cli/

          cat > artifact/RUNA_INFO.txt <<EOF
          RUNA FC 5.1 CUSTOM FIXED VERSION

          Base target:
          ${{ github.event.inputs.target }}

          RUNA name:
          ${{ github.event.inputs.runa_name }}

          INAV version/tag:
          ${{ github.event.inputs.inav_ref }}

          IMPORTANT:
          This workflow uses fixed INAV tag:
          ${{ github.event.inputs.inav_ref }}

          It does NOT use master.
          So it should NOT accidentally build INAV 9.0.1.

          Functions:
          - RUNA name patch
          - VTX 5.8
          - VTX 3.3
          - ШТОРА / OSD Layout idea
          - DISARM -> VTX low power / power 1
          - ARM -> VTX power 5

          CLI files:
          - cli/RUNA_FC51_VTX_5G8.cli
          - cli/RUNA_FC51_VTX_3G3.cli
          - cli/RUNA_FC51_SHUTTER_ARM_DISARM.cli
          - cli/RUNA_FC51_ALL_IN_ONE_SAFE.cli

          After flashing:
          1. Open INAV Configurator
          2. Connect FC
          3. Open CLI
          4. Paste:
             cli/RUNA_FC51_ALL_IN_ONE_SAFE.cli

          Or separately:
          1. Paste VTX profile:
             cli/RUNA_FC51_VTX_5G8.cli
             or
             cli/RUNA_FC51_VTX_3G3.cli

          2. Paste:
             cli/RUNA_FC51_SHUTTER_ARM_DISARM.cli

          This build does not touch:
          - gyro axes
          - UART
          - motors
          - servos
          - mixer
          - receiver mapping
          EOF

          echo "=== ARTIFACT FILES ==="
          find artifact -type f -print

      - name: Upload RUNA firmware
        uses: actions/upload-artifact@v4
        with:
          name: RUNA_FC51_CUSTOM_FIXED
          path: artifact/
