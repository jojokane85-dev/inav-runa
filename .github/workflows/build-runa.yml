name: Build RUNA CADDXF405WING TEST V2 IMU

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      TARGET: CADDXF405WING

    steps:
      - name: Install deps
        run: |
          sudo apt-get update -y -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            git \
            build-essential \
            g++ \
            ruby \
            cmake \
            make \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-dev \
            ninja-build \
            python3 \
            python3-pip

      - name: Clone INAV
        run: |
          git clone --branch 7.1.2 --depth 1 https://github.com/iNavFlight/inav.git

      - name: Create experimental CADDXF405WING target V2 IMU
        run: |
          cd inav

          mkdir -p src/main/target/CADDXF405WING

          cat > src/main/target/CADDXF405WING/CMakeLists.txt <<'EOF'
          target_stm32f405xg(CADDXF405WING)
          EOF

          cat > src/main/target/CADDXF405WING/target.h <<'EOF'
          /*
           * RUNA experimental target for CADDXF405 WING
           * V2 IMU autoprobe.
           * TEST ONLY. Check on bench before flight.
           */

          #pragma once

          #define TARGET_BOARD_IDENTIFIER "CD4W"
          #define USBD_PRODUCT_STRING "CADDXF405 WING RUNA"

          // LEDs
          #define LED0 PA14
          #define LED1 PA13

          // Beeper
          #define BEEPER PC15
          #define BEEPER_INVERTED

          /*
           * SPI buses
           */

          #define USE_SPI

          // SPI1 - IMU
          #define USE_SPI_DEVICE_1
          #define SPI1_SCK_PIN PA5
          #define SPI1_MISO_PIN PA6
          #define SPI1_MOSI_PIN PA7

          // SPI2 - OSD MAX7456
          #define USE_SPI_DEVICE_2
          #define SPI2_SCK_PIN PB13
          #define SPI2_MISO_PIN PC2
          #define SPI2_MOSI_PIN PC3

          // SPI3 - SD card
          #define USE_SPI_DEVICE_3
          #define SPI3_SCK_PIN PB3
          #define SPI3_MISO_PIN PB4
          #define SPI3_MOSI_PIN PB5

          /*
           * Serial ports from your resource:
           * A09/A10 = UART1
           * C12     = UART5 TX/RX
           * C06/C07 = UART6
           */

          #define USE_VCP

          #define USE_UART1
          #define UART1_TX_PIN PA9
          #define UART1_RX_PIN PA10

          #define USE_UART5
          #define UART5_TX_PIN PC12
          #define UART5_RX_PIN PD2

          #define USE_UART6
          #define UART6_TX_PIN PC6
          #define UART6_RX_PIN PC7

          // VCP + UART1 + UART5 + UART6
          #define SERIAL_PORT_COUNT 4

          /*
           * I2C1 - BARO/MAG
           */

          #define USE_I2C
          #define USE_I2C_DEVICE_1
          #define I2C1_SCL PB8
          #define I2C1_SDA PB9
          #define DEFAULT_I2C_BUS BUS_I2C1

          /*
           * IMU AUTOPROBE V2
           *
           * Original resource:
           * A04 = MPU CS
           * A05 = SPI1 SCK
           * A06 = SPI1 MISO
           * A07 = SPI1 MOSI
           *
           * We try several possible IMU chips on the same SPI1 / CS PA4.
           * After one works, remove the extra drivers.
           */

          #define USE_IMU_LSM6DXX
          #define LSM6DXX_SPI_BUS BUS_SPI1
          #define LSM6DXX_CS_PIN PA4
          #define IMU_LSM6DXX_ALIGN CW0_DEG

          #define USE_IMU_ICM42605
          #define ICM42605_SPI_BUS BUS_SPI1
          #define ICM42605_CS_PIN PA4
          #define IMU_ICM42605_ALIGN CW270_DEG

          #define USE_IMU_MPU6000
          #define MPU6000_SPI_BUS BUS_SPI1
          #define MPU6000_CS_PIN PA4
          #define IMU_MPU6000_ALIGN CW0_DEG

          #define USE_IMU_MPU6500
          #define MPU6500_SPI_BUS BUS_SPI1
          #define MPU6500_CS_PIN PA4
          #define IMU_MPU6500_ALIGN CW0_DEG

          #define USE_IMU_ICM20689
          #define ICM20689_SPI_BUS BUS_SPI1
          #define ICM20689_CS_PIN PA4
          #define IMU_ICM20689_ALIGN CW0_DEG

          #define USE_IMU_BMI270
          #define BMI270_SPI_BUS BUS_SPI1
          #define BMI270_CS_PIN PA4
          #define IMU_BMI270_ALIGN CW0_DEG

          /*
           * Barometer
           */

          #define USE_BARO
          #define BARO_I2C_BUS BUS_I2C1
          #define USE_BARO_SPL06
          #define USE_BARO_DPS310
          #define USE_BARO_BMP280
          #define USE_BARO_MS5611

          /*
           * Magnetometer
           */

          #define USE_MAG
          #define MAG_I2C_BUS BUS_I2C1
          #define USE_MAG_HMC5883
          #define USE_MAG_QMC5883
          #define USE_MAG_ALL

          #define RANGEFINDER_I2C_BUS BUS_I2C1
          #define PITOT_I2C_BUS BUS_I2C1
          #define TEMPERATURE_I2C_BUS BUS_I2C1

          /*
           * OSD
           */

          #define USE_OSD
          #define USE_MAX7456
          #define MAX7456_SPI_BUS BUS_SPI2
          #define MAX7456_CS_PIN PB12

          /*
           * SD card
           */

          #define USE_SDCARD
          #define USE_SDCARD_SPI
          #define SDCARD_SPI_BUS BUS_SPI3
          #define SDCARD_CS_PIN PC14
          #define ENABLE_BLACKBOX_LOGGING_ON_SDCARD_BY_DEFAULT

          /*
           * Receiver defaults
           */

          #define DEFAULT_RX_TYPE RX_TYPE_SERIAL
          #define SERIALRX_PROVIDER SERIALRX_CRSF
          #define SERIALRX_UART SERIAL_PORT_USART1

          /*
           * ADC from resource:
           * C00 = ADC CH1 / VBAT
           * C01 = ADC CH2 / CURRENT
           */

          #define USE_ADC
          #define ADC_INSTANCE ADC1
          #define ADC1_DMA_STREAM DMA2_Stream0
          #define ADC_CHANNEL_1_PIN PC0
          #define ADC_CHANNEL_2_PIN PC1
          #define VBAT_ADC_CHANNEL ADC_CHN_1
          #define CURRENT_METER_ADC_CHANNEL ADC_CHN_2

          /*
           * PINIO
           */

          #define USE_PINIO
          #define USE_PINIOBOX
          #define PINIO1_PIN PC13

          /*
           * Defaults
           */

          #define DEFAULT_FEATURES (FEATURE_TX_PROF_SEL | FEATURE_VBAT | FEATURE_CURRENT_METER | FEATURE_TELEMETRY | FEATURE_BLACKBOX | FEATURE_AIRMODE | FEATURE_VTX | FEATURE_PWM_OUTPUT_ENABLE | FEATURE_OSD)

          #define CURRENT_METER_SCALE 160

          #define TARGET_IO_PORTA 0xffff
          #define TARGET_IO_PORTB 0xffff
          #define TARGET_IO_PORTC 0xffff
          #define TARGET_IO_PORTD (BIT(2))

          #define MAX_PWM_OUTPUT_PORTS 6
          EOF

          cat > src/main/target/CADDXF405WING/target.c <<'EOF'
          /*
           * RUNA experimental target for CADDXF405 WING.
           *
           * User resource:
           * PB7 = MOTOR1
           * PB6 = MOTOR2
           * PB0 = SERVO3
           * PB1 = SERVO4
           * PC8 = SERVO5
           * PC9 = SERVO6
           */

          #include <stdint.h>

          #include "drivers/io.h"
          #include "drivers/pwm_mapping.h"
          #include "drivers/timer.h"

          timerHardware_t timerHardware[] = {
              DEF_TIM(TIM4, CH2,  PB7, TIM_USE_OUTPUT_AUTO, 1, 0), // MOTOR1
              DEF_TIM(TIM4, CH1,  PB6, TIM_USE_OUTPUT_AUTO, 1, 0), // MOTOR2

              DEF_TIM(TIM3, CH3,  PB0, TIM_USE_OUTPUT_AUTO, 1, 0), // SERVO3
              DEF_TIM(TIM3, CH4,  PB1, TIM_USE_OUTPUT_AUTO, 1, 0), // SERVO4

              DEF_TIM(TIM8, CH3,  PC8, TIM_USE_OUTPUT_AUTO, 1, 0), // SERVO5
              DEF_TIM(TIM8, CH4,  PC9, TIM_USE_OUTPUT_AUTO, 1, 0), // SERVO6
          };

          const int timerHardwareCount = sizeof(timerHardware) / sizeof(timerHardware[0]);
          EOF

          echo "Created target:"
          find src/main/target/CADDXF405WING -type f -maxdepth 1 -print

      - name: Patch RUNA name in Configurator
        run: |
          cd inav
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/fc/fc_msp.c")
          text = path.read_text(encoding="utf-8")

          pattern = r'sbufWriteU8\(dst,\s*strlen\(targetName\)\);\s*sbufWriteData\(dst,\s*targetName,\s*strlen\(targetName\)\);'

          replacement = '''sbufWriteU8(dst, strlen(targetName) + 5);
                  sbufWriteData(dst, targetName, strlen(targetName));
                  sbufWriteData(dst, "+RUNA", 5);'''

          new_text, count = re.subn(pattern, replacement, text, count=1)

          if count != 1:
              print("ERROR: Could not patch MSP_BOARD_INFO targetName block")
              raise SystemExit(1)

          path.write_text(new_text, encoding="utf-8")
          print("Patched targetName -> targetName+RUNA")
          PY

      - name: Patch RUNA startup screen text
        run: |
          cd inav
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/main/io/osd.c")
          text = path.read_text(encoding="utf-8")

          old_line = 'tfp_sprintf(string_buffer, "INAV VERSION: %s", FC_VERSION_STRING);'
          new_line = 'tfp_sprintf(string_buffer, "version RUNA 1.0");'

          if old_line not in text:
              print("ERROR: startup version sprintf line not found")
              raise SystemExit(1)

          text = text.replace(old_line, new_line, 1)

          text = text.replace(
              'uint8_t xPos = (osdDisplayPort->cols - 19) / 2;',
              'uint8_t xPos = OSD_CENTER_S(string_buffer);',
              1
          )

          path.write_text(text, encoding="utf-8")
          print("Patched startup screen: version RUNA 1.0")
          PY

      - name: Patch RUNA Advanced Tuning defaults
        run: |
          cd inav
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/fc/settings.yaml")
          text = path.read_text(encoding="utf-8")

          runa_cli_values = r"""
          set rc_filter_auto = OFF
          set deadband = 32
          set airmode_type = STICK_CENTER_ONCE
          set inav_w_z_baro_p = 0.350

          set nav_extra_arming_safety = ON
          set nav_wp_radius = 5000
          set nav_wp_max_safe_distance = 500
          set nav_rth_allow_landing = FS_ONLY
          set nav_rth_altitude = 5000
          set nav_fw_climb_angle = 12
          set nav_fw_control_smoothness = 2

          set nav_fw_launch_motor_delay = 1
          set nav_fw_launch_spinup_time = 250
          set nav_fw_launch_end_time = 5000
          set nav_fw_launch_timeout = 50000
          set nav_fw_launch_max_altitude = 5000
          set nav_fw_launch_climb_angle = 15

          set fw_p_pitch = 15
          set fw_i_pitch = 5
          set fw_d_pitch = 5
          set fw_ff_pitch = 80

          set fw_p_roll = 15
          set fw_i_roll = 3

          set max_angle_inclination_rll = 450
          set dterm_lpf_hz = 10

          set fw_turn_assist_yaw_gain = 2.000
          set fw_turn_assist_pitch_gain = 0.600

          set nav_fw_pos_z_p = 25
          set nav_fw_pos_z_d = 8
          set nav_fw_pos_xy_p = 55

          set d_boost_min = 1.000
          set d_boost_max = 1.000

          set rc_expo = 30
          set rc_yaw_expo = 30

          set roll_rate = 18
          set pitch_rate = 9
          set yaw_rate = 3

          set throttle_idle = 5.000
          set nav_mc_hover_thr = 1600
          set nav_fw_cruise_thr = 1650
          set nav_fw_min_thr = 1550
          set nav_fw_max_thr = 1800
          set nav_fw_pitch2thr = 6
          set nav_fw_launch_thr = 2000
          set nav_fw_launch_idle_thr = 1750
          """

          values = {}

          for line in runa_cli_values.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue

              m = re.match(r"set\s+([a-zA-Z0-9_]+)\s*=\s*(.+)", line)
              if not m:
                  continue

              values[m.group(1).strip()] = m.group(2).strip()

          def patch_default(text, name, value):
              pattern = (
                  r"(-\s+name:\s*" + re.escape(name) +
                  r"\b(?:(?!\n\s*-\s+name:).)*?default_value:\s*)([^\n\r]+)"
              )

              def repl(m):
                  old_value = m.group(2).strip()

                  if old_value.startswith('"') or old_value.startswith("'"):
                      escaped = value.replace('"', '\\"')
                      return m.group(1) + '"' + escaped + '"'

                  return m.group(1) + value

              new_text, count = re.subn(
                  pattern,
                  repl,
                  text,
                  count=1,
                  flags=re.S
              )

              return new_text, count

          patched = 0
          missing = []

          for name, value in values.items():
              text, count = patch_default(text, name, value)

              if count == 1:
                  print(f"RUNA default patched: {name} = {value}")
                  patched += 1
              else:
                  print(f"WARNING: setting not found: {name}")
                  missing.append(name)

          if patched == 0:
              print("ERROR: no RUNA Advanced Tuning values were patched")
              raise SystemExit(1)

          path.write_text(text, encoding="utf-8")

          print(f"Patched RUNA Advanced Tuning defaults: {patched}")

          if missing:
              print("Missing settings:")
              for name in missing:
                  print(" -", name)
          PY

      - name: Patch RUNA 3.3GHz VTX table
        run: |
          cd inav
          python3 <<'PY'
          from pathlib import Path
          import re

          def sub_required(text, pattern, replacement, name, flags=0):
              new_text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  print(f"ERROR: could not replace: {name}")
                  print("PATTERN:", pattern)
                  raise SystemExit(1)
              return new_text

          path = Path("src/main/io/vtx_string.c")
          text = path.read_text(encoding="utf-8")

          text = sub_required(
              text,
              r"#define\s+VTX_STRING_1G3_BAND_COUNT\s+\d+",
              "#define VTX_STRING_1G3_BAND_COUNT 6",
              "VTX_STRING_1G3_BAND_COUNT"
          )

          text = sub_required(
              text,
              r"#define\s+VTX_STRING_1G3_POWER_COUNT\s+\d+",
              "#define VTX_STRING_1G3_POWER_COUNT 5",
              "VTX_STRING_1G3_POWER_COUNT"
          )

          text = sub_required(
              text,
              r"const\s+uint16_t\s+vtx1G3frequencyTable\s*\[\s*VTX_STRING_1G3_BAND_COUNT\s*\]\s*\[\s*VTX_STRING_1G3_CHAN_COUNT\s*\]\s*=\s*\{.*?\};",
              """const uint16_t vtx1G3frequencyTable[VTX_STRING_1G3_BAND_COUNT][VTX_STRING_1G3_CHAN_COUNT] = {
              { 3083, 3114, 3145, 3176, 3207, 3238, 3269, 3300 },
              { 3215, 3235, 3255, 3275, 3295, 3315, 3335, 3355 },
              { 3170, 3190, 3210, 3230, 3250, 3270, 3290, 3310 },
              { 3320, 3345, 3370, 3395, 3420, 3445, 3470, 3495 },
              { 3310, 3330, 3355, 3380, 3405, 3430, 3455, 3480 },
              { 3330, 3350, 3370, 3390, 3410, 3430, 3450, 3470 },
          };""",
              "vtx1G3frequencyTable",
              flags=re.S
          )

          text = sub_required(
              text,
              r"const\s+char\s*\*\s+const\s+vtx1G3BandNames\s*\[\s*VTX_STRING_1G3_BAND_COUNT\s*\+\s*1\s*\]\s*=\s*\{.*?\};",
              """const char * const vtx1G3BandNames[VTX_STRING_1G3_BAND_COUNT + 1] = {
              "-", "A", "B", "C", "D", "E", "F",
          };""",
              "vtx1G3BandNames",
              flags=re.S
          )

          text = sub_required(
              text,
              r'const\s+char\s+vtx1G3BandLetter\s*\[\s*VTX_STRING_1G3_BAND_COUNT\s*\+\s*1\s*\]\s*=\s*".*?";',
              'const char vtx1G3BandLetter[VTX_STRING_1G3_BAND_COUNT + 1] = "-ABCDEF";',
              "vtx1G3BandLetter",
              flags=re.S
          )

          text = sub_required(
              text,
              r"const\s+char\s*\*\s+const\s+vtx1G3DefaultPowerNames\s*\[\s*VTX_STRING_1G3_POWER_COUNT\s*\+\s*1\s*\]\s*=\s*\{.*?\};",
              """const char * const vtx1G3DefaultPowerNames[VTX_STRING_1G3_POWER_COUNT + 1] = {
              "---", "25", "200", "400", "800", "MAX"
          };""",
              "vtx1G3DefaultPowerNames",
              flags=re.S
          )

          path.write_text(text, encoding="utf-8")
          print("Patched vtx_string.c")

          path = Path("src/main/io/vtx_string.h")
          text = path.read_text(encoding="utf-8")

          text = sub_required(
              text,
              r"extern\s+const\s+uint16_t\s+vtx1G3frequencyTable\s*\[\s*\d+\s*\]\s*\[\s*8\s*\]\s*;",
              "extern const uint16_t vtx1G3frequencyTable[6][8];",
              "vtx1G3frequencyTable extern"
          )

          text = text.replace(
              "extern const char vtx51G3BandLetter[];",
              "extern const char vtx1G3BandLetter[];"
          )

          path.write_text(text, encoding="utf-8")
          print("Patched vtx_string.h")

          path = Path("src/main/io/vtx_tramp.h")
          text = path.read_text(encoding="utf-8")

          text = sub_required(
              text,
              r"#define\s+VTX_TRAMP_1G3_BAND_COUNT\s+\d+",
              "#define VTX_TRAMP_1G3_BAND_COUNT 6",
              "VTX_TRAMP_1G3_BAND_COUNT"
          )

          text = sub_required(
              text,
              r"#define\s+VTX_TRAMP_1G3_MAX_POWER_COUNT\s+\d+",
              "#define VTX_TRAMP_1G3_MAX_POWER_COUNT 5",
              "VTX_TRAMP_1G3_MAX_POWER_COUNT"
          )

          text = sub_required(
              text,
              r"#define\s+VTX_TRAMP_1G3_MIN_FREQUENCY_MHZ\s+\d+",
              "#define VTX_TRAMP_1G3_MIN_FREQUENCY_MHZ 3000",
              "VTX_TRAMP_1G3_MIN_FREQUENCY_MHZ"
          )

          text = sub_required(
              text,
              r"#define\s+VTX_TRAMP_1G3_MAX_FREQUENCY_MHZ\s+\d+",
              "#define VTX_TRAMP_1G3_MAX_FREQUENCY_MHZ 3599",
              "VTX_TRAMP_1G3_MAX_FREQUENCY_MHZ"
          )

          path.write_text(text, encoding="utf-8")
          print("Patched vtx_tramp.h")

          path = Path("src/main/io/vtx_tramp.c")
          text = path.read_text(encoding="utf-8")

          text = sub_required(
              text,
              r"const\s+uint16_t\s+trampPowerTable_1G3_800\s*\[\s*VTX_TRAMP_1G3_MAX_POWER_COUNT\s*\]\s*=\s*\{.*?\};",
              "const uint16_t trampPowerTable_1G3_800[VTX_TRAMP_1G3_MAX_POWER_COUNT] = { 25, 200, 400, 800, 800 };",
              "trampPowerTable_1G3_800",
              flags=re.S
          )

          text = sub_required(
              text,
              r"const\s+char\s*\*\s+const\s+trampPowerNames_1G3_800\s*\[\s*VTX_TRAMP_1G3_MAX_POWER_COUNT\s*\+\s*1\s*\]\s*=\s*\{.*?\};",
              'const char * const trampPowerNames_1G3_800[VTX_TRAMP_1G3_MAX_POWER_COUNT + 1] = { "---", "25 ", "200", "400", "800", "800" };',
              "trampPowerNames_1G3_800",
              flags=re.S
          )

          text = sub_required(
              text,
              r"const\s+uint16_t\s+trampPowerTable_1G3_2000\s*\[\s*VTX_TRAMP_1G3_MAX_POWER_COUNT\s*\]\s*=\s*\{.*?\};",
              "const uint16_t trampPowerTable_1G3_2000[VTX_TRAMP_1G3_MAX_POWER_COUNT] = { 25, 200, 400, 800, 2000 };",
              "trampPowerTable_1G3_2000",
              flags=re.S
          )

          text = sub_required(
              text,
              r"const\s+char\s*\*\s+const\s+trampPowerNames_1G3_2000\s*\[\s*VTX_TRAMP_1G3_MAX_POWER_COUNT\s*\+\s*1\s*\]\s*=\s*\{.*?\};",
              'const char * const trampPowerNames_1G3_2000[VTX_TRAMP_1G3_MAX_POWER_COUNT + 1] = { "---", "25 ", "200", "400", "800", "2000" };',
              "trampPowerNames_1G3_2000",
              flags=re.S
          )

          path.write_text(text, encoding="utf-8")
          print("Patched vtx_tramp.c")
          PY

      - name: Patch RUNA OSD shutter
        run: |
          cd inav
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/io/osd.c")
          text = path.read_text(encoding="utf-8")

          pattern = r'osdDrawNextElement\(\);\s*displayHeartbeat\(osdDisplayPort\);\s*displayCommitTransaction\(osdDisplayPort\);'

          replacement = r'''
                  static bool runaShutterWasActive = false;
                  static uint8_t runaShutterNextRow = 0;

                  if (currentLayout == 2) {
                      textAttributes_t runaAttr = TEXT_ATTRIBUTES_NONE;
                      TEXT_ATTRIBUTES_ADD_SOLID_BG(runaAttr);

                      char runaMask[64];

                      uint8_t cols = osdDisplayPort->cols;
                      uint8_t rows = osdDisplayPort->rows;

                      if (cols > 63) {
                          cols = 63;
                      }

                      const uint8_t windowWidth = cols >= 30 ? 10 : cols / 3;
                      const uint8_t windowHeight = rows >= 16 ? 4 : rows / 3;

                      const uint8_t windowX = (cols - windowWidth) / 2;
                      const uint8_t windowY = (rows - windowHeight) / 2;

                      if (!runaShutterWasActive) {
                          displayClearScreen(osdDisplayPort);
                          runaShutterWasActive = true;
                          runaShutterNextRow = 0;
                      }

                      for (uint8_t pass = 0; pass < 2; pass++) {
                          uint8_t y = runaShutterNextRow;

                          const bool inWindowY = (y >= windowY) && (y < windowY + windowHeight);

                          if (!inWindowY) {
                              memset(runaMask, ' ', cols);
                              runaMask[cols] = '\0';
                              displayWriteWithAttr(osdDisplayPort, 0, y, runaMask, runaAttr);
                          } else {
                              if (windowX > 0) {
                                  memset(runaMask, ' ', windowX);
                                  runaMask[windowX] = '\0';
                                  displayWriteWithAttr(osdDisplayPort, 0, y, runaMask, runaAttr);
                              }

                              const uint8_t rightX = windowX + windowWidth;
                              if (rightX < cols) {
                                  const uint8_t rightWidth = cols - rightX;
                                  memset(runaMask, ' ', rightWidth);
                                  runaMask[rightWidth] = '\0';
                                  displayWriteWithAttr(osdDisplayPort, rightX, y, runaMask, runaAttr);
                              }
                          }

                          runaShutterNextRow++;

                          if (runaShutterNextRow >= rows) {
                              runaShutterNextRow = 0;
                          }
                      }
                  } else {
                      if (runaShutterWasActive) {
                          displayClearScreen(osdDisplayPort);
                          runaShutterWasActive = false;
                          runaShutterNextRow = 0;
                      }

                      osdDrawNextElement();
                  }

                  displayHeartbeat(osdDisplayPort);
                  displayCommitTransaction(osdDisplayPort);'''

          new_text, count = re.subn(pattern, replacement, text, count=1)

          if count != 1:
              print("ERROR: OSD draw block not found")
              raise SystemExit(1)

          path.write_text(new_text, encoding="utf-8")
          print("Patched RUNA OSD shutter")
          PY

      - name: Configure CMake
        run: |
          cd inav
          mkdir -p build
          cd build
          cmake ..

      - name: Check target exists
        run: |
          cd inav/build
          echo "Checking target: $TARGET"
          make help | grep -w "$TARGET" || {
            echo "TARGET NOT FOUND: $TARGET"
            echo ""
            echo "Targets containing CADDX/RUNA/F405/WING:"
            make help | grep -i -E "CADDX|RUNA|F405|WING" || true
            exit 1
          }

      - name: Build CADDXF405WING
        run: |
          cd inav/build
          make clean_${TARGET} || true
          make ${TARGET} -j2 VERBOSE=1

      - name: Find firmware
        if: always()
        run: |
          echo "===== BUILT FILES ====="
          find inav/build -type f \( -name "*.hex" -o -name "*.bin" -o -name "*.elf" \) -print || true

      - name: Collect and rename firmware
        if: success()
        run: |
          mkdir -p out/${TARGET}

          python3 <<'PY'
          from pathlib import Path
          import shutil
          import os

          target = os.environ["TARGET"]
          build_dir = Path("inav/build")
          out_dir = Path("out") / target
          out_dir.mkdir(parents=True, exist_ok=True)

          exts = {".hex", ".bin", ".elf"}
          copied = 0

          for file in build_dir.rglob("*"):
              if not file.is_file():
                  continue
              if file.suffix.lower() not in exts:
                  continue
              if target not in file.name:
                  continue

              new_name = f"RUNA_CADDXF405WING_TEST_V2_IMU_1_0_3G3_SHUTTER_ADV_{file.name}"
              dst = out_dir / new_name
              shutil.copy2(file, dst)
              print(f"Copied: {file} -> {dst}")
              copied += 1

          if copied == 0:
              print("ERROR: no firmware files found for target", target)
              raise SystemExit(1)

          print(f"Total copied: {copied}")
          PY

          echo "Collected files:"
          find out -type f -print || true

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RUNA-CADDXF405WING-TEST-V2-IMU-1-0-3G3-SHUTTER-ADV
          path: out/${{ env.TARGET }}/*
