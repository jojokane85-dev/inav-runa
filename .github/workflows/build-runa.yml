name: RUNA v40 INAV 8.0.1 SPEEDYBEE BASE

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout INAV 8.0.1
        run: |
          git clone --recursive --branch 8.0.1 https://github.com/iNavFlight/inav.git inav

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi

          which arm-none-eabi-objcopy || true

      - name: Find SpeedyBee target
        run: |
          cd inav

          echo "===== TARGETS WITH SPEEDY ====="
          find src/main/target -maxdepth 1 -type d | grep -i speedy || true

          echo "===== MAKE HELP SPEEDY ====="
          mkdir -p build
          cd build
          cmake ..
          make help | grep -i speedy || true

      - name: Create RUNA target from SPEEDYBEEF405WING
        run: |
          cd inav

          BASE_TARGET=""

          if [ -d "src/main/target/SPEEDYBEEF405WING" ]; then
            BASE_TARGET="SPEEDYBEEF405WING"
          elif [ -d "src/main/target/SPEEDYBEEF405WING_V2" ]; then
            BASE_TARGET="SPEEDYBEEF405WING_V2"
          elif [ -d "src/main/target/SPEEDYBEEF405WINGAPP" ]; then
            BASE_TARGET="SPEEDYBEEF405WINGAPP"
          elif [ -d "src/main/target/SPEEDYBEEF405WINGMINI" ]; then
            BASE_TARGET="SPEEDYBEEF405WINGMINI"
          fi

          if [ -z "$BASE_TARGET" ]; then
            echo "ERROR: SpeedyBee F405 Wing target not found in INAV 8.0.1"
            echo "Available SpeedyBee targets:"
            find src/main/target -maxdepth 1 -type d | grep -i speedy || true
            exit 1
          fi

          echo "===== USING BASE TARGET: $BASE_TARGET ====="

          rm -rf src/main/target/RUNA_F405_WING
          mkdir -p src/main/target/RUNA_F405_WING

          cp -r "src/main/target/$BASE_TARGET/"* src/main/target/RUNA_F405_WING/

          cat > src/main/target/RUNA_F405_WING/CMakeLists.txt <<'EOF'
          target_stm32f405xg(RUNA_F405_WING)
          EOF

          echo "===== Patch RUNA name only ====="

          sed -i '/TARGET_BOARD_IDENTIFIER/d' src/main/target/RUNA_F405_WING/target.h || true
          sed -i '/USBD_PRODUCT_STRING/d' src/main/target/RUNA_F405_WING/target.h || true

          cat >> src/main/target/RUNA_F405_WING/target.h <<'EOF'

          /*
           * RUNA_F405_WING v40
           * Base: SPEEDYBEEF405WING
           * INAV 8.0.1
           * No LSM6DXX patch.
           * No manual axis map.
           * No gyro scale hack.
           */

          #undef TARGET_BOARD_IDENTIFIER
          #define TARGET_BOARD_IDENTIFIER "RUNA"

          #undef USBD_PRODUCT_STRING
          #define USBD_PRODUCT_STRING "RUNA_F405_WING"

          EOF

          echo "===== RUNA target created from $BASE_TARGET ====="
          echo "===== target.h important lines ====="
          grep -nE "TARGET_BOARD_IDENTIFIER|USBD_PRODUCT_STRING|ICM|42688|42605|GYRO|ACC|IMU|BARO|SPL06|MAX7456|AT7456|SDCARD|UART|SPI|I2C" src/main/target/RUNA_F405_WING/target.h || true

          echo "===== target folder ====="
          ls -la src/main/target/RUNA_F405_WING

      - name: Configure
        run: |
          cd inav
          rm -rf build
          mkdir -p build
          cd build
          cmake ..

      - name: Build RUNA_F405_WING
        run: |
          cd inav/build
          make RUNA_F405_WING -j$(nproc)

      - name: Collect firmware HEX BIN ELF
        run: |
          mkdir -p out

          echo "===== Find built firmware ====="
          find inav/build -type f \( -name "*.hex" -o -name "*.bin" -o -name "*.elf" \) -print

          ELF=$(find inav/build -type f -name "RUNA_F405_WING.elf" | head -n 1)

          if [ -z "$ELF" ]; then
            ELF=$(find inav/build -type f -name "*RUNA_F405_WING*.elf" | head -n 1)
          fi

          if [ -z "$ELF" ]; then
            echo "ERROR: ELF not found"
            find inav/build -type f -name "*.elf" -print
            exit 1
          fi

          echo "Found ELF: $ELF"

          cp "$ELF" out/RUNA_F405_WING_v40_SPEEDYBEE_BASE.elf

          arm-none-eabi-objcopy -O ihex "$ELF" out/RUNA_F405_WING_v40_SPEEDYBEE_BASE.hex
          arm-none-eabi-objcopy -O binary "$ELF" out/RUNA_F405_WING_v40_SPEEDYBEE_BASE.bin

          echo "===== OUT ====="
          ls -lh out

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: RUNA_F405_WING_v40_SPEEDYBEE_BASE
          path: out/*
