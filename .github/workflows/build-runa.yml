name: Build RUNA FC45 LSM6DXX WHOAMI Scan V2

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          # SPI1 variants
          - name: SPI1_PA4
            spi: BUS_SPI1
            cs: PA4
          - name: SPI1_PA15
            spi: BUS_SPI1
            cs: PA15
          - name: SPI1_PB0
            spi: BUS_SPI1
            cs: PB0
          - name: SPI1_PB1
            spi: BUS_SPI1
            cs: PB1
          - name: SPI1_PB2
            spi: BUS_SPI1
            cs: PB2
          - name: SPI1_PB12
            spi: BUS_SPI1
            cs: PB12
          - name: SPI1_PC4
            spi: BUS_SPI1
            cs: PC4
          - name: SPI1_PC13
            spi: BUS_SPI1
            cs: PC13
          - name: SPI1_PC14
            spi: BUS_SPI1
            cs: PC14
          - name: SPI1_PC15
            spi: BUS_SPI1
            cs: PC15

          # SPI2 variants
          - name: SPI2_PA4
            spi: BUS_SPI2
            cs: PA4
          - name: SPI2_PA15
            spi: BUS_SPI2
            cs: PA15
          - name: SPI2_PB0
            spi: BUS_SPI2
            cs: PB0
          - name: SPI2_PB1
            spi: BUS_SPI2
            cs: PB1
          - name: SPI2_PB2
            spi: BUS_SPI2
            cs: PB2
          - name: SPI2_PB12
            spi: BUS_SPI2
            cs: PB12
          - name: SPI2_PC4
            spi: BUS_SPI2
            cs: PC4
          - name: SPI2_PC13
            spi: BUS_SPI2
            cs: PC13
          - name: SPI2_PC14
            spi: BUS_SPI2
            cs: PC14
          - name: SPI2_PC15
            spi: BUS_SPI2
            cs: PC15

          # SPI3 variants
          - name: SPI3_PA4
            spi: BUS_SPI3
            cs: PA4
          - name: SPI3_PA15
            spi: BUS_SPI3
            cs: PA15
          - name: SPI3_PB0
            spi: BUS_SPI3
            cs: PB0
          - name: SPI3_PB1
            spi: BUS_SPI3
            cs: PB1
          - name: SPI3_PB2
            spi: BUS_SPI3
            cs: PB2
          - name: SPI3_PB12
            spi: BUS_SPI3
            cs: PB12
          - name: SPI3_PC4
            spi: BUS_SPI3
            cs: PC4
          - name: SPI3_PC13
            spi: BUS_SPI3
            cs: PC13
          - name: SPI3_PC14
            spi: BUS_SPI3
            cs: PC14
          - name: SPI3_PC15
            spi: BUS_SPI3
            cs: PC15

    env:
      REPO_URL: https://github.com/mailform2022/inav.git
      PR_BRANCH: devin/1779334285-vtx-3g3-7x
      TARGET: CADDXF405_WING

    steps:
      - name: Install deps
        run: |
          sudo apt-get update -y -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            git \
            build-essential \
            g++ \
            ruby \
            cmake \
            make \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-dev \
            ninja-build \
            python3 \
            python3-pip

      - name: Clone PR branch
        run: |
          set -e

          for i in 1 2 3 4 5; do
            echo "Clone attempt $i"

            git clone \
              --branch "${PR_BRANCH}" \
              --depth 1 \
              --single-branch \
              --config http.version=HTTP/1.1 \
              --config http.postBuffer=524288000 \
              "${REPO_URL}" inav && break

            echo "Clone failed, retrying..."
            rm -rf inav
            sleep 10
          done

          test -d inav || exit 1

          cd inav
          echo "Commit:"
          git rev-parse HEAD
          echo "Branch:"
          git branch --show-current

      - name: Check CADDXF405_WING target exists
        run: |
          cd inav

          if [ ! -d "src/main/target/${TARGET}" ]; then
            echo "ERROR: target directory not found: src/main/target/${TARGET}"
            find src/main/target -maxdepth 1 -type d | grep -i -E "CAD|CADD|F405|SPEEDY|WING" || true
            exit 1
          fi

          echo "Target exists: ${TARGET}"

      - name: Patch target for LSM6DXX SPI WHOAMI scan
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          target = os.environ["TARGET"]
          spi = "${{ matrix.spi }}"
          cs = "${{ matrix.cs }}"

          target_h = Path(f"src/main/target/{target}/target.h")

          if not target_h.exists():
              raise SystemExit(f"target.h not found: {target_h}")

          text = target_h.read_text(encoding="utf-8")

          remove_patterns = [
              r'^\s*#define\s+USE_IMU_ICM42605\s*$',
              r'^\s*#define\s+IMU_ICM42605_ALIGN\s+\S+\s*$',
              r'^\s*#define\s+ICM42605_CS_PIN\s+\S+\s*$',
              r'^\s*#define\s+ICM42605_SPI_BUS\s+\S+\s*$',
              r'^\s*#define\s+ICM42605_EXTI_PIN\s+\S+\s*$',

              r'^\s*#define\s+USE_IMU_ICM42688P\s*$',
              r'^\s*#define\s+IMU_ICM42688P_ALIGN\s+\S+\s*$',
              r'^\s*#define\s+ICM42688P_CS_PIN\s+\S+\s*$',
              r'^\s*#define\s+ICM42688P_SPI_BUS\s+\S+\s*$',
              r'^\s*#define\s+ICM42688P_EXTI_PIN\s+\S+\s*$',

              r'^\s*#define\s+USE_IMU_BMI270\s*$',
              r'^\s*#define\s+BMI270_CS_PIN\s+\S+\s*$',
              r'^\s*#define\s+BMI270_SPI_BUS\s+\S+\s*$',
              r'^\s*#define\s+IMU_BMI270_ALIGN\s+\S+\s*$',
              r'^\s*#define\s+BMI270_EXTI_PIN\s+\S+\s*$',

              r'^\s*#define\s+USE_IMU_MPU6000\s*$',
              r'^\s*#define\s+MPU6000_CS_PIN\s+\S+\s*$',
              r'^\s*#define\s+MPU6000_SPI_BUS\s+\S+\s*$',
              r'^\s*#define\s+IMU_MPU6000_ALIGN\s+\S+\s*$',

              r'^\s*#define\s+USE_IMU_MPU6500\s*$',
              r'^\s*#define\s+MPU6500_CS_PIN\s+\S+\s*$',
              r'^\s*#define\s+MPU6500_SPI_BUS\s+\S+\s*$',
              r'^\s*#define\s+IMU_MPU6500_ALIGN\s+\S+\s*$',

              r'^\s*#define\s+USE_IMU_LSM6DXX\s*$',
              r'^\s*#define\s+LSM6DXX_CS_PIN\s+\S+\s*$',
              r'^\s*#define\s+LSM6DXX_SPI_BUS\s+\S+\s*$',
              r'^\s*#define\s+LSM6DXX_EXTI_PIN\s+\S+\s*$',
              r'^\s*#define\s+IMU_LSM6DXX_ALIGN\s+\S+\s*$',

              r'^\s*#define\s+USE_BARO_SPL06\s*$',
              r'^\s*#define\s+BARO_I2C_BUS\s+\S+\s*$',

              r'^\s*#define\s+USE_MAG_HMC5883\s*$',
              r'^\s*#define\s+USE_MAG_QMC5883\s*$',
              r'^\s*#define\s+MAG_I2C_BUS\s+\S+\s*$',
          ]

          for pattern in remove_patterns:
              text = re.sub(pattern, "", text, flags=re.M)

          text += f"""

          /*
           * RUNA FC4.5 LSM6DXX WHOAMI SPI SCAN V2
           *
           * Test variant:
           * SPI = {spi}
           * CS  = {cs}
           *
           * This firmware is diagnostic only.
           * Do not fly.
           */

          #define USE_IMU_LSM6DXX
          #define LSM6DXX_SPI_BUS {spi}
          #define LSM6DXX_CS_PIN {cs}
          #define IMU_LSM6DXX_ALIGN CW0_DEG

          #define USE_BARO_SPL06
          #define BARO_I2C_BUS BUS_I2C1

          #define USE_MAG_HMC5883
          #define MAG_I2C_BUS BUS_I2C1
          """

          target_h.write_text(text, encoding="utf-8")

          print("Target patched:")
          print("SPI =", spi)
          print("CS  =", cs)
          PY

          echo "===== Patched target.h lines ====="
          grep -n -E "LSM6DXX|SPL06|HMC5883|SPI_BUS|CS_PIN|I2C|ALIGN" src/main/target/${TARGET}/target.h || true

      - name: Patch LSM6DXX gyroAlign fix
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path

          path = Path("src/main/drivers/accgyro/accgyro_lsm6dxx.c")

          if not path.exists():
              raise SystemExit("ERROR: accgyro_lsm6dxx.c not found")

          text = path.read_text(encoding="utf-8")

          fix = "gyro->gyroAlign = gyro->busDev->param;"

          if fix not in text:
              old = "gyro->intStatusFn = gyroCheckDataReady;"
              new = "gyro->intStatusFn = gyroCheckDataReady;\n    gyro->gyroAlign = gyro->busDev->param;"

              if old not in text:
                  raise SystemExit("ERROR: Pattern not found: gyro->intStatusFn = gyroCheckDataReady;")

              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
              print("LSM6DXX gyroAlign fix added")
          else:
              print("LSM6DXX gyroAlign fix already present")

          print("===== gyroAlign check =====")
          for line in text.splitlines():
              if "gyroAlign" in line or "gyroCheckDataReady" in line:
                  print(line)
          PY

      - name: Patch LSM6DXX WHOAMI diagnostic SAFE
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path

          path = Path("src/main/drivers/accgyro/accgyro_lsm6dxx.c")

          if not path.exists():
              raise SystemExit("ERROR: accgyro_lsm6dxx.c not found")

          text = path.read_text(encoding="utf-8")

          # ВАЖНО:
          # Не добавляем case 0x6A / 0x6C вручную.
          # В этой ветке они уже могут совпадать с LSM6DSL_CHIP_ID / LSM6DSO_CHIP_ID.
          # Иначе будет duplicate case value.

          marker = "/* RUNA_LSM6DXX_SAFE_WHOAMI_SCAN_V2 */"

          if marker not in text:
              text = text.replace(
                  "#include",
                  marker + "\n#include",
                  1
              )

          path.write_text(text, encoding="utf-8")
          print("RUNA safe WHOAMI marker added, no duplicate cases")
          PY

      - name: Patch startup OSD text
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path

          path = Path("src/main/io/osd.c")

          if not path.exists():
              print("osd.c not found, skip")
              raise SystemExit(0)

          text = path.read_text(encoding="utf-8")

          old = 'tfp_sprintf(string_buffer, "INAV VERSION: %s", FC_VERSION_STRING);'
          new = 'tfp_sprintf(string_buffer, "RUNA45 SCAN");'

          if old in text:
              text = text.replace(old, new, 1)
              text = text.replace(
                  'uint8_t xPos = (osdDisplayPort->cols - 19) / 2;',
                  'uint8_t xPos = OSD_CENTER_S(string_buffer);',
                  1
              )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Configure CMake
        run: |
          cd inav
          mkdir -p build
          cd build
          cmake ..

      - name: Check target exists
        run: |
          cd inav/build

          if make help | grep -w "${TARGET}"; then
            echo "Target found: ${TARGET}"
          else
            echo "TARGET NOT FOUND: ${TARGET}"
            make help | grep -i -E "CADDX|CADD|SPEEDY|F405|WING" || true
            exit 1
          fi

      - name: Build firmware
        run: |
          cd inav/build
          make clean_${TARGET} || true
          make ${TARGET} -j2 VERBOSE=1

      - name: Find built files
        if: always()
        run: |
          echo "Built firmware files:"
          find inav/build -type f \( -name "*.hex" -o -name "*.bin" -o -name "*.elf" \) -print || true

      - name: Collect firmware and CLI
        run: |
          mkdir -p out

          FOUND=0

          while IFS= read -r f; do
            base="$(basename "$f")"
            dst="out/RUNA_FC45_WHOAMI_SCAN_V2_${{ matrix.name }}_${base}"
            cp "$f" "$dst"
            echo "Copied: $dst"
            FOUND=$((FOUND + 1))
          done < <(find inav/build -type f \( -name "*${TARGET}*.hex" -o -name "*${TARGET}*.bin" -o -name "*${TARGET}*.elf" \))

          if [ "$FOUND" -eq 0 ]; then
            echo "ERROR: no firmware files found"
            find inav/build -type f \( -name "*.hex" -o -name "*.bin" -o -name "*.elf" \) -print || true
            exit 1
          fi

          cat > out/RUNA_FC45_WHOAMI_SCAN_V2_${{ matrix.name }}.cli <<'EOF'
          batch start

          # RUNA FC4.5 LSM6DXX WHOAMI SPI SCAN V2
          # Variant:
          # SPI = ${{ matrix.spi }}
          # CS  = ${{ matrix.cs }}
          #
          # Diagnostic only. Do not fly.

          feature -GPS
          feature OSD
          feature PWM_OUTPUT_ENABLE

          set acc_hardware = LSM6DXX
          set baro_hardware = SPL06
          set mag_hardware = HMC5883
          set align_mag = CW0FLIP

          set align_board_roll = 0
          set align_board_pitch = 0
          set align_board_yaw = 1800

          set gyro_zero_x = 0
          set gyro_zero_y = 0
          set gyro_zero_z = 0

          set acczero_x = 0
          set acczero_y = 0
          set acczero_z = 0

          set accgain_x = 4096
          set accgain_y = 4096
          set accgain_z = 4096

          set vbat_adc_channel = 1
          set rssi_adc_channel = 4
          set current_adc_channel = 2
          set airspeed_adc_channel = 3

          set receiver_type = SERIAL
          set serialrx_provider = CRSF

          set nav_extra_arming_safety = OFF
          set failsafe_procedure = NONE
          set small_angle = 180

          save
          EOF

          cat > out/README_${{ matrix.name }}.txt <<'EOF'
          RUNA FC45 LSM6DXX WHOAMI SPI SCAN V2

          Variant:
          SPI = ${{ matrix.spi }}
          CS  = ${{ matrix.cs }}

          Flash HEX from this archive.

          After flashing:
          1. CLI:
             defaults
             save

          2. Wait 15 seconds without touching board.

          3. Apply:
             RUNA_FC45_WHOAMI_SCAN_V2_${{ matrix.name }}.cli

          4. Calibrate accelerometer manually:
             Calibration -> Calibrate Accelerometer

          5. Check:
             status
             get align_board

          Good result:
          - GYRO=OK
          - ACC=OK
          - BARO=OK
          - MAG=OK
          - 3D model does NOT spin fast

          Bad result:
          - GYRO=UNAVAILABLE
          - ACC=UNAVAILABLE
          - 3D model spins fast
          - HWFAIL

          Important:
          Test without propeller.
          Do not fly on scan firmware.
          EOF

          ls -lah out

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: RUNA-FC45-WHOAMI-SCAN-V2-${{ matrix.name }}
          path: out/*
