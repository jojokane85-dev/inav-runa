name: Find FC45 Targets Wide

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-22.04

    steps:
      - name: Clone INAV 7.1.2
        run: |
          git clone --branch 7.1.2 --depth 1 https://github.com/iNavFlight/inav.git inav

      - name: Find LSM6DXX targets
        run: |
          cd inav

          echo "===== TARGETS WITH LSM6DXX ====="
          for d in src/main/target/*; do
            if [ -f "$d/target.h" ]; then
              if grep -q "USE_IMU_LSM6DXX" "$d/target.h"; then
                echo ""
                echo "---- $d ----"
                grep -n -E "TARGET_BOARD_IDENTIFIER|BOARD_NAME|USE_IMU_LSM6DXX|LSM6DXX_SPI_BUS|LSM6DXX_CS_PIN|LSM6DXX_EXTI_PIN|IMU_LSM6DXX_ALIGN|USE_BARO|SPL06|BMP|DPS|USE_MAG|HMC|QMC|MAG_I2C_BUS" "$d/target.h" || true
              fi
            fi
          done

      - name: Find SPL06 targets
        run: |
          cd inav

          echo "===== TARGETS WITH SPL06 ====="
          for d in src/main/target/*; do
            if [ -f "$d/target.h" ]; then
              if grep -q "USE_BARO_SPL06" "$d/target.h"; then
                echo ""
                echo "---- $d ----"
                grep -n -E "TARGET_BOARD_IDENTIFIER|BOARD_NAME|USE_IMU|ICM|BMI|MPU|LSM|USE_BARO_SPL06|BARO_I2C_BUS|USE_MAG|HMC|QMC|MAG_I2C_BUS" "$d/target.h" || true
              fi
            fi
          done

      - name: Find F405 WING targets
        run: |
          cd inav

          echo "===== F405 / WING TARGETS ====="
          for d in src/main/target/*; do
            if [ -f "$d/target.h" ]; then
              if echo "$d" | grep -qi -E "F405|WING"; then
                echo ""
                echo "---- $d ----"
                grep -n -E "TARGET_BOARD_IDENTIFIER|BOARD_NAME|STM32F405|USE_IMU|ICM|BMI|MPU|LSM|USE_BARO|SPL06|BMP|DPS|USE_MAG|HMC|QMC" "$d/target.h" || true
              fi
            fi
          done
