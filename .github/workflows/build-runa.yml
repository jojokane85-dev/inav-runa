name: Build STM32F405 LSM6DXX Baremetal Scanner V4

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - led_name: LED_PC13_LOW
            led_port: C
            led_pin: 13
            active_low: 1
          - led_name: LED_PC13_HIGH
            led_port: C
            led_pin: 13
            active_low: 0

          - led_name: LED_PB2_LOW
            led_port: B
            led_pin: 2
            active_low: 1
          - led_name: LED_PB2_HIGH
            led_port: B
            led_pin: 2
            active_low: 0

          - led_name: LED_PB9_LOW
            led_port: B
            led_pin: 9
            active_low: 1
          - led_name: LED_PB9_HIGH
            led_port: B
            led_pin: 9
            active_low: 0

          - led_name: LED_PA8_LOW
            led_port: A
            led_pin: 8
            active_low: 1
          - led_name: LED_PA8_HIGH
            led_port: A
            led_pin: 8
            active_low: 0

    env:
      PROJECT: stm32f405_lsm6dxx_scanner_v4

    steps:
      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            make \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            python3

      - name: Create baremetal scanner source
        run: |
          mkdir -p ${PROJECT}

          cat > ${PROJECT}/main.c <<'EOF'
          /*
           * STM32F405 LSM6DXX baremetal scanner V4
           *
           * Diagnostic firmware only.
           * Do not fly.
           * Do not install propeller.
           *
           * V4:
           * - startup blink test
           * - SPI timeouts
           * - no external libraries
           */

          #include <stdint.h>

          #define LED_PORT_LETTER '${{ matrix.led_port }}'
          #define LED_PIN_NUM     ${{ matrix.led_pin }}
          #define LED_ACTIVE_LOW  ${{ matrix.active_low }}

          #define RCC_BASE        0x40023800UL
          #define GPIOA_BASE      0x40020000UL
          #define GPIOB_BASE      0x40020400UL
          #define GPIOC_BASE      0x40020800UL

          #define SPI1_BASE       0x40013000UL
          #define SPI2_BASE       0x40003800UL
          #define SPI3_BASE       0x40003C00UL

          #define REG32(addr)     (*(volatile uint32_t *)(addr))

          #define RCC_AHB1ENR     REG32(RCC_BASE + 0x30)
          #define RCC_APB1ENR     REG32(RCC_BASE + 0x40)
          #define RCC_APB2ENR     REG32(RCC_BASE + 0x44)

          #define GPIO_MODER(p)   REG32((p) + 0x00)
          #define GPIO_OTYPER(p)  REG32((p) + 0x04)
          #define GPIO_OSPEEDR(p) REG32((p) + 0x08)
          #define GPIO_PUPDR(p)   REG32((p) + 0x0C)
          #define GPIO_BSRR(p)    REG32((p) + 0x18)
          #define GPIO_AFRL(p)    REG32((p) + 0x20)
          #define GPIO_AFRH(p)    REG32((p) + 0x24)

          #define SPI_CR1(s)      REG32((s) + 0x00)
          #define SPI_CR2(s)      REG32((s) + 0x04)
          #define SPI_SR(s)       REG32((s) + 0x08)

          #define SPI_SR_RXNE     (1U << 0)
          #define SPI_SR_TXE      (1U << 1)
          #define SPI_SR_BSY      (1U << 7)

          #define LSM6DXX_WHOAMI_REG 0x0F

          typedef struct {
              uint32_t port;
              uint8_t pin;
          } gpio_pin_t;

          typedef struct {
              uint32_t spi;
              uint8_t index;
          } spi_bus_t;

          static void delay_cycles(volatile uint32_t n)
          {
              while (n--) {
                  __asm volatile ("nop");
              }
          }

          static void delay_ms(uint32_t ms)
          {
              while (ms--) {
                  delay_cycles(4000);
              }
          }

          static uint32_t port_by_letter(char c)
          {
              if (c == 'A') return GPIOA_BASE;
              if (c == 'B') return GPIOB_BASE;
              return GPIOC_BASE;
          }

          static void gpio_output(uint32_t port, uint8_t pin)
          {
              GPIO_MODER(port) &= ~(3U << (pin * 2));
              GPIO_MODER(port) |=  (1U << (pin * 2));
              GPIO_OTYPER(port) &= ~(1U << pin);
              GPIO_OSPEEDR(port) &= ~(3U << (pin * 2));
              GPIO_OSPEEDR(port) |=  (2U << (pin * 2));
              GPIO_PUPDR(port) &= ~(3U << (pin * 2));
          }

          static void gpio_af(uint32_t port, uint8_t pin, uint8_t af)
          {
              GPIO_MODER(port) &= ~(3U << (pin * 2));
              GPIO_MODER(port) |=  (2U << (pin * 2));

              GPIO_OTYPER(port) &= ~(1U << pin);

              GPIO_OSPEEDR(port) &= ~(3U << (pin * 2));
              GPIO_OSPEEDR(port) |=  (3U << (pin * 2));

              GPIO_PUPDR(port) &= ~(3U << (pin * 2));

              if (pin < 8) {
                  GPIO_AFRL(port) &= ~(0xFU << (pin * 4));
                  GPIO_AFRL(port) |=  ((uint32_t)af << (pin * 4));
              } else {
                  uint8_t p = pin - 8;
                  GPIO_AFRH(port) &= ~(0xFU << (p * 4));
                  GPIO_AFRH(port) |=  ((uint32_t)af << (p * 4));
              }
          }

          static void gpio_set_pin(uint32_t port, uint8_t pin)
          {
              GPIO_BSRR(port) = (1U << pin);
          }

          static void gpio_clear_pin(uint32_t port, uint8_t pin)
          {
              GPIO_BSRR(port) = (1U << (pin + 16));
          }

          static uint32_t led_port(void)
          {
              return port_by_letter(LED_PORT_LETTER);
          }

          static void led_setup(void)
          {
              gpio_output(led_port(), LED_PIN_NUM);
          }

          static void led_on(void)
          {
              if (LED_ACTIVE_LOW) {
                  gpio_clear_pin(led_port(), LED_PIN_NUM);
              } else {
                  gpio_set_pin(led_port(), LED_PIN_NUM);
              }
          }

          static void led_off(void)
          {
              if (LED_ACTIVE_LOW) {
                  gpio_set_pin(led_port(), LED_PIN_NUM);
              } else {
                  gpio_clear_pin(led_port(), LED_PIN_NUM);
              }
          }

          static void blink_short(void)
          {
              led_on();
              delay_ms(120);
              led_off();
              delay_ms(180);
          }

          static void blink_long(void)
          {
              led_on();
              delay_ms(600);
              led_off();
              delay_ms(600);
          }

          static void startup_blink(void)
          {
              for (uint8_t i = 0; i < 5; i++) {
                  blink_short();
              }
              delay_ms(1000);
          }

          static void blink_code(uint8_t code)
          {
              if (code == 0) {
                  while (1) {
                      blink_long();
                  }
              }

              while (1) {
                  for (uint8_t i = 0; i < code; i++) {
                      blink_short();
                  }

                  delay_ms(1400);
              }
          }

          static const spi_bus_t spi_buses[] = {
              { SPI1_BASE, 1 },
              { SPI2_BASE, 2 },
              { SPI3_BASE, 3 },
          };

          static const gpio_pin_t cs_pins[] = {
              { GPIOA_BASE, 4  },
              { GPIOA_BASE, 15 },
              { GPIOB_BASE, 0  },
              { GPIOB_BASE, 1  },
              { GPIOB_BASE, 2  },
              { GPIOB_BASE, 12 },
              { GPIOC_BASE, 4  },
              { GPIOC_BASE, 13 },
              { GPIOC_BASE, 14 },
              { GPIOC_BASE, 15 },
          };

          static void clocks_setup(void)
          {
              RCC_AHB1ENR |= (1U << 0) | (1U << 1) | (1U << 2);
              RCC_APB2ENR |= (1U << 12);
              RCC_APB1ENR |= (1U << 14) | (1U << 15);
              delay_ms(10);
          }

          static void cs_setup_all(void)
          {
              for (unsigned i = 0; i < sizeof(cs_pins) / sizeof(cs_pins[0]); i++) {
                  gpio_output(cs_pins[i].port, cs_pins[i].pin);
                  gpio_set_pin(cs_pins[i].port, cs_pins[i].pin);
              }
          }

          static void cs_low(gpio_pin_t cs)
          {
              gpio_clear_pin(cs.port, cs.pin);
          }

          static void cs_high(gpio_pin_t cs)
          {
              gpio_set_pin(cs.port, cs.pin);
          }

          static void spi_gpio_setup(uint32_t spi)
          {
              if (spi == SPI1_BASE) {
                  gpio_af(GPIOA_BASE, 5, 5);
                  gpio_af(GPIOA_BASE, 6, 5);
                  gpio_af(GPIOA_BASE, 7, 5);
              } else if (spi == SPI2_BASE) {
                  gpio_af(GPIOB_BASE, 13, 5);
                  gpio_af(GPIOB_BASE, 14, 5);
                  gpio_af(GPIOB_BASE, 15, 5);
              } else if (spi == SPI3_BASE) {
                  gpio_af(GPIOC_BASE, 10, 6);
                  gpio_af(GPIOC_BASE, 11, 6);
                  gpio_af(GPIOC_BASE, 12, 6);
              }
          }

          static void spi_setup(uint32_t spi)
          {
              SPI_CR1(spi) = 0;
              SPI_CR2(spi) = 0;

              SPI_CR1(spi) =
                  (1U << 2) |   // MSTR
                  (7U << 3) |   // BR /256
                  (1U << 8) |   // SSI
                  (1U << 9) |   // SSM
                  (1U << 1) |   // CPOL
                  (1U << 0);    // CPHA

              SPI_CR1(spi) |= (1U << 6); // SPE
          }

          static uint8_t spi_xfer8(uint32_t spi, uint8_t data)
          {
              uint32_t timeout = 100000;

              while (!(SPI_SR(spi) & SPI_SR_TXE)) {
                  if (--timeout == 0) {
                      return 0xFF;
                  }
              }

              *((volatile uint8_t *)(spi + 0x0C)) = data;

              timeout = 100000;

              while (!(SPI_SR(spi) & SPI_SR_RXNE)) {
                  if (--timeout == 0) {
                      return 0xFF;
                  }
              }

              return *((volatile uint8_t *)(spi + 0x0C));
          }

          static uint8_t read_whoami(uint32_t spi, gpio_pin_t cs)
          {
              uint8_t value;

              cs_high(cs);
              delay_ms(1);

              cs_low(cs);
              delay_ms(1);

              spi_xfer8(spi, LSM6DXX_WHOAMI_REG | 0x80);
              value = spi_xfer8(spi, 0x00);

              delay_ms(1);
              cs_high(cs);
              delay_ms(2);

              return value;
          }

          static uint8_t is_lsm6dxx_id(uint8_t id)
          {
              return id == 0x69 ||
                     id == 0x6A ||
                     id == 0x6B ||
                     id == 0x6C ||
                     id == 0x6D;
          }

          int main(void)
          {
              clocks_setup();
              led_setup();
              led_off();

              startup_blink();

              cs_setup_all();

              delay_ms(1000);

              uint8_t variant = 1;

              for (unsigned b = 0; b < sizeof(spi_buses) / sizeof(spi_buses[0]); b++) {
                  uint32_t spi = spi_buses[b].spi;

                  spi_gpio_setup(spi);
                  spi_setup(spi);

                  for (unsigned c = 0; c < sizeof(cs_pins) / sizeof(cs_pins[0]); c++) {
                      gpio_pin_t cs = cs_pins[c];

                      for (uint8_t attempt = 0; attempt < 10; attempt++) {
                          uint8_t id = read_whoami(spi, cs);

                          if (is_lsm6dxx_id(id)) {
                              blink_code(variant);
                          }

                          delay_ms(20);
                      }

                      variant++;
                  }

                  SPI_CR1(spi) &= ~(1U << 6);
              }

              blink_code(0);
          }
          EOF

          cat > ${PROJECT}/startup.c <<'EOF'
          #include <stdint.h>

          extern int main(void);

          extern uint32_t _estack;
          extern uint32_t _sidata;
          extern uint32_t _sdata;
          extern uint32_t _edata;
          extern uint32_t _sbss;
          extern uint32_t _ebss;

          void reset_handler(void);
          void default_handler(void);

          __attribute__((section(".isr_vector")))
          void (* const vector_table[])(void) = {
              (void (*)(void))(&_estack),
              reset_handler,
              default_handler,
              default_handler,
              default_handler,
              default_handler,
              default_handler,
              0,
              0,
              0,
              0,
              default_handler,
              default_handler,
              0,
              default_handler,
              default_handler,
          };

          void reset_handler(void)
          {
              uint32_t *src = &_sidata;
              uint32_t *dst = &_sdata;

              while (dst < &_edata) {
                  *dst++ = *src++;
              }

              dst = &_sbss;

              while (dst < &_ebss) {
                  *dst++ = 0;
              }

              main();

              while (1) {}
          }

          void default_handler(void)
          {
              while (1) {}
          }
          EOF

          cat > ${PROJECT}/linker.ld <<'EOF'
          MEMORY
          {
              FLASH (rx)  : ORIGIN = 0x08000000, LENGTH = 1024K
              RAM (xrw)   : ORIGIN = 0x20000000, LENGTH = 128K
          }

          _estack = ORIGIN(RAM) + LENGTH(RAM);

          SECTIONS
          {
              .isr_vector :
              {
                  KEEP(*(.isr_vector))
              } > FLASH

              .text :
              {
                  *(.text*)
                  *(.rodata*)
                  . = ALIGN(4);
                  _etext = .;
              } > FLASH

              _sidata = LOADADDR(.data);

              .data : AT(_etext)
              {
                  . = ALIGN(4);
                  _sdata = .;
                  *(.data*)
                  . = ALIGN(4);
                  _edata = .;
              } > RAM

              .bss :
              {
                  . = ALIGN(4);
                  _sbss = .;
                  *(.bss*)
                  *(COMMON)
                  . = ALIGN(4);
                  _ebss = .;
              } > RAM
          }
          EOF

          cat > ${PROJECT}/Makefile <<'EOF'
          PROJECT = scanner
          BUILD_DIR = build

          PREFIX ?= arm-none-eabi
          CC = $(PREFIX)-gcc
          OBJCOPY = $(PREFIX)-objcopy
          SIZE = $(PREFIX)-size

          CFLAGS = -Os -g -Wall -Wextra \
              -mcpu=cortex-m4 -mthumb -mfloat-abi=hard -mfpu=fpv4-sp-d16 \
              -ffreestanding -nostdlib

          LDFLAGS = -Tlinker.ld \
              -mcpu=cortex-m4 -mthumb -mfloat-abi=hard -mfpu=fpv4-sp-d16 \
              -nostdlib -Wl,--gc-sections

          SRCS = startup.c main.c
          OBJS = $(SRCS:%.c=$(BUILD_DIR)/%.o)

          all: $(BUILD_DIR)/$(PROJECT).elf $(BUILD_DIR)/$(PROJECT).bin $(BUILD_DIR)/$(PROJECT).hex
          	$(SIZE) $(BUILD_DIR)/$(PROJECT).elf

          $(BUILD_DIR):
          	mkdir -p $(BUILD_DIR)

          $(BUILD_DIR)/%.o: %.c | $(BUILD_DIR)
          	$(CC) $(CFLAGS) -c $< -o $@

          $(BUILD_DIR)/$(PROJECT).elf: $(OBJS)
          	$(CC) $(LDFLAGS) $^ -o $@

          $(BUILD_DIR)/$(PROJECT).bin: $(BUILD_DIR)/$(PROJECT).elf
          	$(OBJCOPY) -O binary $< $@

          $(BUILD_DIR)/$(PROJECT).hex: $(BUILD_DIR)/$(PROJECT).elf
          	$(OBJCOPY) -O ihex $< $@

          clean:
          	rm -rf $(BUILD_DIR)
          EOF

      - name: Build scanner
        run: |
          cd ${PROJECT}
          make clean
          make -j2

      - name: Collect artifacts
        run: |
          mkdir -p out

          cp ${PROJECT}/build/scanner.bin out/STM32F405_LSM6DXX_SCANNER_V4_${{ matrix.led_name }}.bin
          cp ${PROJECT}/build/scanner.hex out/STM32F405_LSM6DXX_SCANNER_V4_${{ matrix.led_name }}.hex
          cp ${PROJECT}/build/scanner.elf out/STM32F405_LSM6DXX_SCANNER_V4_${{ matrix.led_name }}.elf

          cat > out/README_${{ matrix.led_name }}.txt <<'EOF'
          STM32F405 LSM6DXX BAREMETAL SCANNER V4

          Diagnostic firmware only.
          Do not fly.
          Do not install propeller.

          First:
          - Scanner should blink 5 quick times after boot.
          - This means firmware started.

          Then:
          - Sensor found:
            LED blinks variant number repeatedly.
          - Sensor not found:
            LED slow-blinks forever.

          Scanned SPI:
          - SPI1: PA5 SCK, PA6 MISO, PA7 MOSI
          - SPI2: PB13 SCK, PB14 MISO, PB15 MOSI
          - SPI3: PC10 SCK, PC11 MISO, PC12 MOSI

          CS pins:
          PA4, PA15, PB0, PB1, PB2, PB12, PC4, PC13, PC14, PC15

          WHO_AM_I:
          register 0x0F

          Accepted IDs:
          0x69, 0x6A, 0x6B, 0x6C, 0x6D

          Variant mapping:
           1  = SPI1 PA4
           2  = SPI1 PA15
           3  = SPI1 PB0
           4  = SPI1 PB1
           5  = SPI1 PB2
           6  = SPI1 PB12
           7  = SPI1 PC4
           8  = SPI1 PC13
           9  = SPI1 PC14
           10 = SPI1 PC15

           11 = SPI2 PA4
           12 = SPI2 PA15
           13 = SPI2 PB0
           14 = SPI2 PB1
           15 = SPI2 PB2
           16 = SPI2 PB12
           17 = SPI2 PC4
           18 = SPI2 PC13
           19 = SPI2 PC14
           20 = SPI2 PC15

           21 = SPI3 PA4
           22 = SPI3 PA15
           23 = SPI3 PB0
           24 = SPI3 PB1
           25 = SPI3 PB2
           26 = SPI3 PB12
           27 = SPI3 PC4
           28 = SPI3 PC13
           29 = SPI3 PC14
           30 = SPI3 PC15

          How to use:
          1. Put board in DFU mode.
          2. Flash HEX.
          3. Watch LED.
          4. If 5 quick blinks then slow blink = scanner works, sensor not found.
          5. If repeated short blink group = count blinks and send number.
          EOF

          ls -lah out

      - name: Upload scanner
        uses: actions/upload-artifact@v4
        with:
          name: STM32F405-LSM6DXX-SCANNER-V4-${{ matrix.led_name }}
          path: out/*
