name: Build STOCK SPEEDYBEEF405WING INAV 8

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      INAV_VERSION: 8.0.1
      TARGET: SPEEDYBEEF405WING

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -y -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            git \
            build-essential \
            g++ \
            ruby \
            cmake \
            make \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-dev \
            ninja-build \
            python3 \
            python3-pip

      - name: Clone INAV 8.0.1
        run: |
          git clone --branch ${INAV_VERSION} --depth 1 https://github.com/iNavFlight/inav.git
          cd inav
          echo "INAV version: ${INAV_VERSION}"
          echo "Commit:"
          git rev-parse HEAD

      - name: Configure CMake
        run: |
          cd inav
          mkdir -p build
          cd build
          cmake ..

      - name: Check target exists
        run: |
          cd inav/build
          echo "Checking target: ${TARGET}"

          if make help | grep -w "${TARGET}"; then
            echo "Target found: ${TARGET}"
          else
            echo "TARGET NOT FOUND: ${TARGET}"
            make help | grep -i -E "SPEEDYBEE|F405|WING" || true
            exit 1
          fi

      - name: Build STOCK firmware
        run: |
          cd inav/build
          make clean_${TARGET} || true
          make ${TARGET} -j$(nproc)

      - name: Find built firmware
        run: |
          echo "Built firmware files:"
          find inav/build -type f \( -name "*.hex" -o -name "*.bin" -o -name "*.elf" \) -print || true

      - name: Collect firmware
        run: |
          mkdir -p out

          find inav/build -type f -name "*.hex" -exec cp {} out/ \; || true
          find inav/build -type f -name "*.bin" -exec cp {} out/ \; || true
          find inav/build -type f -name "*.elf" -exec cp {} out/ \; || true

          cat > out/README_STOCK_SPEEDYBEE_INAV8.txt <<'EOF'
          STOCK INAV 8.0.1 firmware test

          Target:
          - SPEEDYBEEF405WING

          This firmware has:
          - no +RUNA patch
          - no RUNAv.1 patch
          - no OSD shutter patch
          - no VTX 3.3 patch

          Purpose:
          Check if GYRO and ACC work on clean official INAV target.

          Flashing:
          1. Use INAV Configurator 8.x.
          2. Use DFU mode.
          3. Enable Full Chip Erase.
          4. Flash SPEEDYBEEF405WING.hex.
          5. After flashing open CLI:
             defaults
             save
          6. After reboot open CLI again:
             version
             status

          Good result:
          - GYRO should not be UNAVAILABLE
          - ACC should not be UNAVAILABLE

          Bad result:
          - GYRO=UNAVAILABLE
          - ACC=UNAVAILABLE
          - HWFAIL

          If bad result appears even on stock firmware, problem is likely hardware/gyro/stack connector, not RUNA code.
          EOF

          echo "OUT files:"
          ls -lah out

      - name: Upload STOCK firmware
        uses: actions/upload-artifact@v4
        with:
          name: STOCK-SPEEDYBEEF405WING-INAV8-Firmware
          path: out/*
