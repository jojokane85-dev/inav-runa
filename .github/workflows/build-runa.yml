name: Build RUNA FC45 LSM6DXX I2C Scan

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: I2C1_ADDR6A
            i2c: BUS_I2C1
            addr: 0x6A
          - name: I2C1_ADDR6B
            i2c: BUS_I2C1
            addr: 0x6B
          - name: I2C2_ADDR6A
            i2c: BUS_I2C2
            addr: 0x6A
          - name: I2C2_ADDR6B
            i2c: BUS_I2C2
            addr: 0x6B
          - name: I2C3_ADDR6A
            i2c: BUS_I2C3
            addr: 0x6A
          - name: I2C3_ADDR6B
            i2c: BUS_I2C3
            addr: 0x6B

    env:
      INAV_VERSION: 7.1.2
      BASE_TARGET: SPEEDYBEEF405WING
      TARGET: CADDXF405_WING

    steps:
      - name: Install deps
        run: |
          sudo apt-get update -y -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            git \
            build-essential \
            g++ \
            ruby \
            cmake \
            make \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-dev \
            ninja-build \
            python3 \
            python3-pip

      - name: Clone INAV 7.1.2
        run: |
          set -e

          for i in 1 2 3 4 5; do
            echo "Clone attempt $i"

            git clone \
              --branch ${INAV_VERSION} \
              --depth 1 \
              --single-branch \
              --config http.version=HTTP/1.1 \
              --config http.postBuffer=524288000 \
              https://github.com/iNavFlight/inav.git && break

            echo "Clone failed, retrying..."
            rm -rf inav
            sleep 10
          done

          test -d inav || exit 1
          cd inav
          git rev-parse HEAD

      - name: Create CADDXF405_WING target
        run: |
          cd inav

          rm -rf src/main/target/${TARGET}
          cp -R src/main/target/${BASE_TARGET} src/main/target/${TARGET}

          if [ -f "src/main/target/${TARGET}/CMakeLists.txt" ]; then
            sed -i "s/${BASE_TARGET}/${TARGET}/g" src/main/target/${TARGET}/CMakeLists.txt
          fi

          echo "Created target ${TARGET} from ${BASE_TARGET}"
          ls -la src/main/target/${TARGET}

      - name: Patch target for FC45 LSM6DXX I2C scan
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          target = os.environ["TARGET"]
          i2c = "${{ matrix.i2c }}"
          addr = "${{ matrix.addr }}"

          target_dir = Path(f"src/main/target/{target}")
          target_h = target_dir / "target.h"

          if not target_h.exists():
              raise SystemExit(f"target.h not found: {target_h}")

          text = target_h.read_text(encoding="utf-8")

          remove_patterns = [
              r'^\s*#define\s+USE_IMU_ICM42605\s*$',
              r'^\s*#define\s+IMU_ICM42605_ALIGN\s+\S+\s*$',
              r'^\s*#define\s+ICM42605_CS_PIN\s+\S+\s*$',
              r'^\s*#define\s+ICM42605_SPI_BUS\s+\S+\s*$',
              r'^\s*#define\s+ICM42605_EXTI_PIN\s+\S+\s*$',

              r'^\s*#define\s+USE_IMU_BMI270\s*$',
              r'^\s*#define\s+BMI270_CS_PIN\s+\S+\s*$',
              r'^\s*#define\s+BMI270_SPI_BUS\s+\S+\s*$',
              r'^\s*#define\s+IMU_BMI270_ALIGN\s+\S+\s*$',

              r'^\s*#define\s+USE_IMU_LSM6DXX\s*$',
              r'^\s*#define\s+LSM6DXX_CS_PIN\s+\S+\s*$',
              r'^\s*#define\s+LSM6DXX_SPI_BUS\s+\S+\s*$',
              r'^\s*#define\s+LSM6DXX_I2C_BUS\s+\S+\s*$',
              r'^\s*#define\s+LSM6DXX_I2C_ADDR\s+\S+\s*$',
              r'^\s*#define\s+IMU_LSM6DXX_ALIGN\s+\S+\s*$',

              r'^\s*#define\s+USE_BARO_SPL06\s*$',
              r'^\s*#define\s+BARO_I2C_BUS\s+\S+\s*$',

              r'^\s*#define\s+USE_MAG_HMC5883\s*$',
              r'^\s*#define\s+USE_MAG_QMC5883\s*$',
              r'^\s*#define\s+MAG_I2C_BUS\s+\S+\s*$',
          ]

          for pattern in remove_patterns:
              text = re.sub(pattern, "", text, flags=re.M)

          text += f"""

          /*
           * RUNA FC4.5 LSM6DXX I2C SCAN
           *
           * Working dump:
           * ACC/GYRO = LSM6DXX
           * BARO = SPL06
           * MAG = HMC5883
           *
           * Variant:
           * I2C = {i2c}
           * ADDR = {addr}
           */

          #define USE_IMU_LSM6DXX
          #define LSM6DXX_I2C_BUS {i2c}
          #define LSM6DXX_I2C_ADDR {addr}
          #define IMU_LSM6DXX_ALIGN CW0_DEG

          #define USE_BARO_SPL06
          #define BARO_I2C_BUS BUS_I2C1

          #define USE_MAG_HMC5883
          #define MAG_I2C_BUS BUS_I2C1
          """

          target_h.write_text(text, encoding="utf-8")

          # Если в target.c есть SPI-регистрация IMU — убираем её.
          target_c = target_dir / "target.c"
          if target_c.exists():
              ctext = target_c.read_text(encoding="utf-8")
              ctext = re.sub(r'^.*DEVHW_ICM42605.*$\n?', '', ctext, flags=re.M)
              ctext = re.sub(r'^.*DEVHW_BMI270.*$\n?', '', ctext, flags=re.M)
              ctext = re.sub(r'^.*DEVHW_LSM6DXX.*$\n?', '', ctext, flags=re.M)
              target_c.write_text(ctext, encoding="utf-8")

          print("Target patched:")
          print("I2C =", i2c)
          print("ADDR =", addr)
          PY

          echo "===== Patched target.h lines ====="
          grep -n -E "LSM6DXX|SPL06|HMC5883|I2C|ALIGN" src/main/target/${TARGET}/target.h || true

      - name: Patch startup OSD text test
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path

          path = Path("src/main/io/osd.c")

          if not path.exists():
              print("osd.c not found, skip")
              raise SystemExit(0)

          text = path.read_text(encoding="utf-8")

          old = 'tfp_sprintf(string_buffer, "INAV VERSION: %s", FC_VERSION_STRING);'
          new = 'tfp_sprintf(string_buffer, "RUNA45 I2C");'

          if old in text:
              text = text.replace(old, new, 1)
              text = text.replace(
                  'uint8_t xPos = (osdDisplayPort->cols - 19) / 2;',
                  'uint8_t xPos = OSD_CENTER_S(string_buffer);',
                  1
              )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Configure CMake
        run: |
          cd inav
          mkdir -p build
          cd build
          cmake ..

      - name: Check target exists
        run: |
          cd inav/build

          if make help | grep -w "${TARGET}"; then
            echo "Target found: ${TARGET}"
          else
            echo "TARGET NOT FOUND: ${TARGET}"
            make help | grep -i -E "CADDX|SPEEDYBEE|F405|WING" || true
            exit 1
          fi

      - name: Build firmware
        run: |
          cd inav/build
          make clean_${TARGET} || true
          make ${TARGET} -j2 VERBOSE=1

      - name: Find built files
        if: always()
        run: |
          echo "Built firmware files:"
          find inav/build -type f \( -name "*.hex" -o -name "*.bin" -o -name "*.elf" \) -print || true

      - name: Collect firmware and CLI
        run: |
          mkdir -p out

          FOUND=0

          while IFS= read -r f; do
            base="$(basename "$f")"
            dst="out/RUNA_FC45_LSM6DXX_I2C_SCAN_${{ matrix.name }}_${base}"
            cp "$f" "$dst"
            echo "Copied: $dst"
            FOUND=$((FOUND + 1))
          done < <(find inav/build -type f \( -name "*${TARGET}*.hex" -o -name "*${TARGET}*.bin" -o -name "*${TARGET}*.elf" \))

          if [ "$FOUND" -eq 0 ]; then
            echo "ERROR: no firmware files found"
            find inav/build -type f \( -name "*.hex" -o -name "*.bin" -o -name "*.elf" \) -print || true
            exit 1
          fi

          cat > out/RUNA_FC45_LSM6DXX_I2C_SCAN_${{ matrix.name }}.cli <<'EOF'
          batch start

          # RUNA FC4.5 LSM6DXX I2C SCAN
          # Variant:
          # I2C = ${{ matrix.i2c }}
          # ADDR = ${{ matrix.addr }}

          feature -GPS
          feature OSD
          feature PWM_OUTPUT_ENABLE

          set acc_hardware = LSM6DXX
          set baro_hardware = SPL06
          set mag_hardware = HMC5883
          set align_mag = CW0FLIP

          set align_board_roll = 0
          set align_board_pitch = 0
          set align_board_yaw = 1800

          set gyro_zero_x = 0
          set gyro_zero_y = 0
          set gyro_zero_z = 0

          set acczero_x = 0
          set acczero_y = 0
          set acczero_z = 0

          set accgain_x = 4096
          set accgain_y = 4096
          set accgain_z = 4096

          set vbat_adc_channel = 1
          set rssi_adc_channel = 4
          set current_adc_channel = 2
          set airspeed_adc_channel = 3

          set receiver_type = SERIAL
          set serialrx_provider = CRSF

          set nav_extra_arming_safety = OFF
          set failsafe_procedure = NONE
          set small_angle = 180

          save
          EOF

          cat > out/README_${{ matrix.name }}.txt <<'EOF'
          RUNA FC45 LSM6DXX I2C SCAN

          Variant:
          I2C = ${{ matrix.i2c }}
          ADDR = ${{ matrix.addr }}

          Flash HEX from this archive.

          After flashing:
          1. CLI:
             defaults
             save

          2. Wait 15 seconds without touching board.

          3. Apply:
             RUNA_FC45_LSM6DXX_I2C_SCAN_${{ matrix.name }}.cli

          4. Calibrate accelerometer manually:
             Calibration -> Calibrate Accelerometer

          5. Check:
             status
             get align_board

          Good result:
          - GYRO=OK
          - ACC=OK
          - BARO=OK
          - MAG=OK
          - 3D model does NOT spin fast

          Bad result:
          - GYRO=UNAVAILABLE
          - ACC=UNAVAILABLE
          - 3D model spins fast
          - HWFAIL

          Test without propeller.
          EOF

          ls -lah out

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: RUNA-FC45-LSM6DXX-I2C-SCAN-${{ matrix.name }}
          path: out/*
