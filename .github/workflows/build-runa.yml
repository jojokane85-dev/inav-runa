name: Build RUNA CADDXF405 WING FC45 FORCE LSM6DXX

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      BASE_TARGET: SPEEDYBEEF405WING
      TARGET: CADDXF405_WING

    steps:
      - name: Install deps
        run: |
          sudo apt-get update -y -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            git \
            build-essential \
            g++ \
            ruby \
            cmake \
            make \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-dev \
            ninja-build \
            python3 \
            python3-pip

      - name: Clone INAV 7.1.2
        run: |
          git clone --branch 7.1.2 --depth 1 https://github.com/iNavFlight/inav.git
          cd inav
          echo "Current commit:"
          git rev-parse HEAD

      - name: Create CADDXF405_WING target from SPEEDYBEEF405WING
        run: |
          cd inav

          rm -rf src/main/target/${TARGET}
          cp -R src/main/target/${BASE_TARGET} src/main/target/${TARGET}

          echo "Fix CMakeLists target name..."
          sed -i "s/${BASE_TARGET}/${TARGET}/g" src/main/target/${TARGET}/CMakeLists.txt

          echo "Created target:"
          ls -la src/main/target/${TARGET}

          echo "CMakeLists:"
          cat src/main/target/${TARGET}/CMakeLists.txt

      - name: Patch CADDXF405_WING target to LSM6DXX
        run: |
          cd inav
          python3 <<'PY'
          from pathlib import Path
          import re
          import os

          target = os.environ["TARGET"]
          path = Path(f"src/main/target/{target}/target.h")
          text = path.read_text(encoding="utf-8")

          remove_patterns = [
              r'//\s*ICM42605/ICM42688P\s*',
              r'#define\s+USE_IMU_ICM42605\s*',
              r'#define\s+IMU_ICM42605_ALIGN\s+\S+\s*',
              r'#define\s+ICM42605_CS_PIN\s+\S+\s*',
              r'#define\s+ICM42605_SPI_BUS\s+\S+\s*',

              r'#define\s+USE_IMU_ICM42688P\s*',
              r'#define\s+IMU_ICM42688P_ALIGN\s+\S+\s*',
              r'#define\s+ICM42688P_CS_PIN\s+\S+\s*',
              r'#define\s+ICM42688P_SPI_BUS\s+\S+\s*',

              r'#define\s+USE_IMU_LSM6DXX\s*',
              r'#define\s+LSM6DXX_SPI_BUS\s+\S+\s*',
              r'#define\s+LSM6DXX_CS_PIN\s+\S+\s*',
              r'#define\s+IMU_LSM6DXX_ALIGN\s+\S+\s*',
          ]

          for pattern in remove_patterns:
              text = re.sub(pattern, "", text, flags=re.M)

          text += """

          /*
           * RUNA CADDXF405_WING FC 4.5
           *
           * Original working status:
           * INAV/CADDXF405_WING 7.1.2
           * GYRO=LSM6DXX
           * ACC=LSM6DXX
           * BARO=SPL06
           * MAG=HMC5883
           *
           * Pins from resource:
           * PA4 = MPU CS
           * PA5 = SPI1 SCK
           * PA6 = SPI1 MISO
           * PA7 = SPI1 MOSI
           */
          #define USE_IMU_LSM6DXX
          #define LSM6DXX_SPI_BUS BUS_SPI1
          #define LSM6DXX_CS_PIN PA4
          #define IMU_LSM6DXX_ALIGN CW0_DEG
          """

          path.write_text(text, encoding="utf-8")

          check = path.read_text(encoding="utf-8")

          forbidden = [
              "USE_IMU_ICM42605",
              "ICM42605_CS_PIN",
              "ICM42605_SPI_BUS",
              "USE_IMU_ICM42688P",
              "ICM42688P_CS_PIN",
              "ICM42688P_SPI_BUS",
          ]

          for item in forbidden:
              if item in check:
                  print("ERROR: forbidden line still exists:", item)
                  raise SystemExit(1)

          required = [
              "USE_IMU_LSM6DXX",
              "LSM6DXX_SPI_BUS BUS_SPI1",
              "LSM6DXX_CS_PIN PA4",
              "IMU_LSM6DXX_ALIGN CW0_DEG",
          ]

          for item in required:
              if item not in check:
                  print("ERROR: required line missing:", item)
                  raise SystemExit(1)

          print("RUNA CADDXF405_WING target patched OK")
          print("IMU = LSM6DXX")
          print("BUS = SPI1")
          print("CS  = PA4")
          print("ALIGN = CW0_DEG")
          PY

          echo "==== CHECK CADDXF405_WING target.h IMU lines ===="
          grep -n -E "IMU|LSM6|ICM426|PA4|SPI1|CW0" src/main/target/${TARGET}/target.h || true

      - name: Patch LSM6DXX driver FORCE DETECT
        run: |
          cd inav
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/drivers/accgyro/accgyro_lsm6dxx.c")
          text = path.read_text(encoding="utf-8")

          pattern = r"static bool lsm6dxxDetect\(busDevice_t \* dev\)\s*\{.*?\n\}"

          replacement = r'''static bool lsm6dxxDetect(busDevice_t * dev)
          {
              uint8_t tmp = 0;

              busSetSpeed(dev, BUS_SPEED_INITIALIZATION);
              delay(150);

              busRead(dev, LSM6DXX_REG_WHO_AM_I, &tmp);

              /*
               * RUNA CADDXF405_WING FC4.5 FORCE DETECT
               *
               * Original firmware detects this board as:
               * GYRO=LSM6DXX
               * ACC=LSM6DXX
               *
               * If WHO_AM_I is one of known LSM6 values, keep it.
               * If not, still force LSM6DS3 ID so INAV continues init.
               */
              if (tmp == 0x69 || tmp == 0x6A || tmp == 0x6B || tmp == 0x6C || tmp == 0x6D) {
                  lsm6dID = tmp;
              } else {
                  lsm6dID = LSM6DS3_CHIP_ID;
              }

              return true;
          }'''

          new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)

          if count != 1:
              print("ERROR: lsm6dxxDetect function not replaced")
              print("Searching for function...")
              start = text.find("static bool lsm6dxxDetect")
              print("Start:", start)
              if start != -1:
                  print(text[start:start + 1200])
              raise SystemExit(1)

          path.write_text(new_text, encoding="utf-8")
          print("RUNA FORCE LSM6DXX detect patched")
          PY

          echo "==== CHECK FORCE DETECT ===="
          grep -n -A35 -B5 "static bool lsm6dxxDetect" src/main/drivers/accgyro/accgyro_lsm6dxx.c || true

      - name: Patch default acc hardware and ADC defaults
        run: |
          cd inav
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/fc/settings.yaml")
          text = path.read_text(encoding="utf-8")

          def patch_setting(text, name, value):
              pattern = rf"(-\s+name:\s*{re.escape(name)}\b(?:(?!\n\s*-\s+name:).)*?default_value:\s*)([^\n\r]+)"

              def repl(m):
                  print(f"{name}: {m.group(2).strip()} -> {value}")
                  return m.group(1) + str(value)

              new_text, count = re.subn(pattern, repl, text, count=1, flags=re.S)

              if count != 1:
                  print(f"WARNING: {name} default not found")

              return new_text

          text = patch_setting(text, "acc_hardware", "LSM6DXX")

          # Как в рабочем CADDXF405_WING:
          # RSSI ADC3, CURRENT ADC2, AIRSPEED ADC4
          text = patch_setting(text, "rssi_adc_channel", "3")
          text = patch_setting(text, "current_adc_channel", "2")
          text = patch_setting(text, "airspeed_adc_channel", "4")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Patch RUNA name in Configurator
        run: |
          cd inav
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/fc/fc_msp.c")
          text = path.read_text(encoding="utf-8")

          pattern = r'sbufWriteU8\(dst,\s*strlen\(targetName\)\);\s*sbufWriteData\(dst,\s*targetName,\s*strlen\(targetName\)\);'

          replacement = '''const char *runaTargetName = "CADDXF405_WING+RUNA";
                  sbufWriteU8(dst, strlen(runaTargetName));
                  sbufWriteData(dst, runaTargetName, strlen(runaTargetName));'''

          new_text, count = re.subn(pattern, replacement, text, count=1)

          if count == 1:
              path.write_text(new_text, encoding="utf-8")
              print("Patched Configurator target name: CADDXF405_WING+RUNA")
          else:
              print("WARNING: targetName MSP patch not found")
          PY

      - name: Patch startup text
        run: |
          cd inav
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/main/io/osd.c")
          text = path.read_text(encoding="utf-8")

          old = 'tfp_sprintf(string_buffer, "INAV VERSION: %s", FC_VERSION_STRING);'
          new = 'tfp_sprintf(string_buffer, "version RUNA 1.0");'

          if old in text:
              text = text.replace(old, new, 1)
              text = text.replace(
                  'uint8_t xPos = (osdDisplayPort->cols - 19) / 2;',
                  'uint8_t xPos = OSD_CENTER_S(string_buffer);',
                  1
              )
              path.write_text(text, encoding="utf-8")
              print("Startup text patched: version RUNA 1.0")
          else:
              print("WARNING: startup text line not found")
          PY

      - name: Patch RUNA 3.3GHz VTX table
        run: |
          cd inav
          python3 <<'PY'
          from pathlib import Path
          import re

          def sub_required(text, pattern, replacement, name, flags=0):
              new_text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  print(f"WARNING: could not replace: {name}")
                  return text
              print("Patched:", name)
              return new_text

          path = Path("src/main/io/vtx_string.c")
          if path.exists():
              text = path.read_text(encoding="utf-8")

              text = sub_required(
                  text,
                  r"#define\s+VTX_STRING_1G3_BAND_COUNT\s+\d+",
                  "#define VTX_STRING_1G3_BAND_COUNT 6",
                  "VTX_STRING_1G3_BAND_COUNT"
              )

              text = sub_required(
                  text,
                  r"#define\s+VTX_STRING_1G3_POWER_COUNT\s+\d+",
                  "#define VTX_STRING_1G3_POWER_COUNT 5",
                  "VTX_STRING_1G3_POWER_COUNT"
              )

              text = sub_required(
                  text,
                  r"const\s+uint16_t\s+vtx1G3frequencyTable\s*\[\s*VTX_STRING_1G3_BAND_COUNT\s*\]\s*\[\s*VTX_STRING_1G3_CHAN_COUNT\s*\]\s*=\s*\{.*?\};",
                  """const uint16_t vtx1G3frequencyTable[VTX_STRING_1G3_BAND_COUNT][VTX_STRING_1G3_CHAN_COUNT] = {
              { 3083, 3114, 3145, 3176, 3207, 3238, 3269, 3300 },
              { 3215, 3235, 3255, 3275, 3295, 3315, 3335, 3355 },
              { 3170, 3190, 3210, 3230, 3250, 3270, 3290, 3310 },
              { 3320, 3345, 3370, 3395, 3420, 3445, 3470, 3495 },
              { 3310, 3330, 3355, 3380, 3405, 3430, 3455, 3480 },
              { 3330, 3350, 3370, 3390, 3410, 3430, 3450, 3470 },
          };""",
                  "vtx1G3frequencyTable",
                  flags=re.S
              )

              text = sub_required(
                  text,
                  r"const\s+char\s*\*\s+const\s+vtx1G3BandNames\s*\[\s*VTX_STRING_1G3_BAND_COUNT\s*\+\s*1\s*\]\s*=\s*\{.*?\};",
                  """const char * const vtx1G3BandNames[VTX_STRING_1G3_BAND_COUNT + 1] = {
              "-", "A", "B", "C", "D", "E", "F",
          };""",
                  "vtx1G3BandNames",
                  flags=re.S
              )

              text = sub_required(
                  text,
                  r'const\s+char\s+vtx1G3BandLetter\s*\[\s*VTX_STRING_1G3_BAND_COUNT\s*\+\s*1\s*\]\s*=\s*".*?";',
                  'const char vtx1G3BandLetter[VTX_STRING_1G3_BAND_COUNT + 1] = "-ABCDEF";',
                  "vtx1G3BandLetter",
                  flags=re.S
              )

              text = sub_required(
                  text,
                  r"const\s+char\s*\*\s+const\s+vtx1G3DefaultPowerNames\s*\[\s*VTX_STRING_1G3_POWER_COUNT\s*\+\s*1\s*\]\s*=\s*\{.*?\};",
                  """const char * const vtx1G3DefaultPowerNames[VTX_STRING_1G3_POWER_COUNT + 1] = {
              "---", "25", "200", "400", "800", "MAX"
          };""",
                  "vtx1G3DefaultPowerNames",
                  flags=re.S
              )

              path.write_text(text, encoding="utf-8")

          path = Path("src/main/io/vtx_string.h")
          if path.exists():
              text = path.read_text(encoding="utf-8")
              text = re.sub(
                  r"extern\s+const\s+uint16_t\s+vtx1G3frequencyTable\s*\[\s*\d+\s*\]\s*\[\s*8\s*\]\s*;",
                  "extern const uint16_t vtx1G3frequencyTable[6][8];",
                  text
              )
              text = text.replace(
                  "extern const char vtx51G3BandLetter[];",
                  "extern const char vtx1G3BandLetter[];"
              )
              path.write_text(text, encoding="utf-8")

          print("RUNA 3.3GHz VTX table patch step completed")
          PY

      - name: Patch RUNA OSD shutter
        run: |
          cd inav
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/io/osd.c")
          text = path.read_text(encoding="utf-8")

          pattern = r'osdDrawNextElement\(\);\s*displayHeartbeat\(osdDisplayPort\);\s*displayCommitTransaction\(osdDisplayPort\);'

          replacement = r'''
                  static bool runaShutterWasActive = false;
                  static uint8_t runaShutterNextRow = 0;

                  if (currentLayout == 2) {
                      textAttributes_t runaAttr = TEXT_ATTRIBUTES_NONE;
                      TEXT_ATTRIBUTES_ADD_SOLID_BG(runaAttr);

                      char runaMask[64];

                      uint8_t cols = osdDisplayPort->cols;
                      uint8_t rows = osdDisplayPort->rows;

                      if (cols > 63) {
                          cols = 63;
                      }

                      const uint8_t windowWidth = cols >= 30 ? 10 : cols / 3;
                      const uint8_t windowHeight = rows >= 16 ? 4 : rows / 3;

                      const uint8_t windowX = (cols - windowWidth) / 2;
                      const uint8_t windowY = (rows - windowHeight) / 2;

                      if (!runaShutterWasActive) {
                          displayClearScreen(osdDisplayPort);
                          runaShutterWasActive = true;
                          runaShutterNextRow = 0;
                      }

                      for (uint8_t pass = 0; pass < 2; pass++) {
                          uint8_t y = runaShutterNextRow;

                          const bool inWindowY = (y >= windowY) && (y < windowY + windowHeight);

                          if (!inWindowY) {
                              memset(runaMask, ' ', cols);
                              runaMask[cols] = '\0';
                              displayWriteWithAttr(osdDisplayPort, 0, y, runaMask, runaAttr);
                          } else {
                              if (windowX > 0) {
                                  memset(runaMask, ' ', windowX);
                                  runaMask[windowX] = '\0';
                                  displayWriteWithAttr(osdDisplayPort, 0, y, runaMask, runaAttr);
                              }

                              const uint8_t rightX = windowX + windowWidth;
                              if (rightX < cols) {
                                  const uint8_t rightWidth = cols - rightX;
                                  memset(runaMask, ' ', rightWidth);
                                  runaMask[rightWidth] = '\0';
                                  displayWriteWithAttr(osdDisplayPort, rightX, y, runaMask, runaAttr);
                              }
                          }

                          runaShutterNextRow++;

                          if (runaShutterNextRow >= rows) {
                              runaShutterNextRow = 0;
                          }
                      }
                  } else {
                      if (runaShutterWasActive) {
                          displayClearScreen(osdDisplayPort);
                          runaShutterWasActive = false;
                          runaShutterNextRow = 0;
                      }

                      osdDrawNextElement();
                  }

                  displayHeartbeat(osdDisplayPort);
                  displayCommitTransaction(osdDisplayPort);'''

          new_text, count = re.subn(pattern, replacement, text, count=1)

          if count != 1:
              print("ERROR: OSD draw block not found")
              raise SystemExit(1)

          path.write_text(new_text, encoding="utf-8")
          print("RUNA OSD shutter patched")
          PY

      - name: Configure CMake
        run: |
          cd inav
          mkdir -p build
          cd build
          cmake ..

      - name: Check target exists
        run: |
          cd inav/build
          echo "Checking target: ${TARGET}"
          make help | grep "${TARGET}" || {
            echo "TARGET NOT FOUND: ${TARGET}"
            echo "Trying to list CADDX / SPEEDY targets:"
            make help | grep -Ei "CADDX|CADDY|SPEEDY|F405WING" || true
            exit 1
          }

      - name: Build CADDXF405_WING
        run: |
          cd inav/build
          make clean_${TARGET} || true
          make ${TARGET} -j2 VERBOSE=1

      - name: Find firmware
        if: always()
        run: |
          echo "===== BUILT FILES ====="
          find inav/build -type f \( -name "*.hex" -o -name "*.bin" -o -name "*.elf" \) -print || true

      - name: Collect firmware
        if: success()
        run: |
          mkdir -p out/${TARGET}

          python3 <<'PY'
          from pathlib import Path
          import shutil
          import os

          target = os.environ["TARGET"]
          build_dir = Path("inav/build")
          out_dir = Path("out") / target
          out_dir.mkdir(parents=True, exist_ok=True)

          copied = 0

          for file in build_dir.rglob("*"):
              if not file.is_file():
                  continue

              if file.suffix.lower() not in {".hex", ".bin", ".elf"}:
                  continue

              if target not in file.name:
                  continue

              dst = out_dir / f"RUNA_FC45_CADDXF405_WING_FORCE_LSM6DXX_{file.name}"
              shutil.copy2(file, dst)
              print("Copied:", dst)
              copied += 1

          if copied == 0:
              print("ERROR: no firmware files found")
              raise SystemExit(1)

          print("Total copied:", copied)
          PY

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RUNA-FC45-CADDXF405-WING-FORCE-LSM6DXX
          path: out/${{ env.TARGET }}/*
