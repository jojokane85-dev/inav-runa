name: Build RUNA FC45 Orientation Matrix

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - align: CW0_DEG
            artifact: RUNA-FC45-CW0-DEG
          - align: CW90_DEG
            artifact: RUNA-FC45-CW90-DEG
          - align: CW180_DEG
            artifact: RUNA-FC45-CW180-DEG
          - align: CW270_DEG
            artifact: RUNA-FC45-CW270-DEG
          - align: CW0_DEG_FLIP
            artifact: RUNA-FC45-CW0-DEG-FLIP
          - align: CW90_DEG_FLIP
            artifact: RUNA-FC45-CW90-DEG-FLIP
          - align: CW180_DEG_FLIP
            artifact: RUNA-FC45-CW180-DEG-FLIP
          - align: CW270_DEG_FLIP
            artifact: RUNA-FC45-CW270-DEG-FLIP

    env:
      BASE_TARGET: SPEEDYBEEF405WING
      TARGET: CADDXF405_WING
      IMU_ALIGN: ${{ matrix.align }}

    steps:
      - name: Install deps
        run: |
          sudo apt-get update -y -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            git \
            build-essential \
            g++ \
            ruby \
            cmake \
            make \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-dev \
            ninja-build \
            python3 \
            python3-pip

      - name: Clone INAV 7.1.2
        run: |
          git clone --branch 7.1.2 --depth 1 https://github.com/iNavFlight/inav.git
          cd inav
          echo "Current commit:"
          git rev-parse HEAD

      - name: Create CADDXF405_WING target
        run: |
          cd inav

          rm -rf src/main/target/${TARGET}
          cp -R src/main/target/${BASE_TARGET} src/main/target/${TARGET}

          sed -i "s/${BASE_TARGET}/${TARGET}/g" src/main/target/${TARGET}/CMakeLists.txt

          echo "Created target ${TARGET}"
          cat src/main/target/${TARGET}/CMakeLists.txt

      - name: Patch target to LSM6DXX with selected orientation
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          target = os.environ["TARGET"]
          align = os.environ["IMU_ALIGN"]

          path = Path(f"src/main/target/{target}/target.h")
          text = path.read_text(encoding="utf-8")

          remove_patterns = [
              r'//\s*ICM42605/ICM42688P\s*',
              r'#define\s+USE_IMU_ICM42605\s*',
              r'#define\s+IMU_ICM42605_ALIGN\s+\S+\s*',
              r'#define\s+ICM42605_CS_PIN\s+\S+\s*',
              r'#define\s+ICM42605_SPI_BUS\s+\S+\s*',

              r'#define\s+USE_IMU_ICM42688P\s*',
              r'#define\s+IMU_ICM42688P_ALIGN\s+\S+\s*',
              r'#define\s+ICM42688P_CS_PIN\s+\S+\s*',
              r'#define\s+ICM42688P_SPI_BUS\s+\S+\s*',

              r'#define\s+USE_IMU_LSM6DXX\s*',
              r'#define\s+LSM6DXX_SPI_BUS\s+\S+\s*',
              r'#define\s+LSM6DXX_CS_PIN\s+\S+\s*',
              r'#define\s+IMU_LSM6DXX_ALIGN\s+\S+\s*',
          ]

          for pattern in remove_patterns:
              text = re.sub(pattern, "", text, flags=re.M)

          text += f"""

          /*
           * RUNA CADDXF405_WING FC 4.5
           *
           * GYRO = LSM6DXX
           * ACC  = LSM6DXX
           * BARO = SPL06
           * MAG  = HMC5883
           *
           * PA4 = MPU CS
           * PA5 = SPI1 SCK
           * PA6 = SPI1 MISO
           * PA7 = SPI1 MOSI
           *
           * TEST ALIGN = {align}
           */
          #define USE_IMU_LSM6DXX
          #define LSM6DXX_SPI_BUS BUS_SPI1
          #define LSM6DXX_CS_PIN PA4
          #define IMU_LSM6DXX_ALIGN {align}
          """

          path.write_text(text, encoding="utf-8")

          check = path.read_text(encoding="utf-8")

          required = [
              "USE_IMU_LSM6DXX",
              "LSM6DXX_SPI_BUS BUS_SPI1",
              "LSM6DXX_CS_PIN PA4",
              f"IMU_LSM6DXX_ALIGN {align}",
          ]

          for item in required:
              if item not in check:
                  print("ERROR: missing", item)
                  raise SystemExit(1)

          print("Target patched OK")
          print("ALIGN =", align)
          PY

          grep -n -E "LSM6|IMU|PA4|SPI1|CW" src/main/target/${TARGET}/target.h || true

      - name: Patch LSM6DXX driver FORCE DETECT
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path

          path = Path("src/main/drivers/accgyro/accgyro_lsm6dxx.c")
          text = path.read_text(encoding="utf-8")

          func_name = "static bool lsm6dxxDetect"
          func_start = text.find(func_name)

          if func_start == -1:
              print("ERROR: lsm6dxxDetect function not found")
              raise SystemExit(1)

          brace_start = text.find("{", func_start)

          if brace_start == -1:
              print("ERROR: function opening brace not found")
              raise SystemExit(1)

          depth = 0
          func_end = -1

          for i in range(brace_start, len(text)):
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
                  if depth == 0:
                      func_end = i + 1
                      break

          if func_end == -1:
              print("ERROR: function closing brace not found")
              raise SystemExit(1)

          replacement = r'''static bool lsm6dxxDetect(busDevice_t * dev)
          {
              uint8_t tmp = 0;

              busSetSpeed(dev, BUS_SPEED_INITIALIZATION);
              delay(150);

              busRead(dev, LSM6DXX_REG_WHO_AM_I, &tmp);

              /*
               * RUNA FC45 FORCE DETECT
               * Original CADDXF405_WING firmware detects:
               * GYRO=LSM6DXX
               * ACC=LSM6DXX
               */
              if (tmp == 0x69 || tmp == 0x6A || tmp == 0x6B || tmp == 0x6C || tmp == 0x6D) {
                  lsm6dID = tmp;
              } else {
                  lsm6dID = LSM6DS3_CHIP_ID;
              }

              return true;
          }'''

          text = text[:func_start] + replacement + text[func_end:]
          path.write_text(text, encoding="utf-8")

          print("LSM6DXX FORCE DETECT patched OK")
          PY

          grep -n -A35 -B5 "static bool lsm6dxxDetect" src/main/drivers/accgyro/accgyro_lsm6dxx.c || true

      - name: Patch defaults
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/fc/settings.yaml")
          text = path.read_text(encoding="utf-8")

          def patch_setting(text, name, value):
              pattern = rf"(-\s+name:\s*{re.escape(name)}\b(?:(?!\n\s*-\s+name:).)*?default_value:\s*)([^\n\r]+)"

              def repl(m):
                  print(f"{name}: {m.group(2).strip()} -> {value}")
                  return m.group(1) + str(value)

              new_text, count = re.subn(pattern, repl, text, count=1, flags=re.S)

              if count != 1:
                  print(f"WARNING: {name} not found")

              return new_text

          text = patch_setting(text, "acc_hardware", "LSM6DXX")
          text = patch_setting(text, "rssi_adc_channel", "3")
          text = patch_setting(text, "current_adc_channel", "2")
          text = patch_setting(text, "airspeed_adc_channel", "4")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Patch RUNA name
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/fc/fc_msp.c")
          text = path.read_text(encoding="utf-8")

          pattern = r'sbufWriteU8\(dst,\s*strlen\(targetName\)\);\s*sbufWriteData\(dst,\s*targetName,\s*strlen\(targetName\)\);'

          replacement = '''const char *runaTargetName = "CADDXF405_WING+RUNA";
                  sbufWriteU8(dst, strlen(runaTargetName));
                  sbufWriteData(dst, runaTargetName, strlen(runaTargetName));'''

          new_text, count = re.subn(pattern, replacement, text, count=1)

          if count == 1:
              path.write_text(new_text, encoding="utf-8")
              print("RUNA name patched")
          else:
              print("WARNING: RUNA name patch not found")
          PY

      - name: Patch startup text
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path

          path = Path("src/main/io/osd.c")
          text = path.read_text(encoding="utf-8")

          old = 'tfp_sprintf(string_buffer, "INAV VERSION: %s", FC_VERSION_STRING);'
          new = 'tfp_sprintf(string_buffer, "version RUNA 1.0");'

          if old in text:
              text = text.replace(old, new, 1)
              text = text.replace(
                  'uint8_t xPos = (osdDisplayPort->cols - 19) / 2;',
                  'uint8_t xPos = OSD_CENTER_S(string_buffer);',
                  1
              )
              path.write_text(text, encoding="utf-8")
              print("Startup text patched")
          else:
              print("WARNING: startup text line not found")
          PY

      - name: Patch RUNA OSD shutter
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/io/osd.c")
          text = path.read_text(encoding="utf-8")

          pattern = r'osdDrawNextElement\(\);\s*displayHeartbeat\(osdDisplayPort\);\s*displayCommitTransaction\(osdDisplayPort\);'

          replacement = r'''
                  static bool runaShutterWasActive = false;
                  static uint8_t runaShutterNextRow = 0;

                  if (currentLayout == 2) {
                      textAttributes_t runaAttr = TEXT_ATTRIBUTES_NONE;
                      TEXT_ATTRIBUTES_ADD_SOLID_BG(runaAttr);

                      char runaMask[64];

                      uint8_t cols = osdDisplayPort->cols;
                      uint8_t rows = osdDisplayPort->rows;

                      if (cols > 63) {
                          cols = 63;
                      }

                      const uint8_t windowWidth = cols >= 30 ? 10 : cols / 3;
                      const uint8_t windowHeight = rows >= 16 ? 4 : rows / 3;

                      const uint8_t windowX = (cols - windowWidth) / 2;
                      const uint8_t windowY = (rows - windowHeight) / 2;

                      if (!runaShutterWasActive) {
                          displayClearScreen(osdDisplayPort);
                          runaShutterWasActive = true;
                          runaShutterNextRow = 0;
                      }

                      for (uint8_t pass = 0; pass < 2; pass++) {
                          uint8_t y = runaShutterNextRow;

                          const bool inWindowY = (y >= windowY) && (y < windowY + windowHeight);

                          if (!inWindowY) {
                              memset(runaMask, ' ', cols);
                              runaMask[cols] = '\0';
                              displayWriteWithAttr(osdDisplayPort, 0, y, runaMask, runaAttr);
                          } else {
                              if (windowX > 0) {
                                  memset(runaMask, ' ', windowX);
                                  runaMask[windowX] = '\0';
                                  displayWriteWithAttr(osdDisplayPort, 0, y, runaMask, runaAttr);
                              }

                              const uint8_t rightX = windowX + windowWidth;
                              if (rightX < cols) {
                                  const uint8_t rightWidth = cols - rightX;
                                  memset(runaMask, ' ', rightWidth);
                                  runaMask[rightWidth] = '\0';
                                  displayWriteWithAttr(osdDisplayPort, rightX, y, runaMask, runaAttr);
                              }
                          }

                          runaShutterNextRow++;

                          if (runaShutterNextRow >= rows) {
                              runaShutterNextRow = 0;
                          }
                      }
                  } else {
                      if (runaShutterWasActive) {
                          displayClearScreen(osdDisplayPort);
                          runaShutterWasActive = false;
                          runaShutterNextRow = 0;
                      }

                      osdDrawNextElement();
                  }

                  displayHeartbeat(osdDisplayPort);
                  displayCommitTransaction(osdDisplayPort);'''

          new_text, count = re.subn(pattern, replacement, text, count=1)

          if count != 1:
              print("ERROR: OSD draw block not found")
              raise SystemExit(1)

          path.write_text(new_text, encoding="utf-8")
          print("RUNA OSD shutter patched")
          PY

      - name: Configure CMake
        run: |
          cd inav
          mkdir -p build
          cd build
          cmake ..

      - name: Build firmware
        run: |
          cd inav/build

          make clean_${TARGET} || true
          make ${TARGET} -j2 VERBOSE=1

      - name: Collect firmware
        if: success()
        run: |
          mkdir -p out

          cd inav/build

          FOUND=0

          while IFS= read -r f; do
            base="$(basename "$f")"
            dst="../../out/RUNA_FC45_${IMU_ALIGN}_${base}"
            cp "$f" "$dst"
            echo "Copied: $dst"
            FOUND=$((FOUND + 1))
          done < <(find . -type f \( -name "*${TARGET}*.hex" -o -name "*${TARGET}*.bin" -o -name "*${TARGET}*.elf" \))

          if [ "$FOUND" -eq 0 ]; then
            echo "ERROR: no firmware files found"
            find . -type f \( -name "*.hex" -o -name "*.bin" -o -name "*.elf" \) -print || true
            exit 1
          fi

          cat > ../../out/README_${IMU_ALIGN}.txt <<EOF
          RUNA FC45 CADDXF405_WING
          IMU ALIGN: ${IMU_ALIGN}

          After flashing:
          1) defaults
          2) save

          Then:
          set align_board_roll = 0
          set align_board_pitch = 0
          set align_board_yaw = 0
          save

          If ACC flag appears:
          set acczero_x = 0
          set acczero_y = -2
          set acczero_z = 20
          set accgain_x = 4091
          set accgain_y = 4093
          set accgain_z = 4094
          save

          Correct movement:
          nose up -> model nose up
          nose down -> model nose down
          left wing down -> model rolls left
          right wing down -> model rolls right
          EOF

          echo "Final files:"
          ls -la ../../out

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
