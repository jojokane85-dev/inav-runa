name: Build RUNA FC51 ICM40609 Driver Test

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      INAV_VERSION: 7.1.2
      TARGET: SPEEDYBEEF405WING

      OLD_TARGET_NAME: SPEEDYBEEF405WING
      NEW_TARGET_NAME: SPEEDYBEE51+RUNA!

    steps:
      - name: Install deps
        run: |
          sudo apt-get update -y -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            git \
            build-essential \
            g++ \
            ruby \
            cmake \
            make \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-dev \
            ninja-build \
            python3 \
            python3-pip

      - name: Clone INAV 7.1.2
        run: |
          set -e

          for i in 1 2 3 4 5; do
            echo "Clone attempt $i"

            git clone \
              --branch ${INAV_VERSION} \
              --depth 1 \
              --single-branch \
              --config http.version=HTTP/1.1 \
              --config http.postBuffer=524288000 \
              https://github.com/iNavFlight/inav.git && break

            echo "Clone failed, retrying..."
            rm -rf inav
            sleep 10
          done

          test -d inav || exit 1
          cd inav
          git rev-parse HEAD

      - name: Patch ICM42605 driver to accept ICM40609
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/drivers/accgyro/accgyro_icm42605.c")

          if not path.exists():
              raise SystemExit("accgyro_icm42605.c not found")

          text = path.read_text(encoding="utf-8")

          # 1) Добавляем флаг is40609
          if "static bool is40609" not in text:
              text = text.replace(
                  "static bool is42688P = false;",
                  "static bool is42688P = false;\nstatic bool is40609 = false;",
                  1
              )

          # 2) Для ICM40609, если ACCEL_CONFIG0 = 0x00, это режим ±32g.
          # 16-bit / 32g = 1024 LSB/g.
          # Для ICM42605 оставляем старые 2048 LSB/g.
          text = text.replace(
              "acc->acc_1G = 512 * 4;",
              "acc->acc_1G = is40609 ? 1024 : (512 * 4);",
              1
          )

          # 3) В detect добавляем WHO_AM_I 0x3B.
          # В оригинале switch принимает ICM42605 и ICM42688P.
          # Мы добавляем ICM40609 как совместимый режим через этот же драйвер.
          if "case 0x3B:" not in text:
              text = text.replace(
                  "case ICM42605_WHO_AM_I_CONST:\n            is42688P = false;",
                  "case ICM42605_WHO_AM_I_CONST:\n            is40609 = false;\n            is42688P = false;",
                  1
              )

              text = text.replace(
                  "case ICM42688P_WHO_AM_I_CONST:\n            is42688P = true;",
                  "case ICM42688P_WHO_AM_I_CONST:\n            is40609 = false;\n            is42688P = true;",
                  1
              )

              text = text.replace(
                  "case ICM42688P_WHO_AM_I_CONST:\n            is40609 = false;\n            is42688P = true;\n            return true;",
                  "case ICM42688P_WHO_AM_I_CONST:\n            is40609 = false;\n            is42688P = true;\n            return true;\n        case 0x3B:\n            /* RUNA FC51: ICM40609 WHO_AM_I = 0x3B */\n            is40609 = true;\n            is42688P = false;\n            return true;",
                  1
              )

          path.write_text(text, encoding="utf-8")

          print("ICM42605 driver patched for ICM40609 WHO_AM_I 0x3B")
          print("Check patch:")
          for line in text.splitlines():
              if "is40609" in line or "0x3B" in line or "acc_1G" in line:
                  print(line)
          PY

      - name: Patch startup OSD text
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path

          path = Path("src/main/io/osd.c")

          if not path.exists():
              print("WARNING: osd.c not found")
              raise SystemExit(0)

          text = path.read_text(encoding="utf-8")

          old = 'tfp_sprintf(string_buffer, "INAV VERSION: %s", FC_VERSION_STRING);'
          new = 'tfp_sprintf(string_buffer, "RUNAv.51");'

          if old in text:
              text = text.replace(old, new, 1)
              text = text.replace(
                  'uint8_t xPos = (osdDisplayPort->cols - 19) / 2;',
                  'uint8_t xPos = OSD_CENTER_S(string_buffer);',
                  1
              )
              print("Startup OSD text patched")
          else:
              print("WARNING: startup text pattern not found")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Configure CMake
        run: |
          cd inav
          mkdir -p build
          cd build
          cmake ..

      - name: Check target exists
        run: |
          cd inav/build

          if make help | grep -w "${TARGET}"; then
            echo "Target found: ${TARGET}"
          else
            echo "TARGET NOT FOUND: ${TARGET}"
            make help | grep -i -E "SPEEDYBEE|F405|WING" || true
            exit 1
          fi

      - name: Build firmware
        run: |
          cd inav/build
          make clean_${TARGET} || true
          make ${TARGET} -j2 VERBOSE=1

      - name: Patch RUNA name in HEX and BIN
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os

          old = os.environ["OLD_TARGET_NAME"].encode()
          new = os.environ["NEW_TARGET_NAME"].encode()
          target = os.environ["TARGET"]

          print("OLD:", os.environ["OLD_TARGET_NAME"], len(old))
          print("NEW:", os.environ["NEW_TARGET_NAME"], len(new))

          if len(old) != len(new):
              raise SystemExit("Length mismatch")

          out = Path("out")
          out.mkdir(exist_ok=True)

          hex_files = list(Path("inav/build").rglob(f"*{target}*.hex"))
          if not hex_files:
              hex_files = list(Path("inav/build").rglob("*.hex"))
          if not hex_files:
              raise SystemExit("No HEX found")

          src_hex = hex_files[0]
          print("Using HEX:", src_hex)

          records = []
          memory = {}
          base = 0

          def parse_record(line):
              count = int(line[1:3], 16)
              addr = int(line[3:7], 16)
              rectype = int(line[7:9], 16)
              data = bytes.fromhex(line[9:9 + count * 2])
              return count, addr, rectype, data

          for line in src_hex.read_text().splitlines():
              if not line.startswith(":"):
                  records.append((line, None))
                  continue

              count, addr, rectype, data = parse_record(line)
              records.append((line, (count, addr, rectype, data, base)))

              if rectype == 0:
                  absolute = base + addr
                  for i, b in enumerate(data):
                      memory[absolute + i] = b
              elif rectype == 4:
                  base = int.from_bytes(data, "big") << 16
              elif rectype == 2:
                  base = int.from_bytes(data, "big") << 4

          if not memory:
              raise SystemExit("No HEX memory data")

          min_addr = min(memory)
          max_addr = max(memory)
          image = bytearray([0xFF] * (max_addr - min_addr + 1))

          for addr, b in memory.items():
              image[addr - min_addr] = b

          positions = []
          start = 0

          while True:
              pos = image.find(old, start)
              if pos < 0:
                  break
              positions.append(pos)
              start = pos + 1

          if not positions:
              print("WARNING: target name not found in HEX")
          else:
              for pos in positions:
                  abs_pos = min_addr + pos
                  print("Patching HEX at", hex(abs_pos))
                  for i, b in enumerate(new):
                      memory[abs_pos + i] = b

          def checksum(record_bytes):
              return ((~sum(record_bytes) + 1) & 0xFF)

          patched_lines = []

          for line, info in records:
              if info is None:
                  patched_lines.append(line)
                  continue

              count, addr, rectype, data, rec_base = info

              if rectype == 0:
                  absolute = rec_base + addr
                  new_data = bytes(memory[absolute + i] for i in range(count))

                  rec = bytearray()
                  rec.append(count)
                  rec.append((addr >> 8) & 0xFF)
                  rec.append(addr & 0xFF)
                  rec.append(rectype)
                  rec.extend(new_data)
                  chk = checksum(rec)

                  patched_lines.append(":" + rec.hex().upper() + f"{chk:02X}")
              else:
                  patched_lines.append(line)

          dst_hex = out / "RUNA_FC51_ICM40609_DRIVER_TEST.hex"
          dst_hex.write_text("\n".join(patched_lines) + "\n")
          print("Written:", dst_hex)

          bin_files = list(Path("inav/build").rglob(f"*{target}*.bin"))
          if not bin_files:
              bin_files = list(Path("inav/build").rglob("*.bin"))

          for src_bin in bin_files:
              data = src_bin.read_bytes()
              count = data.count(old)
              if count:
                  patched = data.replace(old, new)
                  dst_bin = out / "RUNA_FC51_ICM40609_DRIVER_TEST.bin"
                  dst_bin.write_bytes(patched)
                  print("Written:", dst_bin, "replacements:", count)
                  break

          elf_files = list(Path("inav/build").rglob(f"*{target}*.elf"))
          if elf_files:
              dst_elf = out / "RUNA_FC51_ICM40609_DRIVER_TEST.elf"
              dst_elf.write_bytes(elf_files[0].read_bytes())
              print("ELF copied:", dst_elf)
          PY

      - name: Create CLI files
        run: |
          mkdir -p out

          cat > out/RUNA_FC51_DRIVER_TEST_BASE.cli <<'EOF'
          batch start

          # RUNA FC51 ICM40609 DRIVER TEST
          # ВАЖНО:
          # acc_hardware ставим ICM42605,
          # потому что драйвер ICM42605 пропатчен принимать ICM40609 WHO_AM_I=0x3B.

          set acc_hardware = ICM42605
          set baro_hardware = SPL06
          set mag_hardware = HMC5883
          set align_mag = CW0FLIP

          set align_board_roll = 0
          set align_board_pitch = 0
          set align_board_yaw = 1800

          set gyro_zero_x = 0
          set gyro_zero_y = 0
          set gyro_zero_z = 0

          set acczero_x = 0
          set acczero_y = 0
          set acczero_z = 0

          set accgain_x = 4096
          set accgain_y = 4096
          set accgain_z = 4096

          set vbat_adc_channel = 1
          set rssi_adc_channel = 4
          set current_adc_channel = 2
          set airspeed_adc_channel = 3

          save
          EOF

          cat > out/RUNA_FC51_VTX_5G8_5820_5695_5733.cli <<'EOF'
          batch start

          feature VTX

          # UART5 / TX5 -> IRC Tramp
          serial 4 4096 115200 115200 0 115200

          set vtx_frequency_group = FREQUENCYGROUP_5G8

          # Start channel: FATSHARK F5 / 5820 MHz
          set vtx_band = 4
          set vtx_channel = 5
          set vtx_power = 5
          set vtx_low_power_disarm = OFF
          set vtx_pit_mode_chan = 1
          set vtx_max_power_override = 0

          # Clear old VTX logic 0-8
          logic 0 0 -1 0 0 0 0 0 0
          logic 1 0 -1 0 0 0 0 0 0
          logic 2 0 -1 0 0 0 0 0 0
          logic 3 0 -1 0 0 0 0 0 0
          logic 4 0 -1 0 0 0 0 0 0
          logic 5 0 -1 0 0 0 0 0 0
          logic 6 0 -1 0 0 0 0 0 0
          logic 7 0 -1 0 0 0 0 0 0
          logic 8 0 -1 0 0 0 0 0 0

          # CH6 LOW / MID / HIGH detectors
          logic 0 1 -1 4 1 6 0 0 0
          logic 1 1 -1 5 1 6 0 0 0
          logic 2 1 -1 6 1 6 0 0 0

          # LOW -> FATSHARK F5 / 5820 MHz
          logic 3 1 0 30 0 4 0 0 0
          logic 4 1 0 31 0 5 0 0 0

          # MID -> RACEBAND R2 / 5695 MHz
          logic 5 1 1 30 0 5 0 0 0
          logic 6 1 1 31 0 2 0 0 0

          # HIGH -> BAND B B1 / 5733 MHz
          logic 7 1 2 30 0 2 0 0 0
          logic 8 1 2 31 0 1 0 0 0

          save
          EOF

          cat > out/README_RUNA_FC51_DRIVER_TEST.txt <<'EOF'
          RUNA FC51 ICM40609 DRIVER TEST

          This is experimental.

          Real chip from working FC5.1 diff:
          - ICM40609
          - SPL06
          - HMC5883
          - align_board_yaw = 1800

          What this build does:
          - Builds SPEEDYBEEF405WING
          - Patches ICM42605 driver to accept ICM40609 WHO_AM_I = 0x3B
          - Patches display name:
            SPEEDYBEEF405WING -> SPEEDYBEE51+RUNA!
          - Adds startup OSD text RUNAv.51

          Important:
          In CLI use:
            set acc_hardware = ICM42605

          Because ICM40609 is running through patched ICM42605 driver.

          Flash:
          1. INAV Configurator 7.x
          2. Full Chip Erase
          3. Flash RUNA_FC51_ICM40609_DRIVER_TEST.hex
          4. CLI:
             defaults
             save
          5. Wait 15 seconds without touching board
          6. Apply RUNA_FC51_DRIVER_TEST_BASE.cli
          7. Calibrate accelerometer
          8. Check:
             status
             get align_board

          Required:
          - GYRO=OK
          - ACC=OK
          - BARO=OK
          - MAG=OK
          - HWFAIL absent

          If GYRO/ACC are OK:
          then we will make the full version with OSD shutter and VTX 3.3.

          If GYRO/ACC are UNAVAILABLE:
          the ICM40609 needs a deeper dedicated driver, not only an ICM42605 alias.

          Test without propeller.
          EOF

          ls -lah out

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: RUNA-FC51-ICM40609-DRIVER-TEST
          path: out/*
