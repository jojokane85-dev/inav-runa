name: RUNA v40 LITE FIX4 INAV 8.0.1 SPEEDYBEE BASE

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout INAV 8.0.1
        run: |
          git clone --recursive --branch 8.0.1 https://github.com/iNavFlight/inav.git inav

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi

          which arm-none-eabi-objcopy || true

      - name: Find SpeedyBee target
        run: |
          cd inav

          echo "===== SPEEDYBEE TARGET FOLDERS ====="
          find src/main/target -maxdepth 1 -type d | grep -i speedy || true

          echo "===== CONFIGURE FOR MAKE HELP ====="
          mkdir -p build
          cd build
          cmake ..

          echo "===== MAKE HELP SPEEDY ====="
          make help | grep -i speedy || true

      - name: Create RUNA_F405_WING LITE FIX4 from SpeedyBee target
        run: |
          cd inav

          BASE_TARGET=""

          if [ -d "src/main/target/SPEEDYBEEF405WING" ]; then
            BASE_TARGET="SPEEDYBEEF405WING"
          elif [ -d "src/main/target/SPEEDYBEEF405WING_V2" ]; then
            BASE_TARGET="SPEEDYBEEF405WING_V2"
          elif [ -d "src/main/target/SPEEDYBEEF405WINGAPP" ]; then
            BASE_TARGET="SPEEDYBEEF405WINGAPP"
          elif [ -d "src/main/target/SPEEDYBEEF405WINGMINI" ]; then
            BASE_TARGET="SPEEDYBEEF405WINGMINI"
          fi

          if [ -z "$BASE_TARGET" ]; then
            echo "ERROR: SpeedyBee F405 Wing target not found"
            find src/main/target -maxdepth 1 -type d | grep -i speedy || true
            exit 1
          fi

          echo "===== USING BASE TARGET: $BASE_TARGET ====="

          rm -rf src/main/target/RUNA_F405_WING
          mkdir -p src/main/target/RUNA_F405_WING
          cp -r "src/main/target/$BASE_TARGET/"* src/main/target/RUNA_F405_WING/

          cat > src/main/target/RUNA_F405_WING/CMakeLists.txt <<'EOF'
          target_stm32f405xg(RUNA_F405_WING)
          EOF

          echo "===== Patch target name and disable heavy features ====="

          sed -i '/TARGET_BOARD_IDENTIFIER/d' src/main/target/RUNA_F405_WING/target.h || true
          sed -i '/USBD_PRODUCT_STRING/d' src/main/target/RUNA_F405_WING/target.h || true

          cat >> src/main/target/RUNA_F405_WING/target.h <<'EOF'

          /*
           * RUNA_F405_WING v40 LITE FIX4
           * Base: SpeedyBee F405 Wing
           * INAV 8.0.1
           *
           * ВАЖНО:
           * USE_GPS НЕ отключаем.
           * fc_msp.c требует GPS-структуры даже если GPS физически не нужен.
           *
           * Отключено для уменьшения размера:
           * - OSD / MAX7456 / AT7456
           * - SDCARD / BLACKBOX
           * - BARO
           * - MAG
           * - GEOZONE
           * - WIND ESTIMATOR
           * - VTX
           * - LED STRIP
           * - PINIO
           * - SOFTSERIAL
           * - PITOT / AIRSPEED
           */

          #undef TARGET_BOARD_IDENTIFIER
          #define TARGET_BOARD_IDENTIFIER "RUNA"

          #undef USBD_PRODUCT_STRING
          #define USBD_PRODUCT_STRING "RUNA_F405_WING"

          /* ---------- OSD / VIDEO CHIP ---------- */

          #undef USE_OSD
          #undef USE_OSD_SD
          #undef USE_OSD_HD
          #undef USE_OSD_QUICK_MENU

          #undef USE_MAX7456
          #undef USE_AT7456E
          #undef MAX7456_SPI_BUS
          #undef MAX7456_CS_PIN

          /* ---------- SDCARD / BLACKBOX / FLASH ---------- */

          #undef USE_SDCARD
          #undef USE_SDCARD_SPI
          #undef SDCARD_SPI_BUS
          #undef SDCARD_CS_PIN

          #undef USE_BLACKBOX
          #undef USE_FLASHFS
          #undef USE_FLASH_M25P16

          /* ---------- BARO ---------- */

          #undef USE_BARO
          #undef USE_BARO_BMP085
          #undef USE_BARO_BMP280
          #undef USE_BARO_BMP388
          #undef USE_BARO_MS5611
          #undef USE_BARO_SPL06
          #undef BARO_I2C_BUS
          #undef BARO_SPI_BUS
          #undef BARO_CS_PIN

          /* ---------- MAG ---------- */

          #undef USE_MAG
          #undef USE_MAG_HMC5883
          #undef USE_MAG_QMC5883
          #undef USE_MAG_LIS3MDL
          #undef USE_MAG_MPU9250
          #undef USE_MAG_IST8310
          #undef USE_MAG_IST8308
          #undef MAG_I2C_BUS
          #undef MAG_SPI_BUS
          #undef MAG_CS_PIN

          /* ---------- GPS / GEOZONE / WIND / NAV EXTRAS ---------- */

          /*
           * НЕ ДЕЛАТЬ:
           * #undef USE_GPS
           *
           * Иначе падает fc_msp.c:
           * gpsSol / gpsProcessNewDriverData / gpsProcessNewSolutionData
           */

          #undef USE_GPS_PROTO_MTK
          #undef USE_GPS_PROTO_I2C_NAV

          #undef USE_GEOZONE
          #undef USE_SAFE_HOME
          #undef USE_FW_AUTOLAND
          #undef USE_NAV_FW_LAUNCH
          #undef USE_NAV_FW_AUTOLAND
          #undef USE_WIND_ESTIMATOR

          /* ---------- VTX ---------- */

          #undef USE_VTX_COMMON
          #undef USE_VTX_SMARTAUDIO
          #undef USE_VTX_TRAMP
          #undef USE_VTX_MSP
          #undef USE_VTX_TABLE

          /* ---------- LED ---------- */

          #undef USE_LED_STRIP
          #undef USE_LED_STRIP_STATUS_MODE
          #undef USE_LED_STRIP_RGB
          #undef USE_LED_STRIP_GRB
          #undef LED_STRIP_PIN

          /* ---------- PINIO ---------- */

          #undef USE_PINIO
          #undef USE_PINIOBOX
          #undef PINIO1_PIN
          #undef PINIO2_PIN
          #undef PINIO3_PIN
          #undef PINIO4_PIN

          /* ---------- SOFTSERIAL ---------- */

          #undef USE_SOFTSERIAL1
          #undef USE_SOFTSERIAL2
          #undef SOFTSERIAL_1_TX_PIN
          #undef SOFTSERIAL_1_RX_PIN
          #undef SOFTSERIAL_2_TX_PIN
          #undef SOFTSERIAL_2_RX_PIN

          /* ---------- RANGEFINDER / OPFLOW ---------- */

          #undef USE_RANGEFINDER
          #undef USE_RANGEFINDER_HCSR04
          #undef USE_RANGEFINDER_SRF10
          #undef USE_RANGEFINDER_VL53L0X
          #undef USE_RANGEFINDER_VL53L1X
          #undef RANGEFINDER_I2C_BUS

          #undef USE_OPFLOW
          #undef USE_OPFLOW_CXOF
          #undef USE_OPFLOW_MSP
          #undef USE_OPFLOW_FAKE

          /* ---------- PITOT / AIRSPEED ---------- */

          #undef USE_PITOT
          #undef USE_PITOT_VIRTUAL
          #undef USE_PITOT_MS4525
          #undef USE_PITOT_DLVR
          #undef USE_PITOT_ADC
          #undef PITOT_I2C_BUS
          #undef PITOT_ADC_CHANNEL

          EOF

          echo "===== RUNA LITE FIX4 target created from $BASE_TARGET ====="
          echo "===== important target.h lines ====="
          grep -nE "TARGET_BOARD_IDENTIFIER|USBD_PRODUCT_STRING|ICM|42688|42605|GYRO|ACC|IMU|BARO|MAG|MAX7456|AT7456|SDCARD|BLACKBOX|VTX|GPS|GEOZONE|WIND|PITOT|LED|PINIO|SOFTSERIAL|UART|SPI|I2C" src/main/target/RUNA_F405_WING/target.h || true

          echo "===== target folder ====="
          ls -la src/main/target/RUNA_F405_WING

      - name: Configure
        run: |
          cd inav
          rm -rf build
          mkdir -p build
          cd build
          cmake ..

      - name: Build RUNA_F405_WING LITE FIX4
        run: |
          cd inav/build
          make RUNA_F405_WING -j$(nproc)

      - name: Collect firmware HEX BIN ELF
        run: |
          mkdir -p out

          echo "===== Find built firmware ====="
          find inav/build -type f \( -name "*.hex" -o -name "*.bin" -o -name "*.elf" \) -print

          ELF=$(find inav/build -type f -name "RUNA_F405_WING.elf" | head -n 1)

          if [ -z "$ELF" ]; then
            ELF=$(find inav/build -type f -name "*RUNA_F405_WING*.elf" | head -n 1)
          fi

          if [ -z "$ELF" ]; then
            echo "ERROR: ELF not found"
            find inav/build -type f -name "*.elf" -print
            exit 1
          fi

          echo "Found ELF: $ELF"

          cp "$ELF" out/RUNA_F405_WING_v40_LITE_FIX4_SPEEDYBEE_BASE.elf

          arm-none-eabi-objcopy -O ihex "$ELF" out/RUNA_F405_WING_v40_LITE_FIX4_SPEEDYBEE_BASE.hex
          arm-none-eabi-objcopy -O binary "$ELF" out/RUNA_F405_WING_v40_LITE_FIX4_SPEEDYBEE_BASE.bin

          echo "===== SIZE ====="
          ls -lh out

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: RUNA_F405_WING_v40_LITE_FIX4_SPEEDYBEE_BASE
          path: out/*
