name: Build RUNA FC 4.1 INAV 8.0.1 LSM6DXX

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      TARGET: SPEEDYBEEF405WING

    steps:
      - name: Install deps
        run: |
          sudo apt-get update -y -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            git \
            build-essential \
            g++ \
            ruby \
            cmake \
            make \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-dev \
            ninja-build \
            python3 \
            python3-pip

      - name: Clone INAV 8.0.1
        run: |
          git clone --branch 8.0.1 --depth 1 https://github.com/iNavFlight/inav.git
          cd inav
          echo "Current INAV commit:"
          git rev-parse HEAD

      - name: Patch FC 4.1 IMU to LSM6DXX on INAV 8.0.1
        run: |
          cd inav
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/target/SPEEDYBEEF405WING/target.h")
          text = path.read_text(encoding="utf-8")

          remove_patterns = [
              r'//\s*ICM42605/ICM42688P\s*',
              r'#define\s+USE_IMU_ICM42605\s*',
              r'#define\s+IMU_ICM42605_ALIGN\s+\S+\s*',
              r'#define\s+ICM42605_CS_PIN\s+\S+\s*',
              r'#define\s+ICM42605_SPI_BUS\s+\S+\s*',

              r'#define\s+USE_IMU_ICM42688P\s*',
              r'#define\s+IMU_ICM42688P_ALIGN\s+\S+\s*',
              r'#define\s+ICM42688P_CS_PIN\s+\S+\s*',
              r'#define\s+ICM42688P_SPI_BUS\s+\S+\s*',

              r'#define\s+USE_IMU_LSM6DXX\s*',
              r'#define\s+LSM6DXX_SPI_BUS\s+\S+\s*',
              r'#define\s+LSM6DXX_CS_PIN\s+\S+\s*',
              r'#define\s+IMU_LSM6DXX_ALIGN\s+\S+\s*',
          ]

          for pattern in remove_patterns:
              text = re.sub(pattern, "", text, flags=re.M)

          lsm_block = """

          /*
           * RUNA FC 4.1 IMU PATCH FOR INAV 8.0.1
           *
           * Working FC 4.1 resource/status:
           * PA4 = MPU CS
           * PA5 = SPI1 SCK
           * PA6 = SPI1 MISO
           * PA7 = SPI1 MOSI
           *
           * Working firmware status:
           * GYRO=LSM6DXX, ACC=LSM6DXX
           */
          #define USE_IMU_LSM6DXX
          #define LSM6DXX_SPI_BUS BUS_SPI1
          #define LSM6DXX_CS_PIN PA4
          #define IMU_LSM6DXX_ALIGN CW0_DEG
          """

          text += lsm_block
          path.write_text(text, encoding="utf-8")

          check = path.read_text(encoding="utf-8")

          forbidden = [
              "USE_IMU_ICM42605",
              "ICM42605_CS_PIN",
              "ICM42605_SPI_BUS",
              "USE_IMU_ICM42688P",
              "ICM42688P_CS_PIN",
              "ICM42688P_SPI_BUS",
          ]

          for item in forbidden:
              if item in check:
                  print(f"ERROR: forbidden IMU line still exists: {item}")
                  raise SystemExit(1)

          required = [
              "USE_IMU_LSM6DXX",
              "LSM6DXX_SPI_BUS BUS_SPI1",
              "LSM6DXX_CS_PIN PA4",
          ]

          for item in required:
              if item not in check:
                  print(f"ERROR: required LSM6DXX line missing: {item}")
                  raise SystemExit(1)

          print("==== RUNA FC 4.1 INAV 8.0.1 IMU PATCH OK ====")
          print("ICM42605 removed")
          print("ICM42688P removed")
          print("LSM6DXX added")
          print("SPI BUS: BUS_SPI1")
          print("CS PIN : PA4")
          PY

          echo "==== CHECK target.h IMU lines ===="
          grep -n -E "IMU|LSM6|ICM426|MPU|SPI1|PA4" src/main/target/SPEEDYBEEF405WING/target.h || true

      - name: Patch default acc hardware to LSM6DXX
        run: |
          cd inav
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/fc/settings.yaml")
          text = path.read_text(encoding="utf-8")

          pattern = r"(-\s+name:\s*acc_hardware\b(?:(?!\n\s*-\s+name:).)*?default_value:\s*)([^\n\r]+)"

          def repl(m):
              old = m.group(2).strip()
              print(f"acc_hardware default old: {old}")
              return m.group(1) + "LSM6DXX"

          text, count = re.subn(pattern, repl, text, count=1, flags=re.S)

          if count != 1:
              print("WARNING: acc_hardware default not patched in settings.yaml")
          else:
              print("acc_hardware default patched to LSM6DXX")
              path.write_text(text, encoding="utf-8")
          PY

      - name: Patch RUNA name in Configurator
        run: |
          cd inav
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/fc/fc_msp.c")
          text = path.read_text(encoding="utf-8")

          pattern = r'sbufWriteU8\(dst,\s*strlen\(targetName\)\);\s*sbufWriteData\(dst,\s*targetName,\s*strlen\(targetName\)\);'

          replacement = '''sbufWriteU8(dst, strlen(targetName) + 5);
                  sbufWriteData(dst, targetName, strlen(targetName));
                  sbufWriteData(dst, "+RUNA", 5);'''

          new_text, count = re.subn(pattern, replacement, text, count=1)

          if count != 1:
              print("WARNING: Could not patch MSP_BOARD_INFO targetName block")
              print("Build will continue without +RUNA in MSP targetName")
          else:
              path.write_text(new_text, encoding="utf-8")
              print("Patched targetName -> targetName+RUNA")
          PY

      - name: Patch RUNA startup screen text
        run: |
          cd inav
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/main/io/osd.c")
          text = path.read_text(encoding="utf-8")

          old_line = 'tfp_sprintf(string_buffer, "INAV VERSION: %s", FC_VERSION_STRING);'
          new_line = 'tfp_sprintf(string_buffer, "version RUNA 1.0");'

          if old_line not in text:
              print("WARNING: startup version sprintf line not found")
              print("Build will continue without startup text patch")
          else:
              text = text.replace(old_line, new_line, 1)

              text = text.replace(
                  'uint8_t xPos = (osdDisplayPort->cols - 19) / 2;',
                  'uint8_t xPos = OSD_CENTER_S(string_buffer);',
                  1
              )

              path.write_text(text, encoding="utf-8")
              print("Patched startup screen: version RUNA 1.0")
          PY

      - name: Patch RUNA 3.3GHz VTX table optional
        run: |
          cd inav
          python3 <<'PY'
          from pathlib import Path
          import re

          def sub_optional(text, pattern, replacement, name, flags=0):
              new_text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  print(f"WARNING: could not replace: {name}")
                  return text, False
              print(f"Patched: {name}")
              return new_text, True

          path = Path("src/main/io/vtx_string.c")

          if not path.exists():
              print("WARNING: vtx_string.c not found, skipping 3.3GHz VTX patch")
              raise SystemExit(0)

          text = path.read_text(encoding="utf-8")

          text, _ = sub_optional(
              text,
              r"#define\s+VTX_STRING_1G3_BAND_COUNT\s+\d+",
              "#define VTX_STRING_1G3_BAND_COUNT 6",
              "VTX_STRING_1G3_BAND_COUNT"
          )

          text, _ = sub_optional(
              text,
              r"#define\s+VTX_STRING_1G3_POWER_COUNT\s+\d+",
              "#define VTX_STRING_1G3_POWER_COUNT 5",
              "VTX_STRING_1G3_POWER_COUNT"
          )

          text, _ = sub_optional(
              text,
              r"const\s+uint16_t\s+vtx1G3frequencyTable\s*\[\s*VTX_STRING_1G3_BAND_COUNT\s*\]\s*\[\s*VTX_STRING_1G3_CHAN_COUNT\s*\]\s*=\s*\{.*?\};",
              """const uint16_t vtx1G3frequencyTable[VTX_STRING_1G3_BAND_COUNT][VTX_STRING_1G3_CHAN_COUNT] = {
              { 3083, 3114, 3145, 3176, 3207, 3238, 3269, 3300 },
              { 3215, 3235, 3255, 3275, 3295, 3315, 3335, 3355 },
              { 3170, 3190, 3210, 3230, 3250, 3270, 3290, 3310 },
              { 3320, 3345, 3370, 3395, 3420, 3445, 3470, 3495 },
              { 3310, 3330, 3355, 3380, 3405, 3430, 3455, 3480 },
              { 3330, 3350, 3370, 3390, 3410, 3430, 3450, 3470 },
          };""",
              "vtx1G3frequencyTable",
              flags=re.S
          )

          text, _ = sub_optional(
              text,
              r"const\s+char\s*\*\s+const\s+vtx1G3BandNames\s*\[\s*VTX_STRING_1G3_BAND_COUNT\s*\+\s*1\s*\]\s*=\s*\{.*?\};",
              """const char * const vtx1G3BandNames[VTX_STRING_1G3_BAND_COUNT + 1] = {
              "-", "A", "B", "C", "D", "E", "F",
          };""",
              "vtx1G3BandNames",
              flags=re.S
          )

          text, _ = sub_optional(
              text,
              r'const\s+char\s+vtx1G3BandLetter\s*\[\s*VTX_STRING_1G3_BAND_COUNT\s*\+\s*1\s*\]\s*=\s*".*?";',
              'const char vtx1G3BandLetter[VTX_STRING_1G3_BAND_COUNT + 1] = "-ABCDEF";',
              "vtx1G3BandLetter",
              flags=re.S
          )

          text, _ = sub_optional(
              text,
              r"const\s+char\s*\*\s+const\s+vtx1G3DefaultPowerNames\s*\[\s*VTX_STRING_1G3_POWER_COUNT\s*\+\s*1\s*\]\s*=\s*\{.*?\};",
              """const char * const vtx1G3DefaultPowerNames[VTX_STRING_1G3_POWER_COUNT + 1] = {
              "---", "25", "200", "400", "800", "MAX"
          };""",
              "vtx1G3DefaultPowerNames",
              flags=re.S
          )

          path.write_text(text, encoding="utf-8")
          print("Optional 3.3GHz VTX patch completed")
          PY

      - name: Patch RUNA OSD shutter optional
        run: |
          cd inav
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/io/osd.c")
          text = path.read_text(encoding="utf-8")

          pattern = r'osdDrawNextElement\(\);\s*displayHeartbeat\(osdDisplayPort\);\s*displayCommitTransaction\(osdDisplayPort\);'

          replacement = r'''
                  static bool runaShutterWasActive = false;
                  static uint8_t runaShutterNextRow = 0;

                  if (currentLayout == 2) {
                      textAttributes_t runaAttr = TEXT_ATTRIBUTES_NONE;
                      TEXT_ATTRIBUTES_ADD_SOLID_BG(runaAttr);

                      char runaMask[64];

                      uint8_t cols = osdDisplayPort->cols;
                      uint8_t rows = osdDisplayPort->rows;

                      if (cols > 63) {
                          cols = 63;
                      }

                      const uint8_t windowWidth = cols >= 30 ? 10 : cols / 3;
                      const uint8_t windowHeight = rows >= 16 ? 4 : rows / 3;

                      const uint8_t windowX = (cols - windowWidth) / 2;
                      const uint8_t windowY = (rows - windowHeight) / 2;

                      if (!runaShutterWasActive) {
                          displayClearScreen(osdDisplayPort);
                          runaShutterWasActive = true;
                          runaShutterNextRow = 0;
                      }

                      for (uint8_t pass = 0; pass < 2; pass++) {
                          uint8_t y = runaShutterNextRow;

                          const bool inWindowY = (y >= windowY) && (y < windowY + windowHeight);

                          if (!inWindowY) {
                              memset(runaMask, ' ', cols);
                              runaMask[cols] = '\0';
                              displayWriteWithAttr(osdDisplayPort, 0, y, runaMask, runaAttr);
                          } else {
                              if (windowX > 0) {
                                  memset(runaMask, ' ', windowX);
                                  runaMask[windowX] = '\0';
                                  displayWriteWithAttr(osdDisplayPort, 0, y, runaMask, runaAttr);
                              }

                              const uint8_t rightX = windowX + windowWidth;
                              if (rightX < cols) {
                                  const uint8_t rightWidth = cols - rightX;
                                  memset(runaMask, ' ', rightWidth);
                                  runaMask[rightWidth] = '\0';
                                  displayWriteWithAttr(osdDisplayPort, rightX, y, runaMask, runaAttr);
                              }
                          }

                          runaShutterNextRow++;

                          if (runaShutterNextRow >= rows) {
                              runaShutterNextRow = 0;
                          }
                      }
                  } else {
                      if (runaShutterWasActive) {
                          displayClearScreen(osdDisplayPort);
                          runaShutterWasActive = false;
                          runaShutterNextRow = 0;
                      }

                      osdDrawNextElement();
                  }

                  displayHeartbeat(osdDisplayPort);
                  displayCommitTransaction(osdDisplayPort);'''

          new_text, count = re.subn(pattern, replacement, text, count=1)

          if count != 1:
              print("WARNING: OSD draw block not found")
              print("Build will continue without RUNA shutter patch")
          else:
              path.write_text(new_text, encoding="utf-8")
              print("Patched RUNA OSD shutter")
          PY

      - name: Configure CMake
        run: |
          cd inav
          mkdir -p build
          cd build
          cmake ..

      - name: Build SPEEDYBEEF405WING
        run: |
          cd inav/build
          make clean_${TARGET} || true
          make ${TARGET} -j2 VERBOSE=1

      - name: Find firmware
        if: always()
        run: |
          echo "===== BUILT FILES ====="
          find inav/build -type f \( -name "*.hex" -o -name "*.bin" -o -name "*.elf" \) -print || true

      - name: Collect and rename firmware
        if: success()
        run: |
          mkdir -p out/${TARGET}

          python3 <<'PY'
          from pathlib import Path
          import shutil
          import os

          target = os.environ["TARGET"]
          build_dir = Path("inav/build")
          out_dir = Path("out") / target
          out_dir.mkdir(parents=True, exist_ok=True)

          copied = 0

          for file in build_dir.rglob("*"):
              if not file.is_file():
                  continue
              if file.suffix.lower() not in {".hex", ".bin", ".elf"}:
                  continue
              if target not in file.name:
                  continue

              new_name = f"RUNA_FC41_INAV801_LSM6DXX_{file.name}"
              dst = out_dir / new_name
              shutil.copy2(file, dst)
              print(f"Copied: {file} -> {dst}")
              copied += 1

          if copied == 0:
              print("ERROR: no firmware files found")
              raise SystemExit(1)

          print(f"Total copied: {copied}")
          PY

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RUNA-FC41-INAV801-LSM6DXX
          path: out/${{ env.TARGET }}/*
