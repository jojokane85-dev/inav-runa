name: RUNA v41 LITE FIX3 LSM6DXX AXIS MAP PACK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout INAV 8.0.1
        run: |
          git clone --recursive --branch 8.0.1 https://github.com/iNavFlight/inav.git inav

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git gcc-arm-none-eabi binutils-arm-none-eabi
          which arm-none-eabi-objcopy || true

      - name: Patch LSM6DXX driver for RUNA v41 LITE FIX3 axis maps
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path

          p = Path("src/main/drivers/accgyro/accgyro_lsm6dxx.c")
          s = p.read_text()

          if "RUNA_LSM6DSV16X_CHIP_ID" not in s:
              s = s.replace(
                  "#define LSM6DS3_CHIP_ID 0x69",
                  "#define LSM6DS3_CHIP_ID 0x69\n"
                  "\n"
                  "/* RUNA v41 LITE FIX3: allow LSM6DSV16X / 0x70 as LSM6DXX */\n"
                  "#define RUNA_LSM6DSV16X_CHIP_ID 0x70\n"
              )

          if "case RUNA_LSM6DSV16X_CHIP_ID:" not in s:
              if "case LSM6DSL_CHIP_ID:" in s:
                  s = s.replace(
                      "case LSM6DSL_CHIP_ID:",
                      "case LSM6DSL_CHIP_ID:\n            case RUNA_LSM6DSV16X_CHIP_ID:"
                  )
              elif "case LSM6DSO_CHIP_ID:" in s:
                  s = s.replace(
                      "case LSM6DSO_CHIP_ID:",
                      "case LSM6DSO_CHIP_ID:\n            case RUNA_LSM6DSV16X_CHIP_ID:"
                  )

          old_scale_1 = "gyro->scale = 1.0f / 16.4f; // 2000 dps"
          old_scale_2 = "gyro->scale = 1.0f / 16.4f;"

          new_scale = (
              "// RUNA_GYRO_SCALE_V41_LITE_FIX3\n"
              "    if (lsm6dID == RUNA_LSM6DSV16X_CHIP_ID) {\n"
              "        gyro->scale = 1.0f / (16.4f * 4.0f); // RUNA v41 LITE FIX3 scale /4\n"
              "    } else {\n"
              "        gyro->scale = 1.0f / 16.4f; // 2000 dps\n"
              "    }"
          )

          if "RUNA_GYRO_SCALE_V41_LITE_FIX3" not in s:
              if old_scale_1 in s:
                  s = s.replace(old_scale_1, new_scale, 1)
              elif old_scale_2 in s:
                  s = s.replace(old_scale_2, new_scale, 1)
              else:
                  print("WARNING: gyro scale line not found")

          if "RUNA_ACC_AXIS_MAP_V41_LITE_FIX3" not in s:
              acc_old = (
                  "    acc->ADCRaw[X] = (float) int16_val_little_endian(data, 0);\n"
                  "    acc->ADCRaw[Y] = (float) int16_val_little_endian(data, 1);\n"
                  "    acc->ADCRaw[Z] = (float) int16_val_little_endian(data, 2);"
              )

              acc_new = (
                  "    // RUNA_ACC_AXIS_MAP_V41_LITE_FIX3\n"
                  "    const float runaAccOldX = (float) int16_val_little_endian(data, 0);\n"
                  "    const float runaAccOldY = (float) int16_val_little_endian(data, 1);\n"
                  "    const float runaAccOldZ = (float) int16_val_little_endian(data, 2);\n"
                  "\n"
                  "#if defined(RUNA_AXIS_MAP_A)\n"
                  "    acc->ADCRaw[X] = -runaAccOldY;\n"
                  "    acc->ADCRaw[Y] =  runaAccOldX;\n"
                  "    acc->ADCRaw[Z] =  runaAccOldZ;\n"
                  "#elif defined(RUNA_AXIS_MAP_B)\n"
                  "    acc->ADCRaw[X] =  runaAccOldY;\n"
                  "    acc->ADCRaw[Y] = -runaAccOldX;\n"
                  "    acc->ADCRaw[Z] =  runaAccOldZ;\n"
                  "#elif defined(RUNA_AXIS_MAP_C)\n"
                  "    acc->ADCRaw[X] =  runaAccOldY;\n"
                  "    acc->ADCRaw[Y] =  runaAccOldX;\n"
                  "    acc->ADCRaw[Z] =  runaAccOldZ;\n"
                  "#elif defined(RUNA_AXIS_MAP_D)\n"
                  "    acc->ADCRaw[X] = -runaAccOldY;\n"
                  "    acc->ADCRaw[Y] = -runaAccOldX;\n"
                  "    acc->ADCRaw[Z] =  runaAccOldZ;\n"
                  "#elif defined(RUNA_AXIS_MAP_E)\n"
                  "    acc->ADCRaw[X] =  runaAccOldX;\n"
                  "    acc->ADCRaw[Y] = -runaAccOldY;\n"
                  "    acc->ADCRaw[Z] =  runaAccOldZ;\n"
                  "#elif defined(RUNA_AXIS_MAP_F)\n"
                  "    acc->ADCRaw[X] = -runaAccOldX;\n"
                  "    acc->ADCRaw[Y] =  runaAccOldY;\n"
                  "    acc->ADCRaw[Z] =  runaAccOldZ;\n"
                  "#else\n"
                  "    acc->ADCRaw[X] = runaAccOldX;\n"
                  "    acc->ADCRaw[Y] = runaAccOldY;\n"
                  "    acc->ADCRaw[Z] = runaAccOldZ;\n"
                  "#endif"
              )

              if acc_old in s:
                  s = s.replace(acc_old, acc_new, 1)
              else:
                  print("WARNING: ACC block not found")

          if "RUNA_GYRO_AXIS_MAP_V41_LITE_FIX3" not in s:
              gyro_old = (
                  "    gyro->gyroADCRaw[X] = (float) int16_val_little_endian(data, 0);\n"
                  "    gyro->gyroADCRaw[Y] = (float) int16_val_little_endian(data, 1);\n"
                  "    gyro->gyroADCRaw[Z] = (float) int16_val_little_endian(data, 2);"
              )

              gyro_new = (
                  "    // RUNA_GYRO_AXIS_MAP_V41_LITE_FIX3\n"
                  "    const float runaGyroOldX = (float) int16_val_little_endian(data, 0);\n"
                  "    const float runaGyroOldY = (float) int16_val_little_endian(data, 1);\n"
                  "    const float runaGyroOldZ = (float) int16_val_little_endian(data, 2);\n"
                  "\n"
                  "#if defined(RUNA_AXIS_MAP_A)\n"
                  "    gyro->gyroADCRaw[X] = -runaGyroOldY;\n"
                  "    gyro->gyroADCRaw[Y] =  runaGyroOldX;\n"
                  "    gyro->gyroADCRaw[Z] =  runaGyroOldZ;\n"
                  "#elif defined(RUNA_AXIS_MAP_B)\n"
                  "    gyro->gyroADCRaw[X] =  runaGyroOldY;\n"
                  "    gyro->gyroADCRaw[Y] = -runaGyroOldX;\n"
                  "    gyro->gyroADCRaw[Z] =  runaGyroOldZ;\n"
                  "#elif defined(RUNA_AXIS_MAP_C)\n"
                  "    gyro->gyroADCRaw[X] =  runaGyroOldY;\n"
                  "    gyro->gyroADCRaw[Y] =  runaGyroOldX;\n"
                  "    gyro->gyroADCRaw[Z] =  runaGyroOldZ;\n"
                  "#elif defined(RUNA_AXIS_MAP_D)\n"
                  "    gyro->gyroADCRaw[X] = -runaGyroOldY;\n"
                  "    gyro->gyroADCRaw[Y] = -runaGyroOldX;\n"
                  "    gyro->gyroADCRaw[Z] =  runaGyroOldZ;\n"
                  "#elif defined(RUNA_AXIS_MAP_E)\n"
                  "    gyro->gyroADCRaw[X] =  runaGyroOldX;\n"
                  "    gyro->gyroADCRaw[Y] = -runaGyroOldY;\n"
                  "    gyro->gyroADCRaw[Z] =  runaGyroOldZ;\n"
                  "#elif defined(RUNA_AXIS_MAP_F)\n"
                  "    gyro->gyroADCRaw[X] = -runaGyroOldX;\n"
                  "    gyro->gyroADCRaw[Y] =  runaGyroOldY;\n"
                  "    gyro->gyroADCRaw[Z] =  runaGyroOldZ;\n"
                  "#else\n"
                  "    gyro->gyroADCRaw[X] = runaGyroOldX;\n"
                  "    gyro->gyroADCRaw[Y] = runaGyroOldY;\n"
                  "    gyro->gyroADCRaw[Z] = runaGyroOldZ;\n"
                  "#endif"
              )

              if gyro_old in s:
                  s = s.replace(gyro_old, gyro_new, 1)
              else:
                  print("WARNING: GYRO block not found")

          p.write_text(s)
          PY

          grep -nE "RUNA_LSM6DSV16X|RUNA_GYRO_SCALE_V41_LITE_FIX3|RUNA_ACC_AXIS_MAP_V41_LITE_FIX3|RUNA_GYRO_AXIS_MAP_V41_LITE_FIX3|RUNA_AXIS_MAP" src/main/drivers/accgyro/accgyro_lsm6dxx.c || true

      - name: Create RUNA v41 LITE FIX3 map targets
        run: |
          cd inav

          create_target () {
            T="$1"
            MAP_DEFINE="$2"

            echo "===== Create $T with $MAP_DEFINE ====="

            rm -rf "src/main/target/$T"
            mkdir -p "src/main/target/$T"
            cp -r src/main/target/MATEKF405SE/* "src/main/target/$T/"

            cat > "src/main/target/$T/CMakeLists.txt" <<EOF
          target_stm32f405xg($T)
          EOF

            sed -i '/TARGET_BOARD_IDENTIFIER/d' "src/main/target/$T/target.h" || true
            sed -i '/USBD_PRODUCT_STRING/d' "src/main/target/$T/target.h" || true

            cat >> "src/main/target/$T/target.h" <<EOF

          /*
           * $T
           * RUNA v41 LITE FIX3 axis map test
           * Base: MATEKF405SE pinout + LSM6DXX 0x70 patch
           * $MAP_DEFINE
           */

          #undef TARGET_BOARD_IDENTIFIER
          #define TARGET_BOARD_IDENTIFIER "RUNA"

          #undef USBD_PRODUCT_STRING
          #define USBD_PRODUCT_STRING "$T"

          #define $MAP_DEFINE

          #undef USE_IMU_MPU6000
          #undef USE_IMU_MPU6500
          #undef USE_IMU_MPU9250
          #undef USE_IMU_ICM20689
          #undef USE_IMU_ICM42605
          #undef USE_IMU_ICM42688
          #undef USE_IMU_ICM42688P
          #undef USE_IMU_BMI160
          #undef USE_IMU_BMI088
          #undef USE_IMU_BMI270

          #undef MPU6000_CS_PIN
          #undef MPU6000_SPI_BUS
          #undef MPU6500_CS_PIN
          #undef MPU6500_SPI_BUS
          #undef ICM42605_CS_PIN
          #undef ICM42605_SPI_BUS
          #undef ICM42688_CS_PIN
          #undef ICM42688_SPI_BUS

          #define USE_IMU_LSM6DXX
          #define IMU_LSM6DXX_ALIGN CW0_DEG
          #define LSM6DXX_CS_PIN PA4
          #define LSM6DXX_SPI_BUS BUS_SPI1

          #define USE_SPI
          #define USE_SPI_DEVICE_1

          #undef SPI1_NSS_PIN
          #define SPI1_NSS_PIN PA4

          #undef SPI1_SCK_PIN
          #define SPI1_SCK_PIN PA5

          #undef SPI1_MISO_PIN
          #define SPI1_MISO_PIN PA6

          #undef SPI1_MOSI_PIN
          #define SPI1_MOSI_PIN PA7

          #undef USE_OSD
          #undef USE_OSD_SD
          #undef USE_OSD_HD
          #undef USE_OSD_QUICK_MENU
          #undef USE_OSD_CUSTOM_ELEMENTS
          #undef USE_OSD_CUSTOM_ELEMENTS_STATS
          #undef USE_OSD_CUSTOM_ELEMENTS_SCRIPT
          #undef USE_OSD_PROFILES
          #undef USE_OSD_SYMBOLS
          #undef USE_CUSTOM_BOX_NAMES

          #undef USE_MAX7456
          #undef USE_AT7456E
          #undef MAX7456_SPI_BUS
          #undef MAX7456_CS_PIN

          #undef USE_SDCARD
          #undef USE_SDCARD_SPI
          #undef SDCARD_SPI_BUS
          #undef SDCARD_CS_PIN

          #undef USE_BLACKBOX
          #undef USE_FLASHFS
          #undef USE_FLASH_M25P16

          #undef USE_BARO
          #undef USE_BARO_BMP085
          #undef USE_BARO_BMP280
          #undef USE_BARO_BMP388
          #undef USE_BARO_MS5611
          #undef USE_BARO_SPL06
          #undef BARO_I2C_BUS
          #undef BARO_SPI_BUS
          #undef BARO_CS_PIN

          #undef USE_MAG
          #undef USE_MAG_HMC5883
          #undef USE_MAG_QMC5883
          #undef USE_MAG_LIS3MDL
          #undef USE_MAG_MPU9250
          #undef USE_MAG_IST8310
          #undef USE_MAG_IST8308
          #undef MAG_I2C_BUS
          #undef MAG_SPI_BUS
          #undef MAG_CS_PIN

          #undef USE_VTX_COMMON
          #undef USE_VTX_SMARTAUDIO
          #undef USE_VTX_TRAMP
          #undef USE_VTX_MSP
          #undef USE_VTX_TABLE

          #undef USE_LED_STRIP
          #undef USE_LED_STRIP_STATUS_MODE
          #undef USE_LED_STRIP_RGB
          #undef USE_LED_STRIP_GRB
          #undef LED_STRIP_PIN

          #undef USE_PINIO
          #undef USE_PINIOBOX
          #undef PINIO1_PIN
          #undef PINIO2_PIN
          #undef PINIO3_PIN
          #undef PINIO4_PIN

          #undef USE_RANGEFINDER
          #undef USE_RANGEFINDER_HCSR04
          #undef USE_RANGEFINDER_SRF10
          #undef USE_RANGEFINDER_VL53L0X
          #undef USE_RANGEFINDER_VL53L1X
          #undef RANGEFINDER_I2C_BUS

          #undef USE_OPFLOW
          #undef USE_OPFLOW_CXOF
          #undef USE_OPFLOW_MSP
          #undef USE_OPFLOW_FAKE

          #undef USE_PITOT
          #undef USE_PITOT_VIRTUAL
          #undef USE_PITOT_MS4525
          #undef USE_PITOT_DLVR
          #undef USE_PITOT_ADC
          #undef PITOT_I2C_BUS
          #undef PITOT_ADC_CHANNEL

          #undef USE_GEOZONE
          #undef USE_SAFE_HOME
          #undef USE_FW_AUTOLAND
          #undef USE_NAV_FW_LAUNCH
          #undef USE_NAV_FW_AUTOLAND
          #undef USE_WIND_ESTIMATOR

          EOF

            echo "===== $T check ====="
            grep -nE "USBD_PRODUCT_STRING|RUNA_AXIS_MAP|LSM6DXX|IMU_LSM6DXX_ALIGN|USE_BARO|USE_MAG|USE_MAX7456|USE_SDCARD|USE_BLACKBOX|USE_VTX" "src/main/target/$T/target.h" || true
          }

          create_target RUNA_V41_LITE_MAP_A RUNA_AXIS_MAP_A
          create_target RUNA_V41_LITE_MAP_B RUNA_AXIS_MAP_B
          create_target RUNA_V41_LITE_MAP_C RUNA_AXIS_MAP_C
          create_target RUNA_V41_LITE_MAP_D RUNA_AXIS_MAP_D
          create_target RUNA_V41_LITE_MAP_E RUNA_AXIS_MAP_E
          create_target RUNA_V41_LITE_MAP_F RUNA_AXIS_MAP_F

      - name: Patch OSD VTX Blackbox stubs for LITE build
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path

          patches = [
              (
                  "src/main/io/osd/custom_elements.c",
                  "RUNA_LITE_SYM_BLANK_FIX",
                  "#ifndef SYM_BLANK\n#define SYM_BLANK 0\n#endif\n"
              ),
              (
                  "src/main/programming/logic_condition.c",
                  "RUNA_LITE_VTX_SETTINGS_FIX",
                  "#ifndef VTX_SETTINGS_MIN_POWER\n#define VTX_SETTINGS_MIN_POWER 0\n#endif\n"
                  "#ifndef VTX_SETTINGS_POWER_COUNT\n#define VTX_SETTINGS_POWER_COUNT 1\n#endif\n"
                  "#ifndef VTX_SETTINGS_BAND_COUNT\n#define VTX_SETTINGS_BAND_COUNT 1\n#endif\n"
                  "#ifndef VTX_SETTINGS_CHANNEL_COUNT\n#define VTX_SETTINGS_CHANNEL_COUNT 1\n#endif\n"
              ),
              (
                  "src/main/cms/cms_menu_blackbox.c",
                  "RUNA_LITE_BLACKBOX_SETTING_FIX",
                  "#ifndef SETTING_BLACKBOX_RATE_DENOM\n#define SETTING_BLACKBOX_RATE_DENOM 0\n#endif\n"
              ),
              (
                  "src/main/cms/cms_menu_vtx.c",
                  "RUNA_LITE_CMS_VTX_FIX",
                  "#ifndef VTX_SETTINGS_MIN_POWER\n#define VTX_SETTINGS_MIN_POWER 0\n#endif\n"
                  "#ifndef VTX_SETTINGS_POWER_COUNT\n#define VTX_SETTINGS_POWER_COUNT 1\n#endif\n"
                  "#ifndef VTX_SETTINGS_BAND_COUNT\n#define VTX_SETTINGS_BAND_COUNT 1\n#endif\n"
                  "#ifndef VTX_SETTINGS_CHANNEL_COUNT\n#define VTX_SETTINGS_CHANNEL_COUNT 1\n#endif\n"
              ),
              (
                  "src/main/io/vtx.c",
                  "RUNA_LITE_IO_VTX_FIX",
                  "#ifndef SETTING_VTX_MAX_POWER_OVERRIDE_DEFAULT\n#define SETTING_VTX_MAX_POWER_OVERRIDE_DEFAULT 0\n#endif\n"
                  "#ifndef SETTING_VTX_FREQUENCY_GROUP_DEFAULT\n#define SETTING_VTX_FREQUENCY_GROUP_DEFAULT 0\n#endif\n"
                  "#ifndef SETTING_VTX_POWER_DEFAULT\n#define SETTING_VTX_POWER_DEFAULT 0\n#endif\n"
                  "#ifndef SETTING_VTX_BAND_DEFAULT\n#define SETTING_VTX_BAND_DEFAULT 0\n#endif\n"
                  "#ifndef SETTING_VTX_CHANNEL_DEFAULT\n#define SETTING_VTX_CHANNEL_DEFAULT 0\n#endif\n"
              ),
          ]

          for file, marker, defs in patches:
              p = Path(file)
              if not p.exists():
                  print("SKIP missing", file)
                  continue

              s = p.read_text()

              if marker not in s:
                  s = s.replace("#include", f"/* {marker} */\n{defs}\n#include", 1)
                  p.write_text(s)

              print("patched", file)
          PY

      - name: Configure
        run: |
          cd inav
          rm -rf build
          mkdir -p build
          cd build
          cmake ..

      - name: Build all RUNA v41 LITE FIX3 maps
        run: |
          cd inav/build

          for T in RUNA_V41_LITE_MAP_A RUNA_V41_LITE_MAP_B RUNA_V41_LITE_MAP_C RUNA_V41_LITE_MAP_D RUNA_V41_LITE_MAP_E RUNA_V41_LITE_MAP_F; do
            echo "===== BUILD $T ====="
            make "$T" -j$(nproc)
          done

      - name: Collect HEX BIN ELF
        run: |
          mkdir -p out

          for T in RUNA_V41_LITE_MAP_A RUNA_V41_LITE_MAP_B RUNA_V41_LITE_MAP_C RUNA_V41_LITE_MAP_D RUNA_V41_LITE_MAP_E RUNA_V41_LITE_MAP_F; do
            echo "===== COLLECT $T ====="

            ELF=$(find inav/build -type f -name "${T}.elf" | head -n 1)

            if [ -z "$ELF" ]; then
              ELF=$(find inav/build -type f -name "*${T}*.elf" | head -n 1)
            fi

            if [ -z "$ELF" ]; then
              echo "ERROR: ELF not found for $T"
              find inav/build -type f -name "*.elf" -print
              exit 1
            fi

            cp "$ELF" "out/${T}.elf"
            arm-none-eabi-objcopy -O ihex "$ELF" "out/${T}.hex"
            arm-none-eabi-objcopy -O binary "$ELF" "out/${T}.bin"
          done

          echo "===== OUT ====="
          ls -lh out

      - name: Upload v41 LITE FIX3 map pack
        uses: actions/upload-artifact@v4
        with:
          name: RUNA_V41_LITE_FIX3_LSM6DXX_AXIS_MAP_PACK
          path: out/*
