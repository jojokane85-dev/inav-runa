name: Build RUNA FC51 ICM40609

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      INAV_VERSION: 7.1.2
      TARGET: SPEEDYBEEF405WING

      # Длина одинаковая:
      # SPEEDYBEEF405WING = 17
      # SPEEDYBEE51+RUNA! = 17
      OLD_TARGET_NAME: SPEEDYBEEF405WING
      NEW_TARGET_NAME: SPEEDYBEE51+RUNA!

    steps:
      - name: Install deps
        run: |
          sudo apt-get update -y -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            git \
            build-essential \
            g++ \
            ruby \
            cmake \
            make \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-dev \
            ninja-build \
            python3 \
            python3-pip

      - name: Clone INAV 7.1.2
        run: |
          set -e
          echo "Cloning INAV ${INAV_VERSION}..."

          for i in 1 2 3 4 5; do
            echo "Clone attempt $i"

            git clone \
              --branch ${INAV_VERSION} \
              --depth 1 \
              --single-branch \
              --config http.version=HTTP/1.1 \
              --config http.postBuffer=524288000 \
              https://github.com/iNavFlight/inav.git && break

            echo "Clone failed, retrying..."
            rm -rf inav
            sleep 10
          done

          test -d inav || exit 1
          cd inav
          echo "Commit:"
          git rev-parse HEAD

      - name: Check ICM40609 source support
        run: |
          cd inav

          echo "Searching ICM40609 support in source..."
          grep -R "ICM40609" -n src/main || {
            echo "ERROR: ICM40609 is not present in this INAV source tree."
            echo "This means official INAV 7.1.2 does not contain the needed custom driver."
            echo "In that case use working fw.bin patch method or find custom source commit 21449e25."
            exit 1
          }

      - name: Patch SPEEDYBEEF405WING target to ICM40609
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path
          import re
          import os

          target = os.environ["TARGET"]
          path = Path(f"src/main/target/{target}/target.h")

          if not path.exists():
              raise SystemExit(f"target.h not found: {path}")

          text = path.read_text(encoding="utf-8")

          def find_define(name, default=None):
              m = re.search(rf'^\s*#define\s+{re.escape(name)}\s+(\S+)', text, flags=re.M)
              return m.group(1) if m else default

          # Берём SPI/CS/ALIGN от штатного IMU SpeedyBee.
          # На FC 5.1 рабочий diff показывает ICM40609, но пины обычно такие же,
          # как у штатного ICM42605/ICM42688 в этом target.
          spi_bus = (
              find_define("ICM42605_SPI_BUS") or
              find_define("ICM42688P_SPI_BUS") or
              find_define("ICM40609_SPI_BUS") or
              "BUS_SPI1"
          )

          cs_pin = (
              find_define("ICM42605_CS_PIN") or
              find_define("ICM42688P_CS_PIN") or
              find_define("ICM40609_CS_PIN") or
              "PA4"
          )

          align = (
              find_define("IMU_ICM42605_ALIGN") or
              find_define("IMU_ICM42688P_ALIGN") or
              find_define("IMU_ICM40609_ALIGN") or
              "CW0_DEG"
          )

          print("Using for ICM40609:")
          print(" SPI =", spi_bus)
          print(" CS  =", cs_pin)
          print(" ALIGN =", align)

          # Убираем другие IMU, чтобы сборка была чисто под ICM40609.
          remove_patterns = [
              r'^\s*#define\s+USE_IMU_ICM42605\s*$',
              r'^\s*#define\s+IMU_ICM42605_ALIGN\s+\S+\s*$',
              r'^\s*#define\s+ICM42605_CS_PIN\s+\S+\s*$',
              r'^\s*#define\s+ICM42605_SPI_BUS\s+\S+\s*$',

              r'^\s*#define\s+USE_IMU_ICM42688P\s*$',
              r'^\s*#define\s+IMU_ICM42688P_ALIGN\s+\S+\s*$',
              r'^\s*#define\s+ICM42688P_CS_PIN\s+\S+\s*$',
              r'^\s*#define\s+ICM42688P_SPI_BUS\s+\S+\s*$',

              r'^\s*#define\s+USE_IMU_ICM40609\s*$',
              r'^\s*#define\s+IMU_ICM40609_ALIGN\s+\S+\s*$',
              r'^\s*#define\s+ICM40609_CS_PIN\s+\S+\s*$',
              r'^\s*#define\s+ICM40609_SPI_BUS\s+\S+\s*$',
          ]

          for pattern in remove_patterns:
              text = re.sub(pattern, "", text, flags=re.M)

          text += f"""

          /*
           * RUNA FC 5.1 custom IMU patch
           * Working FC5.1 diff:
           * acc_hardware = ICM40609
           * baro_hardware = SPL06
           * mag_hardware = HMC5883
           */

          #define USE_IMU_ICM40609
          #define ICM40609_SPI_BUS {spi_bus}
          #define ICM40609_CS_PIN {cs_pin}
          #define IMU_ICM40609_ALIGN {align}

          #define USE_BARO_SPL06
          #define BARO_I2C_BUS BUS_I2C1

          #define USE_MAG_HMC5883
          #define MAG_I2C_BUS BUS_I2C1
          """

          path.write_text(text, encoding="utf-8")
          print("target.h patched for ICM40609")
          PY

          echo "===== Patched target.h important lines ====="
          grep -n -E "ICM40609|ICM42605|ICM42688|SPL06|HMC5883|MAG_I2C|BARO_I2C|SPI_BUS|CS_PIN|ALIGN" src/main/target/${TARGET}/target.h || true

      - name: Patch startup OSD text RUNAv.51
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path

          path = Path("src/main/io/osd.c")

          if not path.exists():
              print("WARNING: osd.c not found")
              raise SystemExit(0)

          text = path.read_text(encoding="utf-8")

          old = 'tfp_sprintf(string_buffer, "INAV VERSION: %s", FC_VERSION_STRING);'
          new = 'tfp_sprintf(string_buffer, "RUNAv.51");'

          if old in text:
              text = text.replace(old, new, 1)
              text = text.replace(
                  'uint8_t xPos = (osdDisplayPort->cols - 19) / 2;',
                  'uint8_t xPos = OSD_CENTER_S(string_buffer);',
                  1
              )
              print("Startup OSD text patched: RUNAv.51")
          else:
              print("WARNING: startup text pattern not found")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Patch RUNA OSD shutter
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/io/osd.c")

          if not path.exists():
              print("WARNING: osd.c not found, skip")
              raise SystemExit(0)

          text = path.read_text(encoding="utf-8")

          pattern = r'osdDrawNextElement\(\);\s*displayHeartbeat\(osdDisplayPort\);\s*displayCommitTransaction\(osdDisplayPort\);'

          replacement = r"""
                  static bool runaShutterWasActive = false;
                  static uint8_t runaShutterNextRow = 0;

                  if (currentLayout == 2) {
                      textAttributes_t runaAttr = TEXT_ATTRIBUTES_NONE;
                      TEXT_ATTRIBUTES_ADD_SOLID_BG(runaAttr);

                      char runaMask[64];

                      uint8_t cols = osdDisplayPort->cols;
                      uint8_t rows = osdDisplayPort->rows;

                      if (cols > 63) {
                          cols = 63;
                      }

                      const uint8_t windowWidth = cols >= 30 ? 10 : cols / 3;
                      const uint8_t windowHeight = rows >= 16 ? 4 : rows / 3;

                      const uint8_t windowX = (cols - windowWidth) / 2;
                      const uint8_t windowY = (rows - windowHeight) / 2;

                      if (!runaShutterWasActive) {
                          displayClearScreen(osdDisplayPort);
                          runaShutterWasActive = true;
                          runaShutterNextRow = 0;
                      }

                      for (uint8_t pass = 0; pass < 2; pass++) {
                          uint8_t y = runaShutterNextRow;

                          const bool inWindowY = (y >= windowY) && (y < windowY + windowHeight);

                          if (!inWindowY) {
                              memset(runaMask, ' ', cols);
                              runaMask[cols] = '\0';
                              displayWriteWithAttr(osdDisplayPort, 0, y, runaMask, runaAttr);
                          } else {
                              if (windowX > 0) {
                                  memset(runaMask, ' ', windowX);
                                  runaMask[windowX] = '\0';
                                  displayWriteWithAttr(osdDisplayPort, 0, y, runaMask, runaAttr);
                              }

                              const uint8_t rightX = windowX + windowWidth;

                              if (rightX < cols) {
                                  const uint8_t rightWidth = cols - rightX;
                                  memset(runaMask, ' ', rightWidth);
                                  runaMask[rightWidth] = '\0';
                                  displayWriteWithAttr(osdDisplayPort, rightX, y, runaMask, runaAttr);
                              }
                          }

                          runaShutterNextRow++;

                          if (runaShutterNextRow >= rows) {
                              runaShutterNextRow = 0;
                          }
                      }
                  } else {
                      if (runaShutterWasActive) {
                          displayClearScreen(osdDisplayPort);
                          runaShutterWasActive = false;
                          runaShutterNextRow = 0;
                      }

                      osdDrawNextElement();
                  }

                  displayHeartbeat(osdDisplayPort);
                  displayCommitTransaction(osdDisplayPort);"""

          new_text, count = re.subn(pattern, replacement, text, count=1)

          if count != 1:
              print("WARNING: OSD draw block not found, shutter skipped")
              raise SystemExit(0)

          path.write_text(new_text, encoding="utf-8")
          print("RUNA OSD shutter patched")
          PY

      - name: Patch VTX 3.3GHz table
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/io/vtx_string.c")

          if not path.exists():
              print("vtx_string.c not found, skip")
              raise SystemExit(0)

          text = path.read_text(encoding="utf-8")

          def sub_once(text, pattern, repl, name, flags=0):
              new_text, count = re.subn(pattern, repl, text, count=1, flags=flags)
              print(f"{name}: patch count = {count}")
              return new_text if count else text

          text = sub_once(
              text,
              r"#define\s+VTX_STRING_1G3_BAND_COUNT\s+\d+",
              "#define VTX_STRING_1G3_BAND_COUNT 6",
              "1G3 band count"
          )

          text = sub_once(
              text,
              r"#define\s+VTX_STRING_1G3_POWER_COUNT\s+\d+",
              "#define VTX_STRING_1G3_POWER_COUNT 5",
              "1G3 power count"
          )

          text = sub_once(
              text,
              r"const\s+uint16_t\s+vtx1G3frequencyTable\s*\[\s*VTX_STRING_1G3_BAND_COUNT\s*\]\s*\[\s*VTX_STRING_1G3_CHAN_COUNT\s*\]\s*=\s*\{.*?\};",
              """const uint16_t vtx1G3frequencyTable[VTX_STRING_1G3_BAND_COUNT][VTX_STRING_1G3_CHAN_COUNT] = {
              { 3083, 3114, 3145, 3176, 3207, 3238, 3269, 3300 },
              { 3215, 3235, 3255, 3275, 3295, 3315, 3335, 3355 },
              { 3170, 3190, 3210, 3230, 3250, 3270, 3290, 3310 },
              { 3320, 3345, 3370, 3395, 3420, 3445, 3470, 3495 },
              { 3310, 3330, 3355, 3380, 3405, 3430, 3455, 3480 },
              { 3330, 3350, 3370, 3390, 3410, 3430, 3450, 3470 },
          };""",
              "3.3GHz frequency table",
              flags=re.S
          )

          text = sub_once(
              text,
              r"const\s+char\s*\*\s+const\s+vtx1G3BandNames\s*\[\s*VTX_STRING_1G3_BAND_COUNT\s*\+\s*1\s*\]\s*=\s*\{.*?\};",
              """const char * const vtx1G3BandNames[VTX_STRING_1G3_BAND_COUNT + 1] = {
              "-", "A", "B", "C", "D", "E", "F",
          };""",
              "3.3GHz band names",
              flags=re.S
          )

          text = sub_once(
              text,
              r'const\s+char\s+vtx1G3BandLetter\s*\[\s*VTX_STRING_1G3_BAND_COUNT\s*\+\s*1\s*\]\s*=\s*".*?";',
              'const char vtx1G3BandLetter[VTX_STRING_1G3_BAND_COUNT + 1] = "-ABCDEF";',
              "3.3GHz band letters"
          )

          text = sub_once(
              text,
              r"const\s+char\s*\*\s+const\s+vtx1G3DefaultPowerNames\s*\[\s*VTX_STRING_1G3_POWER_COUNT\s*\+\s*1\s*\]\s*=\s*\{.*?\};",
              """const char * const vtx1G3DefaultPowerNames[VTX_STRING_1G3_POWER_COUNT + 1] = {
              "---", "25", "200", "400", "800", "MAX"
          };""",
              "3.3GHz power names",
              flags=re.S
          )

          path.write_text(text, encoding="utf-8")
          print("RUNA VTX 3.3 table patch finished")
          PY

      - name: Configure CMake
        run: |
          cd inav
          mkdir -p build
          cd build
          cmake ..

      - name: Check target exists
        run: |
          cd inav/build

          echo "Checking target: ${TARGET}"

          if make help | grep -w "${TARGET}"; then
            echo "Target found: ${TARGET}"
          else
            echo "TARGET NOT FOUND: ${TARGET}"
            make help | grep -i -E "SPEEDYBEE|F405|WING" || true
            exit 1
          fi

      - name: Build SPEEDYBEEF405WING ICM40609 firmware
        run: |
          cd inav/build
          make clean_${TARGET} || true
          make ${TARGET} -j2 VERBOSE=1

      - name: Find built files
        if: always()
        run: |
          echo "Built firmware files:"
          find inav/build -type f \( -name "*.hex" -o -name "*.bin" -o -name "*.elf" \) -print || true

      - name: Patch RUNA name in HEX and BIN
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os

          old = os.environ["OLD_TARGET_NAME"].encode()
          new = os.environ["NEW_TARGET_NAME"].encode()
          target = os.environ["TARGET"]

          print("OLD:", os.environ["OLD_TARGET_NAME"], "length:", len(old))
          print("NEW:", os.environ["NEW_TARGET_NAME"], "length:", len(new))

          if len(old) != len(new):
              raise SystemExit(f"Length mismatch: old={len(old)} new={len(new)}")

          out = Path("out")
          out.mkdir(exist_ok=True)

          hex_files = list(Path("inav/build").rglob(f"*{target}*.hex"))

          if not hex_files:
              hex_files = list(Path("inav/build").rglob("*.hex"))

          if not hex_files:
              raise SystemExit("No HEX files found")

          src_hex = hex_files[0]
          print("Using HEX:", src_hex)

          records = []
          memory = {}
          base = 0

          def parse_record(line):
              count = int(line[1:3], 16)
              addr = int(line[3:7], 16)
              rectype = int(line[7:9], 16)
              data = bytes.fromhex(line[9:9 + count * 2])
              return count, addr, rectype, data

          for line in src_hex.read_text().splitlines():
              if not line.startswith(":"):
                  records.append((line, None))
                  continue

              count, addr, rectype, data = parse_record(line)
              records.append((line, (count, addr, rectype, data, base)))

              if rectype == 0:
                  absolute = base + addr
                  for i, b in enumerate(data):
                      memory[absolute + i] = b
              elif rectype == 4:
                  base = int.from_bytes(data, "big") << 16
              elif rectype == 2:
                  base = int.from_bytes(data, "big") << 4

          if not memory:
              raise SystemExit("No data records found in HEX")

          min_addr = min(memory)
          max_addr = max(memory)
          image = bytearray([0xFF] * (max_addr - min_addr + 1))

          for addr, b in memory.items():
              image[addr - min_addr] = b

          positions = []
          start = 0

          while True:
              pos = image.find(old, start)
              if pos < 0:
                  break
              positions.append(pos)
              start = pos + 1

          if not positions:
              print("WARNING: target string not found in HEX")
          else:
              for pos in positions:
                  abs_pos = min_addr + pos
                  print("Patch HEX target name at:", hex(abs_pos))
                  for i, b in enumerate(new):
                      memory[abs_pos + i] = b

          def checksum(record_bytes):
              return ((~sum(record_bytes) + 1) & 0xFF)

          patched_lines = []

          for line, info in records:
              if info is None:
                  patched_lines.append(line)
                  continue

              count, addr, rectype, data, rec_base = info

              if rectype == 0:
                  absolute = rec_base + addr
                  new_data = bytes(memory[absolute + i] for i in range(count))

                  rec = bytearray()
                  rec.append(count)
                  rec.append((addr >> 8) & 0xFF)
                  rec.append(addr & 0xFF)
                  rec.append(rectype)
                  rec.extend(new_data)
                  chk = checksum(rec)

                  patched_lines.append(":" + rec.hex().upper() + f"{chk:02X}")
              else:
                  patched_lines.append(line)

          dst_hex = out / "RUNA_FC51_ICM40609.hex"
          dst_hex.write_text("\n".join(patched_lines) + "\n")
          print("Patched HEX written:", dst_hex)

          bin_files = list(Path("inav/build").rglob(f"*{target}*.bin"))

          if not bin_files:
              bin_files = list(Path("inav/build").rglob("*.bin"))

          for src_bin in bin_files:
              data = src_bin.read_bytes()
              count = data.count(old)

              if count:
                  patched = data.replace(old, new)
                  dst_bin = out / "RUNA_FC51_ICM40609.bin"
                  dst_bin.write_bytes(patched)
                  print("Patched BIN written:", dst_bin, "replacements:", count)
                  break

          elf_files = list(Path("inav/build").rglob(f"*{target}*.elf"))
          if elf_files:
              dst_elf = out / "RUNA_FC51_ICM40609.elf"
              dst_elf.write_bytes(elf_files[0].read_bytes())
              print("ELF copied:", dst_elf)
          PY

      - name: Create RUNA FC51 CLI presets
        run: |
          mkdir -p out

          cat > out/RUNA_FC51_ICM40609_BASE_SETUP.cli <<'EOF'
          batch start

          # RUNA FC 5.1 base setup from working FC5.1 diff
          # ACC/GYRO: ICM40609
          # BARO: SPL06
          # MAG: HMC5883
          # Board yaw: 1800

          set acc_hardware = ICM40609
          set baro_hardware = SPL06
          set mag_hardware = HMC5883
          set align_mag = CW0FLIP

          set align_board_roll = 0
          set align_board_pitch = 0
          set align_board_yaw = 1800

          set gyro_zero_x = 19
          set gyro_zero_y = -2
          set gyro_zero_z = 1

          set acczero_y = -2
          set acczero_z = 20
          set accgain_x = 4091
          set accgain_y = 4093
          set accgain_z = 4094

          set vbat_adc_channel = 1
          set rssi_adc_channel = 4
          set current_adc_channel = 2
          set airspeed_adc_channel = 3

          save
          EOF

          cat > out/RUNA_FC51_VTX_5G8_5820_5695_5733.cli <<'EOF'
          batch start

          # RUNA FC51 VTX 5.8 GHz
          # VTX: IRC Tramp
          # Port: UART5 / TX5
          # AUX2 = CH6
          #
          # CH6 LOW  -> 5820 MHz = FATSHARK F5
          # CH6 MID  -> 5695 MHz = RACEBAND R2
          # CH6 HIGH -> 5733 MHz = BAND B B1

          feature VTX

          # UART5 / TX5 -> IRC Tramp
          # serial 4 = UART5
          serial 4 4096 115200 115200 0 115200

          set vtx_frequency_group = FREQUENCYGROUP_5G8

          # Start channel: FATSHARK F5 / 5820 MHz
          set vtx_band = 4
          set vtx_channel = 5
          set vtx_power = 5
          set vtx_low_power_disarm = OFF
          set vtx_pit_mode_chan = 1
          set vtx_max_power_override = 0

          # Clear old VTX logic 0-8
          logic 0 0 -1 0 0 0 0 0 0
          logic 1 0 -1 0 0 0 0 0 0
          logic 2 0 -1 0 0 0 0 0 0
          logic 3 0 -1 0 0 0 0 0 0
          logic 4 0 -1 0 0 0 0 0 0
          logic 5 0 -1 0 0 0 0 0 0
          logic 6 0 -1 0 0 0 0 0 0
          logic 7 0 -1 0 0 0 0 0 0
          logic 8 0 -1 0 0 0 0 0 0

          # CH6 LOW / MID / HIGH detectors
          logic 0 1 -1 4 1 6 0 0 0
          logic 1 1 -1 5 1 6 0 0 0
          logic 2 1 -1 6 1 6 0 0 0

          # LOW -> FATSHARK F5 / 5820 MHz
          logic 3 1 0 30 0 4 0 0 0
          logic 4 1 0 31 0 5 0 0 0

          # MID -> RACEBAND R2 / 5695 MHz
          logic 5 1 1 30 0 5 0 0 0
          logic 6 1 1 31 0 2 0 0 0

          # HIGH -> BAND B B1 / 5733 MHz
          logic 7 1 2 30 0 2 0 0 0
          logic 8 1 2 31 0 1 0 0 0

          save
          EOF

          cat > out/RUNA_FC51_VTX_3G3.cli <<'EOF'
          batch start

          feature VTX

          # RUNA 3.3GHz uses patched FREQUENCYGROUP_1G3 table
          set vtx_frequency_group = FREQUENCYGROUP_1G3
          set vtx_band = 1
          set vtx_channel = 1
          set vtx_power = 5
          set vtx_low_power_disarm = OFF
          set vtx_halfduplex = ON
          set vtx_smartaudio_early_akk_workaround = ON
          set vtx_smartaudio_alternate_softserial_method = ON
          set vtx_smartaudio_stopbits = 2

          save
          EOF

          cat > out/README_RUNA_FC51_ICM40609.txt <<'EOF'
          RUNA FC51 ICM40609 firmware

          Built from:
          - INAV 7.1.2
          - Target: SPEEDYBEEF405WING
          - Patched display name: SPEEDYBEE51+RUNA!

          FC 5.1 working diff says:
          - acc_hardware = ICM40609
          - baro_hardware = SPL06
          - mag_hardware = HMC5883
          - align_mag = CW0FLIP
          - align_board_yaw = 1800

          Added:
          - RUNAv.51 startup OSD text
          - RUNA OSD shutter on Layout 2
          - VTX 3.3GHz table
          - VTX 5.8 switching preset:
            CH6 LOW  = 5820 MHz
            CH6 MID  = 5695 MHz
            CH6 HIGH = 5733 MHz

          Flash:
          1. INAV Configurator 7.x
          2. DFU mode
          3. Full Chip Erase
          4. Flash RUNA_FC51_ICM40609.hex
          5. CLI:
             defaults
             save

          6. Wait 15 seconds without touching board.
          7. Apply RUNA_FC51_ICM40609_BASE_SETUP.cli
          8. Calibrate accelerometer.
          9. Check:
             status
             get align_board

          Required:
          - GYRO=OK
          - ACC=OK
          - BARO=OK
          - MAG=OK
          - HWFAIL absent
          - align_board_yaw = 1800

          If Actions fail on ICM40609 source support:
          official INAV source does not contain this custom driver.
          Then use working fw.bin patch method or find custom source commit 21449e25.

          Test without propeller.
          EOF

          echo "OUT files:"
          ls -lah out

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: RUNA-FC51-ICM40609
          path: out/*
