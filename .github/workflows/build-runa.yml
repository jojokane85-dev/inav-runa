name: Build STM32F405 LSM6DXX Low Level Scanner

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          # LED variants
          - led_name: LED_PC13
            led_port: GPIOC
            led_pin: GPIO13

          - led_name: LED_PB2
            led_port: GPIOB
            led_pin: GPIO2

          - led_name: LED_PB9
            led_port: GPIOB
            led_pin: GPIO9

          - led_name: LED_PA8
            led_port: GPIOA
            led_pin: GPIO8

    env:
      PROJECT: stm32f405_lsm6dxx_scanner

    steps:
      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            git \
            make \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            python3

      - name: Clone libopencm3
        run: |
          git clone --depth 1 https://github.com/libopencm3/libopencm3.git
          cd libopencm3
          make -j2

      - name: Create scanner source
        run: |
          mkdir -p ${PROJECT}

          cat > ${PROJECT}/main.c <<'EOF'
          /*
           * STM32F405 LSM6DXX low-level SPI scanner
           *
           * Diagnostic firmware only.
           * Do not fly.
           *
           * It scans SPI1/SPI2/SPI3 with multiple CS pins and reads
           * LSM6DXX WHO_AM_I register 0x0F.
           *
           * Success:
           *   LED blinks variant number repeatedly.
           *
           * Failure:
           *   LED slow blinking forever.
           */

          #include <libopencm3/stm32/rcc.h>
          #include <libopencm3/stm32/gpio.h>
          #include <libopencm3/stm32/spi.h>
          #include <libopencm3/cm3/systick.h>
          #include <stdint.h>
          #include <stdbool.h>

          #define LED_PORT ${{ matrix.led_port }}
          #define LED_PIN  ${{ matrix.led_pin }}

          #define LSM6DXX_WHOAMI_REG 0x0F

          static volatile uint32_t system_millis = 0;

          void sys_tick_handler(void)
          {
              system_millis++;
          }

          static void delay_ms(uint32_t ms)
          {
              uint32_t start = system_millis;
              while ((system_millis - start) < ms) {
                  __asm__("nop");
              }
          }

          static void clock_setup(void)
          {
              rcc_clock_setup_pll(&rcc_hse_8mhz_3v3[RCC_CLOCK_3V3_168MHZ]);

              systick_set_clocksource(STK_CSR_CLKSOURCE_AHB);
              systick_set_reload(168000 - 1);
              systick_interrupt_enable();
              systick_counter_enable();

              rcc_periph_clock_enable(RCC_GPIOA);
              rcc_periph_clock_enable(RCC_GPIOB);
              rcc_periph_clock_enable(RCC_GPIOC);

              rcc_periph_clock_enable(RCC_SPI1);
              rcc_periph_clock_enable(RCC_SPI2);
              rcc_periph_clock_enable(RCC_SPI3);
          }

          static void led_setup(void)
          {
              gpio_mode_setup(LED_PORT, GPIO_MODE_OUTPUT, GPIO_PUPD_NONE, LED_PIN);
              gpio_set_output_options(LED_PORT, GPIO_OTYPE_PP, GPIO_OSPEED_2MHZ, LED_PIN);
              gpio_set(LED_PORT, LED_PIN);
          }

          static void led_on(void)
          {
              gpio_clear(LED_PORT, LED_PIN);
          }

          static void led_off(void)
          {
              gpio_set(LED_PORT, LED_PIN);
          }

          static void blink_short(void)
          {
              led_on();
              delay_ms(120);
              led_off();
              delay_ms(180);
          }

          static void blink_long(void)
          {
              led_on();
              delay_ms(600);
              led_off();
              delay_ms(600);
          }

          static void blink_code(uint8_t code)
          {
              if (code == 0) {
                  while (1) {
                      blink_long();
                  }
              }

              while (1) {
                  for (uint8_t i = 0; i < code; i++) {
                      blink_short();
                  }

                  delay_ms(1400);
              }
          }

          typedef struct {
              uint32_t port;
              uint16_t pin;
          } gpio_pin_t;

          typedef struct {
              uint32_t spi;
              uint8_t bus_number;
          } spi_bus_t;

          static const spi_bus_t spi_buses[] = {
              { SPI1, 1 },
              { SPI2, 2 },
              { SPI3, 3 },
          };

          static const gpio_pin_t cs_pins[] = {
              { GPIOA, GPIO4  },   // PA4
              { GPIOA, GPIO15 },   // PA15
              { GPIOB, GPIO0  },   // PB0
              { GPIOB, GPIO1  },   // PB1
              { GPIOB, GPIO2  },   // PB2
              { GPIOB, GPIO12 },   // PB12
              { GPIOC, GPIO4  },   // PC4
              { GPIOC, GPIO13 },   // PC13
              { GPIOC, GPIO14 },   // PC14
              { GPIOC, GPIO15 },   // PC15
          };

          static void cs_setup_all(void)
          {
              for (unsigned i = 0; i < sizeof(cs_pins) / sizeof(cs_pins[0]); i++) {
                  gpio_mode_setup(cs_pins[i].port, GPIO_MODE_OUTPUT, GPIO_PUPD_NONE, cs_pins[i].pin);
                  gpio_set_output_options(cs_pins[i].port, GPIO_OTYPE_PP, GPIO_OSPEED_50MHZ, cs_pins[i].pin);
                  gpio_set(cs_pins[i].port, cs_pins[i].pin);
              }
          }

          static void cs_low(gpio_pin_t cs)
          {
              gpio_clear(cs.port, cs.pin);
          }

          static void cs_high(gpio_pin_t cs)
          {
              gpio_set(cs.port, cs.pin);
          }

          static void spi_gpio_setup(uint32_t spi)
          {
              /*
               * STM32F405 common SPI pins:
               *
               * SPI1:
               *   SCK  PA5
               *   MISO PA6
               *   MOSI PA7
               *
               * SPI2:
               *   SCK  PB13
               *   MISO PB14
               *   MOSI PB15
               *
               * SPI3:
               *   SCK  PC10
               *   MISO PC11
               *   MOSI PC12
               */

              if (spi == SPI1) {
                  gpio_mode_setup(GPIOA, GPIO_MODE_AF, GPIO_PUPD_NONE, GPIO5 | GPIO6 | GPIO7);
                  gpio_set_af(GPIOA, GPIO_AF5, GPIO5 | GPIO6 | GPIO7);
                  gpio_set_output_options(GPIOA, GPIO_OTYPE_PP, GPIO_OSPEED_50MHZ, GPIO5 | GPIO6 | GPIO7);
              } else if (spi == SPI2) {
                  gpio_mode_setup(GPIOB, GPIO_MODE_AF, GPIO_PUPD_NONE, GPIO13 | GPIO14 | GPIO15);
                  gpio_set_af(GPIOB, GPIO_AF5, GPIO13 | GPIO14 | GPIO15);
                  gpio_set_output_options(GPIOB, GPIO_OTYPE_PP, GPIO_OSPEED_50MHZ, GPIO13 | GPIO14 | GPIO15);
              } else if (spi == SPI3) {
                  gpio_mode_setup(GPIOC, GPIO_MODE_AF, GPIO_PUPD_NONE, GPIO10 | GPIO11 | GPIO12);
                  gpio_set_af(GPIOC, GPIO_AF6, GPIO10 | GPIO11 | GPIO12);
                  gpio_set_output_options(GPIOC, GPIO_OTYPE_PP, GPIO_OSPEED_50MHZ, GPIO10 | GPIO11 | GPIO12);
              }
          }

          static void spi_setup(uint32_t spi)
          {
              spi_disable(spi);
              spi_reset(spi);

              spi_init_master(
                  spi,
                  SPI_CR1_BAUDRATE_FPCLK_DIV_256,
                  SPI_CR1_CPOL_CLK_TO_1_WHEN_IDLE,
                  SPI_CR1_CPHA_CLK_TRANSITION_2,
                  SPI_CR1_DFF_8BIT,
                  SPI_CR1_MSBFIRST
              );

              spi_set_full_duplex_mode(spi);
              spi_enable_software_slave_management(spi);
              spi_set_nss_high(spi);
              spi_enable(spi);
          }

          static uint8_t spi_xfer8(uint32_t spi, uint8_t data)
          {
              spi_send(spi, data);
              return spi_read(spi);
          }

          static uint8_t read_whoami(uint32_t spi, gpio_pin_t cs)
          {
              uint8_t value;

              cs_low(cs);
              delay_ms(1);

              /*
               * LSM6DXX SPI read:
               * bit7 = 1 for read
               */
              spi_xfer8(spi, LSM6DXX_WHOAMI_REG | 0x80);
              value = spi_xfer8(spi, 0x00);

              delay_ms(1);
              cs_high(cs);
              delay_ms(2);

              return value;
          }

          static bool is_lsm6dxx_id(uint8_t id)
          {
              return id == 0x69 ||
                     id == 0x6A ||
                     id == 0x6B ||
                     id == 0x6C ||
                     id == 0x6D;
          }

          int main(void)
          {
              clock_setup();
              led_setup();
              cs_setup_all();

              delay_ms(1000);

              uint8_t variant = 1;

              for (unsigned b = 0; b < sizeof(spi_buses) / sizeof(spi_buses[0]); b++) {
                  uint32_t spi = spi_buses[b].spi;

                  spi_gpio_setup(spi);
                  spi_setup(spi);

                  for (unsigned c = 0; c < sizeof(cs_pins) / sizeof(cs_pins[0]); c++) {
                      gpio_pin_t cs = cs_pins[c];

                      /*
                       * Do several reads because sensors may need time after boot.
                       */
                      for (uint8_t attempt = 0; attempt < 5; attempt++) {
                          uint8_t id = read_whoami(spi, cs);

                          if (is_lsm6dxx_id(id)) {
                              /*
                               * Found.
                               * Blink variant code forever.
                               *
                               * Variant mapping:
                               *  1  = SPI1 PA4
                               *  2  = SPI1 PA15
                               *  3  = SPI1 PB0
                               *  4  = SPI1 PB1
                               *  5  = SPI1 PB2
                               *  6  = SPI1 PB12
                               *  7  = SPI1 PC4
                               *  8  = SPI1 PC13
                               *  9  = SPI1 PC14
                               *  10 = SPI1 PC15
                               *  11 = SPI2 PA4
                               *  ...
                               *  21 = SPI3 PA4
                               */
                              blink_code(variant);
                          }

                          delay_ms(20);
                      }

                      variant++;
                  }

                  spi_disable(spi);
              }

              /*
               * Not found.
               */
              blink_code(0);

              return 0;
          }
          EOF

          cat > ${PROJECT}/Makefile <<'EOF'
          PROJECT = scanner
          BUILD_DIR = build

          CFILES = main.c

          DEVICE = stm32f405rg
          OPENCM3_DIR = ../libopencm3

          LDSCRIPT = $(OPENCM3_DIR)/lib/stm32/f4/stm32f405x6.ld

          PREFIX ?= arm-none-eabi

          CC = $(PREFIX)-gcc
          OBJCOPY = $(PREFIX)-objcopy
          SIZE = $(PREFIX)-size

          CFLAGS += -Os -g
          CFLAGS += -Wall -Wextra
          CFLAGS += -mcpu=cortex-m4 -mthumb -mfloat-abi=hard -mfpu=fpv4-sp-d16
          CFLAGS += -DSTM32F4
          CFLAGS += -I$(OPENCM3_DIR)/include

          LDFLAGS += -mcpu=cortex-m4 -mthumb -mfloat-abi=hard -mfpu=fpv4-sp-d16
          LDFLAGS += -T$(LDSCRIPT)
          LDFLAGS += -nostartfiles
          LDFLAGS += -Wl,--gc-sections
          LDFLAGS += -L$(OPENCM3_DIR)/lib

          LDLIBS += -lopencm3_stm32f4

          OBJS = $(CFILES:%.c=$(BUILD_DIR)/%.o)

          all: $(BUILD_DIR)/$(PROJECT).elf $(BUILD_DIR)/$(PROJECT).bin $(BUILD_DIR)/$(PROJECT).hex
          	$(SIZE) $(BUILD_DIR)/$(PROJECT).elf

          $(BUILD_DIR):
          	mkdir -p $(BUILD_DIR)

          $(BUILD_DIR)/%.o: %.c | $(BUILD_DIR)
          	$(CC) $(CFLAGS) -c $< -o $@

          $(BUILD_DIR)/$(PROJECT).elf: $(OBJS)
          	$(CC) $(LDFLAGS) $^ $(LDLIBS) -o $@

          $(BUILD_DIR)/$(PROJECT).bin: $(BUILD_DIR)/$(PROJECT).elf
          	$(OBJCOPY) -O binary $< $@

          $(BUILD_DIR)/$(PROJECT).hex: $(BUILD_DIR)/$(PROJECT).elf
          	$(OBJCOPY) -O ihex $< $@

          clean:
          	rm -rf $(BUILD_DIR)
          EOF

      - name: Build scanner
        run: |
          cd ${PROJECT}
          make clean
          make -j2

      - name: Collect artifacts
        run: |
          mkdir -p out

          cp ${PROJECT}/build/scanner.bin out/STM32F405_LSM6DXX_SCANNER_${{ matrix.led_name }}.bin
          cp ${PROJECT}/build/scanner.hex out/STM32F405_LSM6DXX_SCANNER_${{ matrix.led_name }}.hex
          cp ${PROJECT}/build/scanner.elf out/STM32F405_LSM6DXX_SCANNER_${{ matrix.led_name }}.elf

          cat > out/README_${{ matrix.led_name }}.txt <<'EOF'
          STM32F405 LSM6DXX LOW LEVEL SCANNER

          Diagnostic firmware only.
          Do not fly.
          Do not install propeller.

          LED variant:
          ${{ matrix.led_name }}

          What it does:
          - Scans SPI1/SPI2/SPI3
          - Tries CS pins:
            PA4, PA15, PB0, PB1, PB2, PB12, PC4, PC13, PC14, PC15
          - Reads LSM6DXX WHO_AM_I register 0x0F
          - Accepts:
            0x69, 0x6A, 0x6B, 0x6C, 0x6D

          Result:
          - If sensor found:
            LED blinks variant number repeatedly.
          - If not found:
            LED blinks slowly forever.

          Variant mapping:
           1  = SPI1 PA4
           2  = SPI1 PA15
           3  = SPI1 PB0
           4  = SPI1 PB1
           5  = SPI1 PB2
           6  = SPI1 PB12
           7  = SPI1 PC4
           8  = SPI1 PC13
           9  = SPI1 PC14
           10 = SPI1 PC15

           11 = SPI2 PA4
           12 = SPI2 PA15
           13 = SPI2 PB0
           14 = SPI2 PB1
           15 = SPI2 PB2
           16 = SPI2 PB12
           17 = SPI2 PC4
           18 = SPI2 PC13
           19 = SPI2 PC14
           20 = SPI2 PC15

           21 = SPI3 PA4
           22 = SPI3 PA15
           23 = SPI3 PB0
           24 = SPI3 PB1
           25 = SPI3 PB2
           26 = SPI3 PB12
           27 = SPI3 PC4
           28 = SPI3 PC13
           29 = SPI3 PC14
           30 = SPI3 PC15

          How to use:
          1. Put board in DFU mode.
          2. Flash this HEX.
          3. Watch LED.
          4. Count short blinks between long pauses.
          5. Tell ChatGPT the blink number.

          If no LED blinks:
          - Try another LED variant.
          - There are 4 LED variants in artifacts:
            LED_PC13, LED_PB2, LED_PB9, LED_PA8
          EOF

          ls -lah out

      - name: Upload scanner
        uses: actions/upload-artifact@v4
        with:
          name: STM32F405-LSM6DXX-SCANNER-${{ matrix.led_name }}
          path: out/*
