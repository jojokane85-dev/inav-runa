name: Build STM32F405 LSM6DXX BEEPER Scanner V2

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - beeper_name: BEEPER_PA0_LOW
            beeper_port: A
            beeper_pin: 0
            active_low: 1
          - beeper_name: BEEPER_PA0_HIGH
            beeper_port: A
            beeper_pin: 0
            active_low: 0

          - beeper_name: BEEPER_PA1_LOW
            beeper_port: A
            beeper_pin: 1
            active_low: 1
          - beeper_name: BEEPER_PA1_HIGH
            beeper_port: A
            beeper_pin: 1
            active_low: 0

          - beeper_name: BEEPER_PA8_LOW
            beeper_port: A
            beeper_pin: 8
            active_low: 1
          - beeper_name: BEEPER_PA8_HIGH
            beeper_port: A
            beeper_pin: 8
            active_low: 0

          - beeper_name: BEEPER_PB2_LOW
            beeper_port: B
            beeper_pin: 2
            active_low: 1
          - beeper_name: BEEPER_PB2_HIGH
            beeper_port: B
            beeper_pin: 2
            active_low: 0

          - beeper_name: BEEPER_PB5_LOW
            beeper_port: B
            beeper_pin: 5
            active_low: 1
          - beeper_name: BEEPER_PB5_HIGH
            beeper_port: B
            beeper_pin: 5
            active_low: 0

          - beeper_name: BEEPER_PB8_LOW
            beeper_port: B
            beeper_pin: 8
            active_low: 1
          - beeper_name: BEEPER_PB8_HIGH
            beeper_port: B
            beeper_pin: 8
            active_low: 0

          - beeper_name: BEEPER_PB9_LOW
            beeper_port: B
            beeper_pin: 9
            active_low: 1
          - beeper_name: BEEPER_PB9_HIGH
            beeper_port: B
            beeper_pin: 9
            active_low: 0

          - beeper_name: BEEPER_PC13_LOW
            beeper_port: C
            beeper_pin: 13
            active_low: 1
          - beeper_name: BEEPER_PC13_HIGH
            beeper_port: C
            beeper_pin: 13
            active_low: 0

    env:
      PROJECT: stm32f405_lsm6dxx_beeper_scanner_v2

    steps:
      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            make \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            python3

      - name: Create beeper scanner source
        run: |
          mkdir -p ${PROJECT}

          cat > ${PROJECT}/main.c <<'EOF'
          /*
           * STM32F405 LSM6DXX BEEPER scanner V2
           *
           * Diagnostic only.
           * Do not fly.
           * Do not install propeller.
           *
           * Startup:
           *   3 short beeps = firmware started.
           *
           * Not found:
           *   long beep, pause, repeat.
           *
           * Found:
           *   long beeps  = SPI config number
           *   short beeps = CS pin number
           *
           * Example:
           *   2 long + 6 short = SPI config 2, CS 6
           */

          #include <stdint.h>

          #define BEEPER_PORT_LETTER '${{ matrix.beeper_port }}'
          #define BEEPER_PIN_NUM     ${{ matrix.beeper_pin }}
          #define BEEPER_ACTIVE_LOW  ${{ matrix.active_low }}

          #define RCC_BASE        0x40023800UL
          #define GPIOA_BASE      0x40020000UL
          #define GPIOB_BASE      0x40020400UL
          #define GPIOC_BASE      0x40020800UL

          #define SPI1_BASE       0x40013000UL
          #define SPI2_BASE       0x40003800UL
          #define SPI3_BASE       0x40003C00UL

          #define REG32(addr)     (*(volatile uint32_t *)(addr))

          #define RCC_AHB1ENR     REG32(RCC_BASE + 0x30)
          #define RCC_APB1ENR     REG32(RCC_BASE + 0x40)
          #define RCC_APB2ENR     REG32(RCC_BASE + 0x44)

          #define GPIO_MODER(p)   REG32((p) + 0x00)
          #define GPIO_OTYPER(p)  REG32((p) + 0x04)
          #define GPIO_OSPEEDR(p) REG32((p) + 0x08)
          #define GPIO_PUPDR(p)   REG32((p) + 0x0C)
          #define GPIO_BSRR(p)    REG32((p) + 0x18)
          #define GPIO_AFRL(p)    REG32((p) + 0x20)
          #define GPIO_AFRH(p)    REG32((p) + 0x24)

          #define SPI_CR1(s)      REG32((s) + 0x00)
          #define SPI_CR2(s)      REG32((s) + 0x04)
          #define SPI_SR(s)       REG32((s) + 0x08)

          #define SPI_SR_RXNE     (1U << 0)
          #define SPI_SR_TXE      (1U << 1)

          #define LSM6DXX_WHOAMI_REG 0x0F

          typedef struct {
              uint32_t port;
              uint8_t pin;
          } gpio_pin_t;

          typedef struct {
              uint32_t spi;
              uint32_t sck_port;
              uint8_t sck_pin;
              uint8_t sck_af;
              uint32_t miso_port;
              uint8_t miso_pin;
              uint8_t miso_af;
              uint32_t mosi_port;
              uint8_t mosi_pin;
              uint8_t mosi_af;
              uint8_t mode;
              uint8_t config_number;
          } spi_config_t;

          static void delay_cycles(volatile uint32_t n)
          {
              while (n--) {
                  __asm volatile ("nop");
              }
          }

          static void delay_ms(uint32_t ms)
          {
              while (ms--) {
                  delay_cycles(4000);
              }
          }

          static uint32_t port_by_letter(char c)
          {
              if (c == 'A') return GPIOA_BASE;
              if (c == 'B') return GPIOB_BASE;
              return GPIOC_BASE;
          }

          static uint32_t beeper_port(void)
          {
              return port_by_letter(BEEPER_PORT_LETTER);
          }

          static void gpio_output(uint32_t port, uint8_t pin)
          {
              GPIO_MODER(port) &= ~(3U << (pin * 2));
              GPIO_MODER(port) |=  (1U << (pin * 2));
              GPIO_OTYPER(port) &= ~(1U << pin);
              GPIO_OSPEEDR(port) &= ~(3U << (pin * 2));
              GPIO_OSPEEDR(port) |=  (2U << (pin * 2));
              GPIO_PUPDR(port) &= ~(3U << (pin * 2));
          }

          static void gpio_af(uint32_t port, uint8_t pin, uint8_t af)
          {
              GPIO_MODER(port) &= ~(3U << (pin * 2));
              GPIO_MODER(port) |=  (2U << (pin * 2));
              GPIO_OTYPER(port) &= ~(1U << pin);
              GPIO_OSPEEDR(port) &= ~(3U << (pin * 2));
              GPIO_OSPEEDR(port) |=  (3U << (pin * 2));
              GPIO_PUPDR(port) &= ~(3U << (pin * 2));

              if (pin < 8) {
                  GPIO_AFRL(port) &= ~(0xFU << (pin * 4));
                  GPIO_AFRL(port) |=  ((uint32_t)af << (pin * 4));
              } else {
                  uint8_t p = pin - 8;
                  GPIO_AFRH(port) &= ~(0xFU << (p * 4));
                  GPIO_AFRH(port) |=  ((uint32_t)af << (p * 4));
              }
          }

          static void gpio_set_pin(uint32_t port, uint8_t pin)
          {
              GPIO_BSRR(port) = (1U << pin);
          }

          static void gpio_clear_pin(uint32_t port, uint8_t pin)
          {
              GPIO_BSRR(port) = (1U << (pin + 16));
          }

          static void beeper_on(void)
          {
              if (BEEPER_ACTIVE_LOW) {
                  gpio_clear_pin(beeper_port(), BEEPER_PIN_NUM);
              } else {
                  gpio_set_pin(beeper_port(), BEEPER_PIN_NUM);
              }
          }

          static void beeper_off(void)
          {
              if (BEEPER_ACTIVE_LOW) {
                  gpio_set_pin(beeper_port(), BEEPER_PIN_NUM);
              } else {
                  gpio_clear_pin(beeper_port(), BEEPER_PIN_NUM);
              }
          }

          static void beeper_setup(void)
          {
              gpio_output(beeper_port(), BEEPER_PIN_NUM);
              beeper_off();
          }

          static void beep_short(void)
          {
              beeper_on();
              delay_ms(120);
              beeper_off();
              delay_ms(180);
          }

          static void beep_long(void)
          {
              beeper_on();
              delay_ms(550);
              beeper_off();
              delay_ms(300);
          }

          static void startup_beep(void)
          {
              beep_short();
              beep_short();
              beep_short();
              delay_ms(1000);
          }

          static void beep_not_found(void)
          {
              while (1) {
                  beep_long();
                  delay_ms(1200);
              }
          }

          static void beep_found(uint8_t spi_config_number, uint8_t cs_number)
          {
              while (1) {
                  for (uint8_t i = 0; i < spi_config_number; i++) {
                      beep_long();
                  }

                  delay_ms(900);

                  for (uint8_t i = 0; i < cs_number; i++) {
                      beep_short();
                  }

                  delay_ms(1800);
              }
          }

          static const gpio_pin_t cs_pins[] = {
              { GPIOA_BASE, 4  },  // CS 1
              { GPIOA_BASE, 15 },  // CS 2
              { GPIOB_BASE, 0  },  // CS 3
              { GPIOB_BASE, 1  },  // CS 4
              { GPIOB_BASE, 2  },  // CS 5
              { GPIOB_BASE, 12 },  // CS 6
              { GPIOC_BASE, 4  },  // CS 7
              { GPIOC_BASE, 13 },  // CS 8
              { GPIOC_BASE, 14 },  // CS 9
              { GPIOC_BASE, 15 },  // CS 10
          };

          static const spi_config_t spi_configs[] = {
              // MODE3 configs: CPOL=1 CPHA=1
              { SPI1_BASE, GPIOA_BASE, 5, 5, GPIOA_BASE, 6, 5, GPIOA_BASE, 7, 5, 3, 1 },
              { SPI1_BASE, GPIOB_BASE, 3, 5, GPIOB_BASE, 4, 5, GPIOB_BASE, 5, 5, 3, 2 },

              { SPI2_BASE, GPIOB_BASE, 13, 5, GPIOB_BASE, 14, 5, GPIOB_BASE, 15, 5, 3, 3 },
              { SPI2_BASE, GPIOB_BASE, 10, 5, GPIOB_BASE, 14, 5, GPIOB_BASE, 15, 5, 3, 4 },

              { SPI3_BASE, GPIOC_BASE, 10, 6, GPIOC_BASE, 11, 6, GPIOC_BASE, 12, 6, 3, 5 },
              { SPI3_BASE, GPIOB_BASE, 3, 6, GPIOB_BASE, 4, 6, GPIOB_BASE, 5, 6, 3, 6 },

              // MODE0 configs: CPOL=0 CPHA=0
              { SPI1_BASE, GPIOA_BASE, 5, 5, GPIOA_BASE, 6, 5, GPIOA_BASE, 7, 5, 0, 7 },
              { SPI1_BASE, GPIOB_BASE, 3, 5, GPIOB_BASE, 4, 5, GPIOB_BASE, 5, 5, 0, 8 },

              { SPI2_BASE, GPIOB_BASE, 13, 5, GPIOB_BASE, 14, 5, GPIOB_BASE, 15, 5, 0, 9 },
              { SPI2_BASE, GPIOB_BASE, 10, 5, GPIOB_BASE, 14, 5, GPIOB_BASE, 15, 5, 0, 10 },

              { SPI3_BASE, GPIOC_BASE, 10, 6, GPIOC_BASE, 11, 6, GPIOC_BASE, 12, 6, 0, 11 },
              { SPI3_BASE, GPIOB_BASE, 3, 6, GPIOB_BASE, 4, 6, GPIOB_BASE, 5, 6, 0, 12 },
          };

          static void clocks_setup(void)
          {
              RCC_AHB1ENR |= (1U << 0) | (1U << 1) | (1U << 2);
              RCC_APB2ENR |= (1U << 12);              // SPI1
              RCC_APB1ENR |= (1U << 14) | (1U << 15); // SPI2/SPI3
              delay_ms(10);
          }

          static void cs_setup_all(void)
          {
              for (unsigned i = 0; i < sizeof(cs_pins) / sizeof(cs_pins[0]); i++) {
                  gpio_output(cs_pins[i].port, cs_pins[i].pin);
                  gpio_set_pin(cs_pins[i].port, cs_pins[i].pin);
              }
          }

          static void cs_low(gpio_pin_t cs)
          {
              gpio_clear_pin(cs.port, cs.pin);
          }

          static void cs_high(gpio_pin_t cs)
          {
              gpio_set_pin(cs.port, cs.pin);
          }

          static void spi_gpio_setup(const spi_config_t *cfg)
          {
              gpio_af(cfg->sck_port, cfg->sck_pin, cfg->sck_af);
              gpio_af(cfg->miso_port, cfg->miso_pin, cfg->miso_af);
              gpio_af(cfg->mosi_port, cfg->mosi_pin, cfg->mosi_af);
          }

          static void spi_setup(const spi_config_t *cfg)
          {
              uint32_t spi = cfg->spi;

              SPI_CR1(spi) = 0;
              SPI_CR2(spi) = 0;

              SPI_CR1(spi) =
                  (1U << 2) |   // Master
                  (7U << 3) |   // BR /256
                  (1U << 8) |   // SSI
                  (1U << 9);    // SSM

              if (cfg->mode == 3) {
                  SPI_CR1(spi) |= (1U << 1); // CPOL
                  SPI_CR1(spi) |= (1U << 0); // CPHA
              }

              SPI_CR1(spi) |= (1U << 6); // SPE
          }

          static uint8_t spi_xfer8(uint32_t spi, uint8_t data)
          {
              uint32_t timeout = 100000;

              while (!(SPI_SR(spi) & SPI_SR_TXE)) {
                  if (--timeout == 0) {
                      return 0xFF;
                  }
              }

              *((volatile uint8_t *)(spi + 0x0C)) = data;

              timeout = 100000;

              while (!(SPI_SR(spi) & SPI_SR_RXNE)) {
                  if (--timeout == 0) {
                      return 0xFF;
                  }
              }

              return *((volatile uint8_t *)(spi + 0x0C));
          }

          static uint8_t read_whoami(const spi_config_t *cfg, gpio_pin_t cs)
          {
              uint8_t value;

              cs_high(cs);
              delay_ms(1);

              cs_low(cs);
              delay_ms(1);

              spi_xfer8(cfg->spi, LSM6DXX_WHOAMI_REG | 0x80);
              value = spi_xfer8(cfg->spi, 0x00);

              delay_ms(1);
              cs_high(cs);
              delay_ms(2);

              return value;
          }

          static uint8_t is_lsm6dxx_id(uint8_t id)
          {
              return id == 0x69 ||
                     id == 0x6A ||
                     id == 0x6B ||
                     id == 0x6C ||
                     id == 0x6D;
          }

          int main(void)
          {
              clocks_setup();

              beeper_setup();
              startup_beep();

              cs_setup_all();
              delay_ms(1000);

              for (unsigned s = 0; s < sizeof(spi_configs) / sizeof(spi_configs[0]); s++) {
                  const spi_config_t *cfg = &spi_configs[s];

                  spi_gpio_setup(cfg);
                  spi_setup(cfg);

                  for (unsigned c = 0; c < sizeof(cs_pins) / sizeof(cs_pins[0]); c++) {
                      gpio_pin_t cs = cs_pins[c];
                      uint8_t cs_number = c + 1;

                      for (uint8_t attempt = 0; attempt < 12; attempt++) {
                          uint8_t id = read_whoami(cfg, cs);

                          if (is_lsm6dxx_id(id)) {
                              beep_found(cfg->config_number, cs_number);
                          }

                          delay_ms(20);
                      }
                  }

                  SPI_CR1(cfg->spi) &= ~(1U << 6);
              }

              beep_not_found();
          }
          EOF

          cat > ${PROJECT}/startup.c <<'EOF'
          #include <stdint.h>

          extern int main(void);

          extern uint32_t _estack;
          extern uint32_t _sidata;
          extern uint32_t _sdata;
          extern uint32_t _edata;
          extern uint32_t _sbss;
          extern uint32_t _ebss;

          void reset_handler(void);
          void default_handler(void);

          __attribute__((section(".isr_vector")))
          void (* const vector_table[])(void) = {
              (void (*)(void))(&_estack),
              reset_handler,
              default_handler,
              default_handler,
              default_handler,
              default_handler,
              default_handler,
              0,
              0,
              0,
              0,
              default_handler,
              default_handler,
              0,
              default_handler,
              default_handler,
          };

          void reset_handler(void)
          {
              uint32_t *src = &_sidata;
              uint32_t *dst = &_sdata;

              while (dst < &_edata) {
                  *dst++ = *src++;
              }

              dst = &_sbss;

              while (dst < &_ebss) {
                  *dst++ = 0;
              }

              main();

              while (1) {}
          }

          void default_handler(void)
          {
              while (1) {}
          }
          EOF

          cat > ${PROJECT}/linker.ld <<'EOF'
          MEMORY
          {
              FLASH (rx)  : ORIGIN = 0x08000000, LENGTH = 1024K
              RAM (xrw)   : ORIGIN = 0x20000000, LENGTH = 128K
          }

          _estack = ORIGIN(RAM) + LENGTH(RAM);

          SECTIONS
          {
              .isr_vector :
              {
                  KEEP(*(.isr_vector))
              } > FLASH

              .text :
              {
                  *(.text*)
                  *(.rodata*)
                  . = ALIGN(4);
                  _etext = .;
              } > FLASH

              _sidata = LOADADDR(.data);

              .data : AT(_etext)
              {
                  . = ALIGN(4);
                  _sdata = .;
                  *(.data*)
                  . = ALIGN(4);
                  _edata = .;
              } > RAM

              .bss :
              {
                  . = ALIGN(4);
                  _sbss = .;
                  *(.bss*)
                  *(COMMON)
                  . = ALIGN(4);
                  _ebss = .;
              } > RAM
          }
          EOF

          cat > ${PROJECT}/Makefile <<'EOF'
          PROJECT = beeper_scanner_v2
          BUILD_DIR = build

          PREFIX ?= arm-none-eabi
          CC = $(PREFIX)-gcc
          OBJCOPY = $(PREFIX)-objcopy
          SIZE = $(PREFIX)-size

          CFLAGS = -Os -g -Wall -Wextra \
              -mcpu=cortex-m4 -mthumb -mfloat-abi=hard -mfpu=fpv4-sp-d16 \
              -ffreestanding -nostdlib

          LDFLAGS = -Tlinker.ld \
              -mcpu=cortex-m4 -mthumb -mfloat-abi=hard -mfpu=fpv4-sp-d16 \
              -nostdlib -Wl,--gc-sections

          SRCS = startup.c main.c
          OBJS = $(SRCS:%.c=$(BUILD_DIR)/%.o)

          all: $(BUILD_DIR)/$(PROJECT).elf $(BUILD_DIR)/$(PROJECT).bin $(BUILD_DIR)/$(PROJECT).hex
          	$(SIZE) $(BUILD_DIR)/$(PROJECT).elf

          $(BUILD_DIR):
          	mkdir -p $(BUILD_DIR)

          $(BUILD_DIR)/%.o: %.c | $(BUILD_DIR)
          	$(CC) $(CFLAGS) -c $< -o $@

          $(BUILD_DIR)/$(PROJECT).elf: $(OBJS)
          	$(CC) $(LDFLAGS) $^ -o $@

          $(BUILD_DIR)/$(PROJECT).bin: $(BUILD_DIR)/$(PROJECT).elf
          	$(OBJCOPY) -O binary $< $@

          $(BUILD_DIR)/$(PROJECT).hex: $(BUILD_DIR)/$(PROJECT).elf
          	$(OBJCOPY) -O ihex $< $@

          clean:
          	rm -rf $(BUILD_DIR)
          EOF

      - name: Build beeper scanner
        run: |
          cd ${PROJECT}
          make clean
          make -j2

      - name: Collect artifacts
        run: |
          mkdir -p out

          cp ${PROJECT}/build/beeper_scanner_v2.bin out/STM32F405_LSM6DXX_BEEPER_SCANNER_V2_${{ matrix.beeper_name }}.bin
          cp ${PROJECT}/build/beeper_scanner_v2.hex out/STM32F405_LSM6DXX_BEEPER_SCANNER_V2_${{ matrix.beeper_name }}.hex
          cp ${PROJECT}/build/beeper_scanner_v2.elf out/STM32F405_LSM6DXX_BEEPER_SCANNER_V2_${{ matrix.beeper_name }}.elf

          cat > out/README_${{ matrix.beeper_name }}.txt <<'EOF'
          STM32F405 LSM6DXX BEEPER SCANNER V2

          Diagnostic only.
          Do not fly.
          Do not install propeller.

          Startup:
          - 3 short beeps = scanner started.

          Not found:
          - long beep, pause, repeat.

          Found:
          - long beeps  = SPI config number
          - short beeps = CS pin number

          Example:
          - 2 long beeps + 6 short beeps
          - means SPI config 2, CS 6

          SPI config numbers:
          1  = SPI1 PA5/PA6/PA7 MODE3
          2  = SPI1 PB3/PB4/PB5 MODE3
          3  = SPI2 PB13/PB14/PB15 MODE3
          4  = SPI2 PB10/PB14/PB15 MODE3
          5  = SPI3 PC10/PC11/PC12 MODE3
          6  = SPI3 PB3/PB4/PB5 MODE3

          7  = SPI1 PA5/PA6/PA7 MODE0
          8  = SPI1 PB3/PB4/PB5 MODE0
          9  = SPI2 PB13/PB14/PB15 MODE0
          10 = SPI2 PB10/PB14/PB15 MODE0
          11 = SPI3 PC10/PC11/PC12 MODE0
          12 = SPI3 PB3/PB4/PB5 MODE0

          CS numbers:
          1  = PA4
          2  = PA15
          3  = PB0
          4  = PB1
          5  = PB2
          6  = PB12
          7  = PC4
          8  = PC13
          9  = PC14
          10 = PC15
          EOF

          ls -lah out

      - name: Upload beeper scanner
        uses: actions/upload-artifact@v4
        with:
          name: STM32F405-LSM6DXX-BEEPER-SCANNER-V2-${{ matrix.beeper_name }}
          path: out/*
