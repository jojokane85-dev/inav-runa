name: Find INAV 8 Targets

on:
  workflow_dispatch:
  push:

jobs:
  find-targets:
    runs-on: ubuntu-22.04

    env:
      INAV_VERSION: 8.0.1

    steps:
      - name: Install deps
        run: |
          sudo apt-get update -y -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            git \
            build-essential \
            g++ \
            ruby \
            cmake \
            make \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-dev \
            ninja-build \
            python3 \
            python3-pip

      - name: Clone INAV 8.0.1
        run: |
          git clone --branch ${INAV_VERSION} --depth 1 https://github.com/iNavFlight/inav.git
          cd inav
          echo "INAV version: ${INAV_VERSION}"
          echo "Commit:"
          git rev-parse HEAD

      - name: Configure CMake
        run: |
          cd inav
          mkdir -p build
          cd build
          cmake ..

      - name: Show ALL INAV targets
        run: |
          cd inav/build

          echo "======================================"
          echo "ALL AVAILABLE INAV TARGETS"
          echo "======================================"
          make help | sort || true

      - name: Show CADDX CADDY F405 AIO ELRS targets
        run: |
          cd inav/build

          echo "======================================"
          echo "CADDX / CADDY / CAD / XF405 / F405 / AIO / ELRS TARGETS"
          echo "======================================"

          make help | grep -i -E "CAD|CADD|CADDX|CADDY|XF405|F405|AIO|ELRS" | sort || true

      - name: Show possible CADDXF4 variants
        run: |
          cd inav/build

          echo "======================================"
          echo "CADDXF4 / CADDYF4 / F4 VARIANTS"
          echo "======================================"

          echo ""
          echo "===== CADDXF4 ====="
          make help | grep -i "CADDXF4" || true

          echo ""
          echo "===== CADDYF4 ====="
          make help | grep -i "CADDYF4" || true

          echo ""
          echo "===== CADDX ====="
          make help | grep -i "CADDX" || true

          echo ""
          echo "===== CADDY ====="
          make help | grep -i "CADDY" || true

          echo ""
          echo "===== F405 ====="
          make help | grep -i "F405" || true

          echo ""
          echo "===== AIO ====="
          make help | grep -i "AIO" || true

          echo ""
          echo "===== ELRS ====="
          make help | grep -i "ELRS" || true

      - name: Save target list to files
        run: |
          mkdir -p out
          cd inav/build

          make help | sort > ../../out/ALL_INAV8_TARGETS.txt || true
          make help | grep -i -E "CAD|CADD|CADDX|CADDY|XF405|F405|AIO|ELRS" | sort > ../../out/POSSIBLE_CADDX_F405_AIO_ELRS_TARGETS.txt || true

          echo "Files created:"
          ls -lah ../../out

      - name: Upload target lists
        uses: actions/upload-artifact@v4
        with:
          name: INAV8-target-lists
          path: out/*
