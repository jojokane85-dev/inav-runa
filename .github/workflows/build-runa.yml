name: Build RUNA FC45 Orientation Pack FIXED

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      BASE_TARGET: SPEEDYBEEF405WING

    steps:
      - name: Install deps
        run: |
          sudo apt-get update -y -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            git \
            build-essential \
            g++ \
            ruby \
            cmake \
            make \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-dev \
            ninja-build \
            python3 \
            python3-pip

      - name: Clone INAV 7.1.2
        run: |
          git clone --branch 7.1.2 --depth 1 https://github.com/iNavFlight/inav.git
          cd inav
          echo "Current commit:"
          git rev-parse HEAD

      - name: Create 8 RUNA FC45 orientation targets
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path
          import shutil
          import re
          import os

          base_target = os.environ["BASE_TARGET"]
          base_dir = Path(f"src/main/target/{base_target}")

          variants = {
              "R45CW0": "CW0_DEG",
              "R45CW90": "CW90_DEG",
              "R45CW180": "CW180_DEG",
              "R45CW270": "CW270_DEG",
              "R45CW0F": "CW0_DEG_FLIP",
              "R45CW90F": "CW90_DEG_FLIP",
              "R45CW180F": "CW180_DEG_FLIP",
              "R45CW270F": "CW270_DEG_FLIP",
          }

          remove_patterns = [
              r'//\s*ICM42605/ICM42688P\s*',
              r'#define\s+USE_IMU_ICM42605\s*',
              r'#define\s+IMU_ICM42605_ALIGN\s+\S+\s*',
              r'#define\s+ICM42605_CS_PIN\s+\S+\s*',
              r'#define\s+ICM42605_SPI_BUS\s+\S+\s*',

              r'#define\s+USE_IMU_ICM42688P\s*',
              r'#define\s+IMU_ICM42688P_ALIGN\s+\S+\s*',
              r'#define\s+ICM42688P_CS_PIN\s+\S+\s*',
              r'#define\s+ICM42688P_SPI_BUS\s+\S+\s*',

              r'#define\s+USE_IMU_LSM6DXX\s*',
              r'#define\s+LSM6DXX_SPI_BUS\s+\S+\s*',
              r'#define\s+LSM6DXX_CS_PIN\s+\S+\s*',
              r'#define\s+IMU_LSM6DXX_ALIGN\s+\S+\s*',
          ]

          for target, align in variants.items():
              dst_dir = Path(f"src/main/target/{target}")

              if dst_dir.exists():
                  shutil.rmtree(dst_dir)

              shutil.copytree(base_dir, dst_dir)

              cmake = dst_dir / "CMakeLists.txt"
              cmake_text = cmake.read_text(encoding="utf-8")
              cmake_text = cmake_text.replace(base_target, target)
              cmake.write_text(cmake_text, encoding="utf-8")

              target_h = dst_dir / "target.h"
              text = target_h.read_text(encoding="utf-8")

              for pattern in remove_patterns:
                  text = re.sub(pattern, "", text, flags=re.M)

              text += f"""

          /*
           * RUNA CADDXF405_WING FC 4.5 ORIENTATION TEST
           *
           * Original working status:
           * GYRO=LSM6DXX
           * ACC=LSM6DXX
           * BARO=SPL06
           * MAG=HMC5883
           *
           * Pins:
           * PA4 = MPU CS
           * PA5 = SPI1 SCK
           * PA6 = SPI1 MISO
           * PA7 = SPI1 MOSI
           *
           * TEST ALIGN:
           * {align}
           */
          #define USE_IMU_LSM6DXX
          #define LSM6DXX_SPI_BUS BUS_SPI1
          #define LSM6DXX_CS_PIN PA4
          #define IMU_LSM6DXX_ALIGN {align}
          """

              target_h.write_text(text, encoding="utf-8")

              print(f"Created {target} with {align}")

          print("All RUNA FC45 orientation targets created.")
          PY

          echo "==== Created targets ===="
          ls src/main/target | grep R45 || true

      - name: Patch LSM6DXX driver FORCE DETECT
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/drivers/accgyro/accgyro_lsm6dxx.c")
          text = path.read_text(encoding="utf-8")

          pattern = r"static bool lsm6dxxDetect\(busDevice_t \* dev\)\s*\{.*?\n\}"

          replacement = r'''static bool lsm6dxxDetect(busDevice_t * dev)
          {
              uint8_t tmp = 0;

              busSetSpeed(dev, BUS_SPEED_INITIALIZATION);
              delay(150);

              busRead(dev, LSM6DXX_REG_WHO_AM_I, &tmp);

              /*
               * RUNA FC45 FORCE DETECT
               *
               * Original CADDXF405_WING firmware detects this board as:
               * GYRO=LSM6DXX
               * ACC=LSM6DXX
               *
               * If WHO_AM_I is known, use it.
               * If not, force LSM6DS3 ID so INAV continues init.
               */
              if (tmp == 0x69 || tmp == 0x6A || tmp == 0x6B || tmp == 0x6C || tmp == 0x6D) {
                  lsm6dID = tmp;
              } else {
                  lsm6dID = LSM6DS3_CHIP_ID;
              }

              return true;
          }'''

          new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)

          if count != 1:
              print("ERROR: lsm6dxxDetect function not replaced")
              start = text.find("static bool lsm6dxxDetect")
              print("Start:", start)
              if start != -1:
                  print(text[start:start + 1200])
              raise SystemExit(1)

          path.write_text(new_text, encoding="utf-8")
          print("RUNA FORCE LSM6DXX detect patched")
          PY

          echo "==== CHECK FORCE DETECT ===="
          grep -n -A35 -B5 "static bool lsm6dxxDetect" src/main/drivers/accgyro/accgyro_lsm6dxx.c || true

      - name: Patch default acc hardware and ADC defaults
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/fc/settings.yaml")
          text = path.read_text(encoding="utf-8")

          def patch_setting(text, name, value):
              pattern = rf"(-\s+name:\s*{re.escape(name)}\b(?:(?!\n\s*-\s+name:).)*?default_value:\s*)([^\n\r]+)"

              def repl(m):
                  print(f"{name}: {m.group(2).strip()} -> {value}")
                  return m.group(1) + str(value)

              new_text, count = re.subn(pattern, repl, text, count=1, flags=re.S)

              if count != 1:
                  print(f"WARNING: {name} default not found")

              return new_text

          text = patch_setting(text, "acc_hardware", "LSM6DXX")

          # Как в рабочей оригинальной CADDXF405_WING:
          text = patch_setting(text, "rssi_adc_channel", "3")
          text = patch_setting(text, "current_adc_channel", "2")
          text = patch_setting(text, "airspeed_adc_channel", "4")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Patch RUNA name in Configurator
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/fc/fc_msp.c")
          text = path.read_text(encoding="utf-8")

          pattern = r'sbufWriteU8\(dst,\s*strlen\(targetName\)\);\s*sbufWriteData\(dst,\s*targetName,\s*strlen\(targetName\)\);'

          replacement = '''const char *runaTargetName = "CADDXF405_WING+RUNA";
                  sbufWriteU8(dst, strlen(runaTargetName));
                  sbufWriteData(dst, runaTargetName, strlen(runaTargetName));'''

          new_text, count = re.subn(pattern, replacement, text, count=1)

          if count == 1:
              path.write_text(new_text, encoding="utf-8")
              print("Patched Configurator target name: CADDXF405_WING+RUNA")
          else:
              print("WARNING: targetName MSP patch not found")
          PY

      - name: Patch startup text
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path

          path = Path("src/main/io/osd.c")
          text = path.read_text(encoding="utf-8")

          old = 'tfp_sprintf(string_buffer, "INAV VERSION: %s", FC_VERSION_STRING);'
          new = 'tfp_sprintf(string_buffer, "version RUNA 1.0");'

          if old in text:
              text = text.replace(old, new, 1)
              text = text.replace(
                  'uint8_t xPos = (osdDisplayPort->cols - 19) / 2;',
                  'uint8_t xPos = OSD_CENTER_S(string_buffer);',
                  1
              )
              path.write_text(text, encoding="utf-8")
              print("Startup text patched: version RUNA 1.0")
          else:
              print("WARNING: startup text line not found")
          PY

      - name: Patch RUNA OSD shutter
        run: |
          cd inav

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/io/osd.c")
          text = path.read_text(encoding="utf-8")

          pattern = r'osdDrawNextElement\(\);\s*displayHeartbeat\(osdDisplayPort\);\s*displayCommitTransaction\(osdDisplayPort\);'

          replacement = r'''
                  static bool runaShutterWasActive = false;
                  static uint8_t runaShutterNextRow = 0;

                  if (currentLayout == 2) {
                      textAttributes_t runaAttr = TEXT_ATTRIBUTES_NONE;
                      TEXT_ATTRIBUTES_ADD_SOLID_BG(runaAttr);

                      char runaMask[64];

                      uint8_t cols = osdDisplayPort->cols;
                      uint8_t rows = osdDisplayPort->rows;

                      if (cols > 63) {
                          cols = 63;
                      }

                      const uint8_t windowWidth = cols >= 30 ? 10 : cols / 3;
                      const uint8_t windowHeight = rows >= 16 ? 4 : rows / 3;

                      const uint8_t windowX = (cols - windowWidth) / 2;
                      const uint8_t windowY = (rows - windowHeight) / 2;

                      if (!runaShutterWasActive) {
                          displayClearScreen(osdDisplayPort);
                          runaShutterWasActive = true;
                          runaShutterNextRow = 0;
                      }

                      for (uint8_t pass = 0; pass < 2; pass++) {
                          uint8_t y = runaShutterNextRow;

                          const bool inWindowY = (y >= windowY) && (y < windowY + windowHeight);

                          if (!inWindowY) {
                              memset(runaMask, ' ', cols);
                              runaMask[cols] = '\0';
                              displayWriteWithAttr(osdDisplayPort, 0, y, runaMask, runaAttr);
                          } else {
                              if (windowX > 0) {
                                  memset(runaMask, ' ', windowX);
                                  runaMask[windowX] = '\0';
                                  displayWriteWithAttr(osdDisplayPort, 0, y, runaMask, runaAttr);
                              }

                              const uint8_t rightX = windowX + windowWidth;
                              if (rightX < cols) {
                                  const uint8_t rightWidth = cols - rightX;
                                  memset(runaMask, ' ', rightWidth);
                                  runaMask[rightWidth] = '\0';
                                  displayWriteWithAttr(osdDisplayPort, rightX, y, runaMask, runaAttr);
                              }
                          }

                          runaShutterNextRow++;

                          if (runaShutterNextRow >= rows) {
                              runaShutterNextRow = 0;
                          }
                      }
                  } else {
                      if (runaShutterWasActive) {
                          displayClearScreen(osdDisplayPort);
                          runaShutterWasActive = false;
                          runaShutterNextRow = 0;
                      }

                      osdDrawNextElement();
                  }

                  displayHeartbeat(osdDisplayPort);
                  displayCommitTransaction(osdDisplayPort);'''

          new_text, count = re.subn(pattern, replacement, text, count=1)

          if count != 1:
              print("ERROR: OSD draw block not found")
              raise SystemExit(1)

          path.write_text(new_text, encoding="utf-8")
          print("RUNA OSD shutter patched")
          PY

      - name: Configure CMake
        run: |
          cd inav
          mkdir -p build
          cd build
          cmake ..

      - name: Build all orientation firmwares
        run: |
          cd inav/build

          TARGETS="R45CW0 R45CW90 R45CW180 R45CW270 R45CW0F R45CW90F R45CW180F R45CW270F"

          for T in $TARGETS; do
            echo "=============================="
            echo "BUILDING $T"
            echo "=============================="
            make clean_${T} || true
            make ${T} -j2 VERBOSE=1
          done

      - name: Find firmware
        if: always()
        run: |
          echo "===== BUILT FILES ====="
          find inav/build -type f \( -name "*.hex" -o -name "*.bin" -o -name "*.elf" \) -print || true

      - name: Collect firmware
        if: success()
        run: |
          mkdir -p out

          python3 <<'PY'
          from pathlib import Path
          import shutil

          targets = {
              "R45CW0": "CW0_DEG",
              "R45CW90": "CW90_DEG",
              "R45CW180": "CW180_DEG",
              "R45CW270": "CW270_DEG",
              "R45CW0F": "CW0_DEG_FLIP",
              "R45CW90F": "CW90_DEG_FLIP",
              "R45CW180F": "CW180_DEG_FLIP",
              "R45CW270F": "CW270_DEG_FLIP",
          }

          build_dir = Path("inav/build")
          out_dir = Path("out")
          copied = 0

          for file in build_dir.rglob("*"):
              if not file.is_file():
                  continue

              if file.suffix.lower() not in {".hex", ".bin", ".elf"}:
                  continue

              for target, align in targets.items():
                  if target in file.name:
                      dst = out_dir / f"RUNA_FC45_{align}_{file.name}"
                      shutil.copy2(file, dst)
                      print("Copied:", dst)
                      copied += 1
                      break

          if copied == 0:
              print("ERROR: no firmware files found")
              raise SystemExit(1)

          readme_text = "\n".join([
              "RUNA FC45 CADDXF405_WING ORIENTATION TEST PACK",
              "",
              "WARNING:",
              "Do not fly with these test firmwares until model movement is correct.",
              "Remove propeller before testing.",
              "",
              "Flash one HEX at a time and check Setup tab.",
              "",
              "Correct movement:",
              "nose up          -> model nose up",
              "nose down        -> model nose down",
              "left wing down   -> model rolls left",
              "right wing down  -> model rolls right",
              "",
              "After each flash:",
              "1) CLI:",
              "   defaults",
              "   save",
              "",
              "2) Then reset board alignment:",
              "   set align_board_roll = 0",
              "   set align_board_pitch = 0",
              "   set align_board_yaw = 0",
              "   save",
              "",
              "3) If accelerometer calibration does not work:",
              "   set acczero_x = 0",
              "   set acczero_y = -2",
              "   set acczero_z = 20",
              "   set accgain_x = 4091",
              "   set accgain_y = 4093",
              "   set accgain_z = 4094",
              "   save",
              "",
              "Test order recommendation:",
              "1. CW0_DEG",
              "2. CW90_DEG",
              "3. CW180_DEG",
              "4. CW270_DEG",
              "5. CW0_DEG_FLIP",
              "6. CW90_DEG_FLIP",
              "7. CW180_DEG_FLIP",
              "8. CW270_DEG_FLIP",
              "",
          ])

          readme = out_dir / "README_RUNA_FC45_ORIENTATION_TEST.txt"
          readme.write_text(readme_text, encoding="utf-8")

          print("Total copied:", copied)
          PY

      - name: Upload firmware pack
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RUNA-FC45-CADDXF405-WING-ORIENTATION-PACK-FIXED
          path: out/*
