name: Check INAV ICM40609 Support

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        ref:
          - 8.0.1
          - 9.0.1
          - master

    steps:
      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git

      - name: Clone INAV
        run: |
          git clone --branch ${{ matrix.ref }} --depth 1 https://github.com/iNavFlight/inav.git inav || \
          git clone --depth 1 https://github.com/iNavFlight/inav.git inav

      - name: Search ICM40609
        run: |
          cd inav

          echo "===== CHECK REF: ${{ matrix.ref }} ====="

          echo "Searching ICM40609 / ICM40609D / 40609..."
          grep -RniE "ICM40609|ICM40609D|40609" src/main || true

          echo "Searching accgyro files..."
          find src/main/drivers/accgyro -type f | sort | grep -i -E "icm|gyro|acc" || true

          echo "Searching allowed acc_hardware names..."
          grep -RniE "ICM42605|ICM40609|BMI270|LSM6DXX|MPU6000" src/main | head -200 || true

          echo "Searching SpeedyBee targets..."
          find src/main/target -maxdepth 2 -type f | grep -i "SPEEDYBEE" || true
