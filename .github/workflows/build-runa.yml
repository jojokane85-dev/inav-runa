name: Build RUNA FC 5.1 Custom

on:
  workflow_dispatch:
    inputs:
      target:
        description: "FC target"
        required: true
        default: "SPEEDYBEEF405WING"
      runa_name:
        description: "RUNA name, must be same length or shorter than target"
        required: true
        default: "RUNA_FC51_F405WG"
      inav_ref:
        description: "INAV branch/tag"
        required: true
        default: "master"

jobs:
  build-runa:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            make \
            cmake \
            ninja-build \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            python3 \
            python3-pip \
            curl \
            unzip

      - name: Clone INAV
        run: |
          git clone --recursive https://github.com/iNavFlight/inav.git inav
          cd inav
          git checkout "${{ github.event.inputs.inav_ref }}"
          git submodule update --init --recursive

      - name: Create RUNA patch script
        run: |
          mkdir -p scripts

          cat > scripts/patch_runa_name.py <<'PY'
          #!/usr/bin/env python3
          import argparse
          from pathlib import Path

          def patch_file(path: Path, old: bytes, new: bytes) -> bool:
              data = path.read_bytes()

              if old not in data:
                  print(f"[SKIP] {path.name}: target name not found")
                  return False

              if len(new) > len(old):
                  raise ValueError(
                      f"RUNA name too long: {new.decode()} "
                      f"({len(new)}) > {old.decode()} ({len(old)})"
                  )

              new_padded = new + b"\x00" * (len(old) - len(new))
              patched = data.replace(old, new_padded)
              path.write_bytes(patched)

              print(f"[OK] {path.name}: {old!r} -> {new_padded!r}")
              return True

          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("--folder", required=True)
              parser.add_argument("--old", required=True)
              parser.add_argument("--new", required=True)
              args = parser.parse_args()

              folder = Path(args.folder)
              old = args.old.encode("ascii")
              new = args.new.encode("ascii")

              files = []
              for pattern in ("*.hex", "*.bin", "*.elf"):
                  files.extend(folder.rglob(pattern))

              if not files:
                  raise RuntimeError("No firmware files found")

              count = 0
              for f in files:
                  try:
                      if patch_file(f, old, new):
                          count += 1
                  except Exception as e:
                      print(f"[ERROR] {f}: {e}")

              print(f"Patched files: {count}")

          if __name__ == "__main__":
              main()
          PY

      - name: Create RUNA CLI files
        run: |
          mkdir -p cli

          cat > cli/RUNA_FC51_VTX_5G8.cli <<'CLI'
          # RUNA FC 5.1 VTX 5.8
          # Частоты RUNA: 5820 / 5695 / 5733

          set vtx_band = 5
          set vtx_channel = 3
          set vtx_freq = 5733
          set vtx_power = 5

          save
          CLI

          cat > cli/RUNA_FC51_VTX_3G3.cli <<'CLI'
          # RUNA FC 5.1 VTX 3.3
          # Только если VTX реально поддерживает 3.3 GHz

          set vtx_band = 1
          set vtx_channel = 1
          set vtx_freq = 3300
          set vtx_power = 5

          save
          CLI

          cat > cli/RUNA_FC51_SHUTTER_ARM_DISARM.cli <<'CLI'
          # RUNA FC 5.1
          # ШТОРА + VTX POWER ARM/DISARM

          # DISARM -> low power / power 1
          # ARM    -> vtx_power 5

          set vtx_power = 5
          set vtx_low_power_disarm = ON

          # ШТОРА:
          # В INAV Configurator:
          #
          # OSD Layout 0 = обычный экран
          # OSD Layout 1 = шторка
          #
          # CH8 / AUX4:
          # LOW/MID 900-1666  = Layout 0
          # HIGH    1667-2100 = Layout 1 / ШТОРА

          save
          CLI

          cat > cli/RUNA_FC51_ALL_IN_ONE.cli <<'CLI'
          # RUNA FC 5.1 ALL IN ONE
          # Безопасный CLI: не трогает оси, UART, моторы, сервы и mixer

          # VTX 5.8 default
          set vtx_band = 5
          set vtx_channel = 3
          set vtx_freq = 5733
          set vtx_power = 5

          # DISARM -> low power
          # ARM -> power 5
          set vtx_low_power_disarm = ON

          # ШТОРА:
          # OSD Layout 0 = обычный экран
          # OSD Layout 1 = шторка
          # CH8/AUX4 HIGH = шторка

          save
          CLI

      - name: Build INAV firmware
        run: |
          mkdir -p inav/build
          cd inav/build
          cmake ..
          make "${{ github.event.inputs.target }}" -j"$(nproc)"

      - name: Patch RUNA name
        run: |
          python3 scripts/patch_runa_name.py \
            --folder inav/build \
            --old "${{ github.event.inputs.target }}" \
            --new "${{ github.event.inputs.runa_name }}"

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          mkdir -p artifact/cli

          find inav/build -type f \( -name "*.hex" -o -name "*.bin" -o -name "*.elf" \) -exec cp {} artifact/ \;

          cp cli/*.cli artifact/cli/

          cat > artifact/RUNA_INFO.txt <<EOF
          RUNA FC 5.1 CUSTOM

          Base target:
          ${{ github.event.inputs.target }}

          RUNA name:
          ${{ github.event.inputs.runa_name }}

          Functions:
          - VTX 5.8
          - VTX 3.3
          - ШТОРА
          - DISARM -> VTX low power / power 1
          - ARM -> VTX power 5

          After flashing:
          1. Open INAV Configurator
          2. Open CLI
          3. Paste:
             cli/RUNA_FC51_ALL_IN_ONE.cli

          Or separately:
          - cli/RUNA_FC51_VTX_5G8.cli
          - cli/RUNA_FC51_VTX_3G3.cli
          - cli/RUNA_FC51_SHUTTER_ARM_DISARM.cli

          IMPORTANT:
          This build does not touch gyro axes, UART, motors, servos or mixer.
          EOF

          echo "=== ARTIFACT FILES ==="
          find artifact -type f -print

      - name: Upload RUNA firmware
        uses: actions/upload-artifact@v4
        with:
          name: RUNA_FC51_CUSTOM_FIRMWARE
          path: artifact/
