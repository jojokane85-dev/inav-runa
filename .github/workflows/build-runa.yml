name: Build RUNA FC41 INAV 7.1.2 LSM6DXX DRIVER PATCH

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      TARGET: SPEEDYBEEF405WING

    steps:
      - name: Install deps
        run: |
          sudo apt-get update -y -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            git \
            build-essential \
            g++ \
            ruby \
            cmake \
            make \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-dev \
            ninja-build \
            python3 \
            python3-pip

      - name: Clone INAV 7.1.2
        run: |
          git clone --branch 7.1.2 --depth 1 https://github.com/iNavFlight/inav.git
          cd inav
          git rev-parse HEAD

      - name: Patch FC41 target to LSM6DXX
        run: |
          cd inav
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/target/SPEEDYBEEF405WING/target.h")
          text = path.read_text(encoding="utf-8")

          remove_patterns = [
              r'//\s*ICM42605/ICM42688P\s*',
              r'#define\s+USE_IMU_ICM42605\s*',
              r'#define\s+IMU_ICM42605_ALIGN\s+\S+\s*',
              r'#define\s+ICM42605_CS_PIN\s+\S+\s*',
              r'#define\s+ICM42605_SPI_BUS\s+\S+\s*',
              r'#define\s+USE_IMU_ICM42688P\s*',
              r'#define\s+IMU_ICM42688P_ALIGN\s+\S+\s*',
              r'#define\s+ICM42688P_CS_PIN\s+\S+\s*',
              r'#define\s+ICM42688P_SPI_BUS\s+\S+\s*',
              r'#define\s+USE_IMU_LSM6DXX\s*',
              r'#define\s+LSM6DXX_SPI_BUS\s+\S+\s*',
              r'#define\s+LSM6DXX_CS_PIN\s+\S+\s*',
              r'#define\s+IMU_LSM6DXX_ALIGN\s+\S+\s*',
          ]

          for p in remove_patterns:
              text = re.sub(p, "", text, flags=re.M)

          text += """

          /*
           * RUNA FC 4.1 IMU
           * Diagnostic result: LSM6DXX FOUND
           * PA4 = MPU CS
           * PA5 = SPI1 SCK
           * PA6 = SPI1 MISO
           * PA7 = SPI1 MOSI
           */
          #define USE_IMU_LSM6DXX
          #define LSM6DXX_SPI_BUS BUS_SPI1
          #define LSM6DXX_CS_PIN PA4
          #define IMU_LSM6DXX_ALIGN CW0_DEG
          """

          path.write_text(text, encoding="utf-8")

          check = path.read_text(encoding="utf-8")
          for bad in ["USE_IMU_ICM42605", "ICM42605_CS_PIN", "USE_IMU_ICM42688P", "ICM42688P_CS_PIN"]:
              if bad in check:
                  print("ERROR still exists:", bad)
                  raise SystemExit(1)

          print("RUNA FC41 target patched:")
          print("IMU = LSM6DXX")
          print("BUS = SPI1")
          print("CS  = PA4")
          PY

          echo "==== IMU lines ===="
          grep -n -E "IMU|LSM6|ICM426|PA4|SPI1" src/main/target/SPEEDYBEEF405WING/target.h || true

      - name: Patch LSM6DXX driver WHO_AM_I
        run: |
          cd inav
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/drivers/accgyro/accgyro_lsm6dxx.c")
          text = path.read_text(encoding="utf-8")

          # Добавляем ID, которые наш диагностический код считает LSM6DXX:
          # 0x69, 0x6A, 0x6B, 0x6C, 0x6D
          if "#define LSM6DS3_CHIP_ID 0x69" not in text:
              print("WARNING: expected LSM6DS3_CHIP_ID not found")

          if "#define LSM6DSR_CHIP_ID 0x6B" not in text:
              text = text.replace(
                  "#define LSM6DS3_CHIP_ID 0x69",
                  "#define LSM6DS3_CHIP_ID 0x69\n#define LSM6DSR_CHIP_ID 0x6B\n#define LSM6DSOX_CHIP_ID 0x6D"
              )

          # В официальном коде detection принимает не все ID.
          # Заменяем switch так, чтобы принимал 0x69/0x6A/0x6B/0x6C/0x6D.
          old = """        switch (tmp) {
          case LSM6DSO_CHIP_ID:
          case LSM6DSL_CHIP_ID:
              lsm6dID = tmp;
              // Compatible chip detected
              return true;
          default:
              // Retry detection
              break;
          }"""

          new = """        switch (tmp) {
          case LSM6DS3_CHIP_ID:
          case LSM6DSL_CHIP_ID:
          case LSM6DSR_CHIP_ID:
          case LSM6DSO_CHIP_ID:
          case LSM6DSOX_CHIP_ID:
              lsm6dID = tmp;
              // RUNA FC41 compatible LSM6DXX chip detected
              return true;
          default:
              // Retry detection
              break;
          }"""

          if old not in text:
              print("ERROR: original LSM6DXX detect switch not found")
              raise SystemExit(1)

          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          print("Patched LSM6DXX driver detection:")
          print("Accepted WHO_AM_I: 0x69, 0x6A, 0x6B, 0x6C, 0x6D")
          PY

          echo "==== LSM6DXX IDs ===="
          grep -n -E "LSM6DS|CHIP_ID|case LSM6" src/main/drivers/accgyro/accgyro_lsm6dxx.c || true

      - name: Patch default acc hardware
        run: |
          cd inav
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/fc/settings.yaml")
          text = path.read_text(encoding="utf-8")

          pattern = r"(-\s+name:\s*acc_hardware\b(?:(?!\n\s*-\s+name:).)*?default_value:\s*)([^\n\r]+)"

          def repl(m):
              print("Old acc_hardware default:", m.group(2).strip())
              return m.group(1) + "LSM6DXX"

          new_text, count = re.subn(pattern, repl, text, count=1, flags=re.S)

          if count == 1:
              path.write_text(new_text, encoding="utf-8")
              print("acc_hardware default = LSM6DXX")
          else:
              print("WARNING: acc_hardware default not found")
          PY

      - name: Patch RUNA name
        run: |
          cd inav
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/fc/fc_msp.c")
          text = path.read_text(encoding="utf-8")

          pattern = r'sbufWriteU8\(dst,\s*strlen\(targetName\)\);\s*sbufWriteData\(dst,\s*targetName,\s*strlen\(targetName\)\);'

          replacement = '''sbufWriteU8(dst, strlen(targetName) + 5);
                  sbufWriteData(dst, targetName, strlen(targetName));
                  sbufWriteData(dst, "+RUNA", 5);'''

          new_text, count = re.subn(pattern, replacement, text, count=1)

          if count == 1:
              path.write_text(new_text, encoding="utf-8")
              print("Patched target name: +RUNA")
          else:
              print("WARNING: targetName MSP patch not found")
          PY

      - name: Patch startup text
        run: |
          cd inav
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/main/io/osd.c")
          text = path.read_text(encoding="utf-8")

          old = 'tfp_sprintf(string_buffer, "INAV VERSION: %s", FC_VERSION_STRING);'
          new = 'tfp_sprintf(string_buffer, "version RUNA 1.0");'

          if old in text:
              text = text.replace(old, new, 1)
              text = text.replace(
                  'uint8_t xPos = (osdDisplayPort->cols - 19) / 2;',
                  'uint8_t xPos = OSD_CENTER_S(string_buffer);',
                  1
              )
              path.write_text(text, encoding="utf-8")
              print("Startup text patched: version RUNA 1.0")
          else:
              print("WARNING: startup text line not found")
          PY

      - name: Configure CMake
        run: |
          cd inav
          mkdir -p build
          cd build
          cmake ..

      - name: Build SPEEDYBEEF405WING
        run: |
          cd inav/build
          make clean_${TARGET} || true
          make ${TARGET} -j2 VERBOSE=1

      - name: Find firmware
        if: always()
        run: |
          echo "===== BUILT FILES ====="
          find inav/build -type f \( -name "*.hex" -o -name "*.bin" -o -name "*.elf" \) -print || true

      - name: Collect firmware
        if: success()
        run: |
          mkdir -p out/${TARGET}

          python3 <<'PY'
          from pathlib import Path
          import shutil
          import os

          target = os.environ["TARGET"]
          build_dir = Path("inav/build")
          out_dir = Path("out") / target
          out_dir.mkdir(parents=True, exist_ok=True)

          copied = 0
          for file in build_dir.rglob("*"):
              if not file.is_file():
                  continue
              if file.suffix.lower() not in {".hex", ".bin", ".elf"}:
                  continue
              if target not in file.name:
                  continue

              dst = out_dir / f"RUNA_FC41_LSM6DXX_DRIVERPATCH_{file.name}"
              shutil.copy2(file, dst)
              print("Copied:", dst)
              copied += 1

          if copied == 0:
              print("ERROR: no firmware files found")
              raise SystemExit(1)
          PY

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RUNA-FC41-LSM6DXX-DRIVERPATCH
          path: out/${{ env.TARGET }}/*
