name: Build STM32F405 LSM6DXX I2C BEEPER Scanner

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - beeper_name: BEEPER_PA0_LOW
            beeper_port: A
            beeper_pin: 0
            active_low: 1
          - beeper_name: BEEPER_PA0_HIGH
            beeper_port: A
            beeper_pin: 0
            active_low: 0

          - beeper_name: BEEPER_PA1_LOW
            beeper_port: A
            beeper_pin: 1
            active_low: 1
          - beeper_name: BEEPER_PA1_HIGH
            beeper_port: A
            beeper_pin: 1
            active_low: 0

          - beeper_name: BEEPER_PA8_LOW
            beeper_port: A
            beeper_pin: 8
            active_low: 1
          - beeper_name: BEEPER_PA8_HIGH
            beeper_port: A
            beeper_pin: 8
            active_low: 0

          - beeper_name: BEEPER_PB2_LOW
            beeper_port: B
            beeper_pin: 2
            active_low: 1
          - beeper_name: BEEPER_PB2_HIGH
            beeper_port: B
            beeper_pin: 2
            active_low: 0

          - beeper_name: BEEPER_PB5_LOW
            beeper_port: B
            beeper_pin: 5
            active_low: 1
          - beeper_name: BEEPER_PB5_HIGH
            beeper_port: B
            beeper_pin: 5
            active_low: 0

          - beeper_name: BEEPER_PB8_LOW
            beeper_port: B
            beeper_pin: 8
            active_low: 1
          - beeper_name: BEEPER_PB8_HIGH
            beeper_port: B
            beeper_pin: 8
            active_low: 0

          - beeper_name: BEEPER_PB9_LOW
            beeper_port: B
            beeper_pin: 9
            active_low: 1
          - beeper_name: BEEPER_PB9_HIGH
            beeper_port: B
            beeper_pin: 9
            active_low: 0

          - beeper_name: BEEPER_PC13_LOW
            beeper_port: C
            beeper_pin: 13
            active_low: 1
          - beeper_name: BEEPER_PC13_HIGH
            beeper_port: C
            beeper_pin: 13
            active_low: 0

    env:
      PROJECT: stm32f405_lsm6dxx_i2c_beeper_scanner

    steps:
      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            make \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            python3

      - name: Create I2C beeper scanner source
        run: |
          mkdir -p ${PROJECT}

          cat > ${PROJECT}/main.c <<'EOF'
          /*
           * STM32F405 LSM6DXX I2C BEEPER scanner
           *
           * Diagnostic only.
           * Do not fly.
           * Do not install propeller.
           *
           * Startup:
           *   3 short beeps = firmware started.
           *
           * Not found:
           *   long beep, pause, repeat.
           *
           * Found:
           *   long beeps  = I2C config number
           *   short beeps = address number
           *
           * Example:
           *   2 long + 1 short = I2C config 2, address 0x6A
           */

          #include <stdint.h>

          #define BEEPER_PORT_LETTER '${{ matrix.beeper_port }}'
          #define BEEPER_PIN_NUM     ${{ matrix.beeper_pin }}
          #define BEEPER_ACTIVE_LOW  ${{ matrix.active_low }}

          #define RCC_BASE        0x40023800UL
          #define GPIOA_BASE      0x40020000UL
          #define GPIOB_BASE      0x40020400UL
          #define GPIOC_BASE      0x40020800UL

          #define I2C1_BASE       0x40005400UL
          #define I2C2_BASE       0x40005800UL
          #define I2C3_BASE       0x40005C00UL

          #define REG32(addr)     (*(volatile uint32_t *)(addr))

          #define RCC_AHB1ENR     REG32(RCC_BASE + 0x30)
          #define RCC_APB1ENR     REG32(RCC_BASE + 0x40)

          #define GPIO_MODER(p)   REG32((p) + 0x00)
          #define GPIO_OTYPER(p)  REG32((p) + 0x04)
          #define GPIO_OSPEEDR(p) REG32((p) + 0x08)
          #define GPIO_PUPDR(p)   REG32((p) + 0x0C)
          #define GPIO_BSRR(p)    REG32((p) + 0x18)
          #define GPIO_AFRL(p)    REG32((p) + 0x20)
          #define GPIO_AFRH(p)    REG32((p) + 0x24)

          #define I2C_CR1(i)      REG32((i) + 0x00)
          #define I2C_CR2(i)      REG32((i) + 0x04)
          #define I2C_OAR1(i)     REG32((i) + 0x08)
          #define I2C_DR(i)       REG32((i) + 0x10)
          #define I2C_SR1(i)      REG32((i) + 0x14)
          #define I2C_SR2(i)      REG32((i) + 0x18)
          #define I2C_CCR(i)      REG32((i) + 0x1C)
          #define I2C_TRISE(i)    REG32((i) + 0x20)

          #define I2C_CR1_PE      (1U << 0)
          #define I2C_CR1_START   (1U << 8)
          #define I2C_CR1_STOP    (1U << 9)
          #define I2C_CR1_ACK     (1U << 10)
          #define I2C_CR1_SWRST   (1U << 15)

          #define I2C_SR1_SB      (1U << 0)
          #define I2C_SR1_ADDR    (1U << 1)
          #define I2C_SR1_BTF     (1U << 2)
          #define I2C_SR1_RXNE    (1U << 6)
          #define I2C_SR1_TXE     (1U << 7)
          #define I2C_SR1_AF      (1U << 10)

          #define LSM6DXX_WHOAMI_REG 0x0F

          typedef struct {
              uint32_t i2c;
              uint32_t scl_port;
              uint8_t scl_pin;
              uint8_t scl_af;
              uint32_t sda_port;
              uint8_t sda_pin;
              uint8_t sda_af;
              uint8_t config_number;
          } i2c_config_t;

          static void delay_cycles(volatile uint32_t n)
          {
              while (n--) {
                  __asm volatile ("nop");
              }
          }

          static void delay_ms(uint32_t ms)
          {
              while (ms--) {
                  delay_cycles(4000);
              }
          }

          static uint32_t port_by_letter(char c)
          {
              if (c == 'A') return GPIOA_BASE;
              if (c == 'B') return GPIOB_BASE;
              return GPIOC_BASE;
          }

          static uint32_t beeper_port(void)
          {
              return port_by_letter(BEEPER_PORT_LETTER);
          }

          static void gpio_output(uint32_t port, uint8_t pin)
          {
              GPIO_MODER(port) &= ~(3U << (pin * 2));
              GPIO_MODER(port) |=  (1U << (pin * 2));
              GPIO_OTYPER(port) &= ~(1U << pin);
              GPIO_OSPEEDR(port) &= ~(3U << (pin * 2));
              GPIO_OSPEEDR(port) |=  (2U << (pin * 2));
              GPIO_PUPDR(port) &= ~(3U << (pin * 2));
          }

          static void gpio_af_od_pullup(uint32_t port, uint8_t pin, uint8_t af)
          {
              GPIO_MODER(port) &= ~(3U << (pin * 2));
              GPIO_MODER(port) |=  (2U << (pin * 2));

              GPIO_OTYPER(port) |= (1U << pin); // open-drain

              GPIO_OSPEEDR(port) &= ~(3U << (pin * 2));
              GPIO_OSPEEDR(port) |=  (3U << (pin * 2));

              GPIO_PUPDR(port) &= ~(3U << (pin * 2));
              GPIO_PUPDR(port) |=  (1U << (pin * 2)); // pull-up

              if (pin < 8) {
                  GPIO_AFRL(port) &= ~(0xFU << (pin * 4));
                  GPIO_AFRL(port) |=  ((uint32_t)af << (pin * 4));
              } else {
                  uint8_t p = pin - 8;
                  GPIO_AFRH(port) &= ~(0xFU << (p * 4));
                  GPIO_AFRH(port) |=  ((uint32_t)af << (p * 4));
              }
          }

          static void gpio_set_pin(uint32_t port, uint8_t pin)
          {
              GPIO_BSRR(port) = (1U << pin);
          }

          static void gpio_clear_pin(uint32_t port, uint8_t pin)
          {
              GPIO_BSRR(port) = (1U << (pin + 16));
          }

          static void beeper_on(void)
          {
              if (BEEPER_ACTIVE_LOW) {
                  gpio_clear_pin(beeper_port(), BEEPER_PIN_NUM);
              } else {
                  gpio_set_pin(beeper_port(), BEEPER_PIN_NUM);
              }
          }

          static void beeper_off(void)
          {
              if (BEEPER_ACTIVE_LOW) {
                  gpio_set_pin(beeper_port(), BEEPER_PIN_NUM);
              } else {
                  gpio_clear_pin(beeper_port(), BEEPER_PIN_NUM);
              }
          }

          static void beeper_setup(void)
          {
              gpio_output(beeper_port(), BEEPER_PIN_NUM);
              beeper_off();
          }

          static void beep_short(void)
          {
              beeper_on();
              delay_ms(120);
              beeper_off();
              delay_ms(180);
          }

          static void beep_long(void)
          {
              beeper_on();
              delay_ms(550);
              beeper_off();
              delay_ms(300);
          }

          static void startup_beep(void)
          {
              beep_short();
              beep_short();
              beep_short();
              delay_ms(1000);
          }

          static void beep_not_found(void)
          {
              while (1) {
                  beep_long();
                  delay_ms(1200);
              }
          }

          static void beep_found(uint8_t i2c_config_number, uint8_t addr_number)
          {
              while (1) {
                  for (uint8_t i = 0; i < i2c_config_number; i++) {
                      beep_long();
                  }

                  delay_ms(900);

                  for (uint8_t i = 0; i < addr_number; i++) {
                      beep_short();
                  }

                  delay_ms(1800);
              }
          }

          static const i2c_config_t i2c_configs[] = {
              { I2C1_BASE, GPIOB_BASE, 6, 4, GPIOB_BASE, 7, 4, 1 },  // I2C1 PB6/PB7
              { I2C1_BASE, GPIOB_BASE, 8, 4, GPIOB_BASE, 9, 4, 2 },  // I2C1 PB8/PB9
              { I2C2_BASE, GPIOB_BASE, 10, 4, GPIOB_BASE, 11, 4, 3 }, // I2C2 PB10/PB11
              { I2C3_BASE, GPIOA_BASE, 8, 4, GPIOC_BASE, 9, 4, 4 },  // I2C3 PA8/PC9
          };

          static const uint8_t i2c_addrs[] = {
              0x6A,
              0x6B,
          };

          static void clocks_setup(void)
          {
              RCC_AHB1ENR |= (1U << 0) | (1U << 1) | (1U << 2); // GPIO A/B/C
              RCC_APB1ENR |= (1U << 21) | (1U << 22) | (1U << 23); // I2C1/2/3
              delay_ms(10);
          }

          static uint8_t wait_flag_set(uint32_t reg_addr, uint32_t mask, uint32_t timeout)
          {
              while (!(REG32(reg_addr) & mask)) {
                  if (--timeout == 0) {
                      return 0;
                  }
              }
              return 1;
          }

          static uint8_t wait_flag_clear(uint32_t reg_addr, uint32_t mask, uint32_t timeout)
          {
              while (REG32(reg_addr) & mask) {
                  if (--timeout == 0) {
                      return 0;
                  }
              }
              return 1;
          }

          static void i2c_reset(uint32_t i2c)
          {
              I2C_CR1(i2c) |= I2C_CR1_SWRST;
              delay_ms(2);
              I2C_CR1(i2c) &= ~I2C_CR1_SWRST;
              delay_ms(2);
          }

          static void i2c_setup(const i2c_config_t *cfg)
          {
              gpio_af_od_pullup(cfg->scl_port, cfg->scl_pin, cfg->scl_af);
              gpio_af_od_pullup(cfg->sda_port, cfg->sda_pin, cfg->sda_af);

              i2c_reset(cfg->i2c);

              I2C_CR1(cfg->i2c) = 0;

              /*
               * APB1 default is around 16 MHz on HSI in this baremetal setup.
               * Standard mode 100 kHz.
               */
              I2C_CR2(cfg->i2c) = 16;
              I2C_CCR(cfg->i2c) = 80;
              I2C_TRISE(cfg->i2c) = 17;

              I2C_CR1(cfg->i2c) |= I2C_CR1_PE;
              delay_ms(2);
          }

          static uint8_t i2c_read_reg(uint32_t i2c, uint8_t addr, uint8_t reg, uint8_t *out)
          {
              volatile uint32_t tmp;

              I2C_SR1(i2c) &= ~I2C_SR1_AF;

              I2C_CR1(i2c) |= I2C_CR1_START;
              if (!wait_flag_set(i2c + 0x14, I2C_SR1_SB, 100000)) {
                  I2C_CR1(i2c) |= I2C_CR1_STOP;
                  return 0;
              }

              I2C_DR(i2c) = (addr << 1) | 0;
              if (!wait_flag_set(i2c + 0x14, I2C_SR1_ADDR | I2C_SR1_AF, 100000)) {
                  I2C_CR1(i2c) |= I2C_CR1_STOP;
                  return 0;
              }

              if (I2C_SR1(i2c) & I2C_SR1_AF) {
                  I2C_SR1(i2c) &= ~I2C_SR1_AF;
                  I2C_CR1(i2c) |= I2C_CR1_STOP;
                  return 0;
              }

              tmp = I2C_SR2(i2c);
              (void)tmp;

              I2C_DR(i2c) = reg;
              if (!wait_flag_set(i2c + 0x14, I2C_SR1_TXE, 100000)) {
                  I2C_CR1(i2c) |= I2C_CR1_STOP;
                  return 0;
              }

              I2C_CR1(i2c) |= I2C_CR1_START;
              if (!wait_flag_set(i2c + 0x14, I2C_SR1_SB, 100000)) {
                  I2C_CR1(i2c) |= I2C_CR1_STOP;
                  return 0;
              }

              I2C_DR(i2c) = (addr << 1) | 1;
              if (!wait_flag_set(i2c + 0x14, I2C_SR1_ADDR | I2C_SR1_AF, 100000)) {
                  I2C_CR1(i2c) |= I2C_CR1_STOP;
                  return 0;
              }

              if (I2C_SR1(i2c) & I2C_SR1_AF) {
                  I2C_SR1(i2c) &= ~I2C_SR1_AF;
                  I2C_CR1(i2c) |= I2C_CR1_STOP;
                  return 0;
              }

              I2C_CR1(i2c) &= ~I2C_CR1_ACK;

              tmp = I2C_SR2(i2c);
              (void)tmp;

              I2C_CR1(i2c) |= I2C_CR1_STOP;

              if (!wait_flag_set(i2c + 0x14, I2C_SR1_RXNE, 100000)) {
                  return 0;
              }

              *out = (uint8_t)I2C_DR(i2c);
              return 1;
          }

          static uint8_t is_lsm6dxx_id(uint8_t id)
          {
              return id == 0x69 ||
                     id == 0x6A ||
                     id == 0x6B ||
                     id == 0x6C ||
                     id == 0x6D;
          }

          int main(void)
          {
              clocks_setup();

              beeper_setup();
              startup_beep();

              delay_ms(1000);

              for (unsigned i = 0; i < sizeof(i2c_configs) / sizeof(i2c_configs[0]); i++) {
                  const i2c_config_t *cfg = &i2c_configs[i];

                  i2c_setup(cfg);

                  for (unsigned a = 0; a < sizeof(i2c_addrs) / sizeof(i2c_addrs[0]); a++) {
                      uint8_t id = 0xFF;

                      for (uint8_t attempt = 0; attempt < 10; attempt++) {
                          if (i2c_read_reg(cfg->i2c, i2c_addrs[a], LSM6DXX_WHOAMI_REG, &id)) {
                              if (is_lsm6dxx_id(id)) {
                                  beep_found(cfg->config_number, a + 1);
                              }
                          }

                          delay_ms(30);
                      }
                  }

                  I2C_CR1(cfg->i2c) &= ~I2C_CR1_PE;
                  delay_ms(10);
              }

              beep_not_found();
          }
          EOF

          cat > ${PROJECT}/startup.c <<'EOF'
          #include <stdint.h>

          extern int main(void);

          extern uint32_t _estack;
          extern uint32_t _sidata;
          extern uint32_t _sdata;
          extern uint32_t _edata;
          extern uint32_t _sbss;
          extern uint32_t _ebss;

          void reset_handler(void);
          void default_handler(void);

          __attribute__((section(".isr_vector")))
          void (* const vector_table[])(void) = {
              (void (*)(void))(&_estack),
              reset_handler,
              default_handler,
              default_handler,
              default_handler,
              default_handler,
              default_handler,
              0,
              0,
              0,
              0,
              default_handler,
              default_handler,
              0,
              default_handler,
              default_handler,
          };

          void reset_handler(void)
          {
              uint32_t *src = &_sidata;
              uint32_t *dst = &_sdata;

              while (dst < &_edata) {
                  *dst++ = *src++;
              }

              dst = &_sbss;

              while (dst < &_ebss) {
                  *dst++ = 0;
              }

              main();

              while (1) {}
          }

          void default_handler(void)
          {
              while (1) {}
          }
          EOF

          cat > ${PROJECT}/linker.ld <<'EOF'
          MEMORY
          {
              FLASH (rx)  : ORIGIN = 0x08000000, LENGTH = 1024K
              RAM (xrw)   : ORIGIN = 0x20000000, LENGTH = 128K
          }

          _estack = ORIGIN(RAM) + LENGTH(RAM);

          SECTIONS
          {
              .isr_vector :
              {
                  KEEP(*(.isr_vector))
              } > FLASH

              .text :
              {
                  *(.text*)
                  *(.rodata*)
                  . = ALIGN(4);
                  _etext = .;
              } > FLASH

              _sidata = LOADADDR(.data);

              .data : AT(_etext)
              {
                  . = ALIGN(4);
                  _sdata = .;
                  *(.data*)
                  . = ALIGN(4);
                  _edata = .;
              } > RAM

              .bss :
              {
                  . = ALIGN(4);
                  _sbss = .;
                  *(.bss*)
                  *(COMMON)
                  . = ALIGN(4);
                  _ebss = .;
              } > RAM
          }
          EOF

          cat > ${PROJECT}/Makefile <<'EOF'
          PROJECT = i2c_beeper_scanner
          BUILD_DIR = build

          PREFIX ?= arm-none-eabi
          CC = $(PREFIX)-gcc
          OBJCOPY = $(PREFIX)-objcopy
          SIZE = $(PREFIX)-size

          CFLAGS = -Os -g -Wall -Wextra \
              -mcpu=cortex-m4 -mthumb -mfloat-abi=hard -mfpu=fpv4-sp-d16 \
              -ffreestanding -nostdlib

          LDFLAGS = -Tlinker.ld \
              -mcpu=cortex-m4 -mthumb -mfloat-abi=hard -mfpu=fpv4-sp-d16 \
              -nostdlib -Wl,--gc-sections

          SRCS = startup.c main.c
          OBJS = $(SRCS:%.c=$(BUILD_DIR)/%.o)

          all: $(BUILD_DIR)/$(PROJECT).elf $(BUILD_DIR)/$(PROJECT).bin $(BUILD_DIR)/$(PROJECT).hex
          	$(SIZE) $(BUILD_DIR)/$(PROJECT).elf

          $(BUILD_DIR):
          	mkdir -p $(BUILD_DIR)

          $(BUILD_DIR)/%.o: %.c | $(BUILD_DIR)
          	$(CC) $(CFLAGS) -c $< -o $@

          $(BUILD_DIR)/$(PROJECT).elf: $(OBJS)
          	$(CC) $(LDFLAGS) $^ -o $@

          $(BUILD_DIR)/$(PROJECT).bin: $(BUILD_DIR)/$(PROJECT).elf
          	$(OBJCOPY) -O binary $< $@

          $(BUILD_DIR)/$(PROJECT).hex: $(BUILD_DIR)/$(PROJECT).elf
          	$(OBJCOPY) -O ihex $< $@

          clean:
          	rm -rf $(BUILD_DIR)
          EOF

      - name: Build I2C beeper scanner
        run: |
          cd ${PROJECT}
          make clean
          make -j2

      - name: Collect artifacts
        run: |
          mkdir -p out

          cp ${PROJECT}/build/i2c_beeper_scanner.bin out/STM32F405_LSM6DXX_I2C_BEEPER_SCANNER_${{ matrix.beeper_name }}.bin
          cp ${PROJECT}/build/i2c_beeper_scanner.hex out/STM32F405_LSM6DXX_I2C_BEEPER_SCANNER_${{ matrix.beeper_name }}.hex
          cp ${PROJECT}/build/i2c_beeper_scanner.elf out/STM32F405_LSM6DXX_I2C_BEEPER_SCANNER_${{ matrix.beeper_name }}.elf

          cat > out/README_${{ matrix.beeper_name }}.txt <<'EOF'
          STM32F405 LSM6DXX I2C BEEPER SCANNER

          Diagnostic only.
          Do not fly.
          Do not install propeller.

          Startup:
          - 3 short beeps = scanner started.

          Not found:
          - long beep, pause, repeat.

          Found:
          - long beeps  = I2C config number
          - short beeps = address number

          I2C config:
          1 = I2C1 PB6/PB7
          2 = I2C1 PB8/PB9
          3 = I2C2 PB10/PB11
          4 = I2C3 PA8/PC9

          Address:
          1 short = 0x6A
          2 short = 0x6B

          Example:
          2 long + 1 short = I2C1 PB8/PB9, address 0x6A
          EOF

          ls -lah out

      - name: Upload I2C beeper scanner
        uses: actions/upload-artifact@v4
        with:
          name: STM32F405-LSM6DXX-I2C-BEEPER-SCANNER-${{ matrix.beeper_name }}
          path: out/*
          
