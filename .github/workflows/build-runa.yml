name: Build STOCK CADDXF4 INAV 8

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      INAV_VERSION: 8.0.1
      TARGET: CADDXF4_AIO_ELRS

    steps:
      - name: Install deps
        run: |
          sudo apt-get update -y -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            git \
            build-essential \
            g++ \
            ruby \
            cmake \
            make \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-dev \
            ninja-build \
            python3 \
            python3-pip

      - name: Clone INAV 8.0.1
        run: |
          git clone --branch ${INAV_VERSION} --depth 1 https://github.com/iNavFlight/inav.git
          cd inav
          git rev-parse HEAD

      - name: Configure CMake
        run: |
          cd inav
          mkdir -p build
          cd build
          cmake ..

      - name: Check target
        run: |
          cd inav/build
          make help | grep -w "${TARGET}" || {
            echo "Target not found: ${TARGET}"
            exit 1
          }

      - name: Build STOCK firmware
        run: |
          cd inav/build
          make clean_${TARGET} || true
          make ${TARGET} -j$(nproc)

      - name: Collect firmware
        run: |
          mkdir -p out
          find inav/build -type f \( -name "*.hex" -o -name "*.bin" -o -name "*.elf" \) -print
          find inav/build -type f -name "*.hex" -exec cp {} out/ \;
          find inav/build -type f -name "*.bin" -exec cp {} out/ \;
          find inav/build -type f -name "*.elf" -exec cp {} out/ \;

      - name: Upload STOCK firmware
        uses: actions/upload-artifact@v4
        with:
          name: STOCK-CADDXF4-AIO-ELRS-INAV8
          path: out/*
